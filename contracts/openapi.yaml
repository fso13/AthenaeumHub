openapi: 3.1.0
info:
  title: Krug — E2 managed slice contract
  version: 0.1.0
  description: |
    Контракт первого вертикального среза: dev-сессия, список чатов, история,
    отправка текстового сообщения, read receipt и sync.
    Это подмножество docs/SYSTEM-ANALYSIS.md §7; расширение — только через
    обновление этого файла и docs/TASKS.md.
servers:
  - url: http://localhost:8081/api/v1
    description: Локальный dev-порт; 8080 занят другим проектом в окружении
security:
  - bearerAuth: []
tags:
  - name: dev
  - name: chats
  - name: messages
  - name: sync
  - name: auth
  - name: devices
  - name: workspaces
  - name: users
  - name: realtime
  - name: files
  - name: stickers
  - name: plugins
  - name: bots
  - name: notifications
  - name: mentions
  - name: setup
  - name: security
  - name: admin

paths:
  /health:
    get:
      tags: [dev]
      operationId: health
      security: []
      responses:
        "200":
          description: Сервис жив
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }

  /dev/session:
    post:
      tags: [dev]
      operationId: devSession
      security: []
      summary: Dev-only bootstrap (профиль dev; в prod 404)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                  maxLength: 80
                  default: Дмитрий
      responses:
        "200":
          description: Готовая сессия с воркспейсом и чатом
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/NotFound"

  /workspaces/{workspaceId}/chats:
    get:
      tags: [chats]
      operationId: listChats
      summary: Список чатов воркспейса (основной список или личный архив)
      description: >
        По умолчанию возвращает все чаты пользователя, кроме архивированных им лично.
        `archived=true` возвращает только личный архив вызывающего. Архив user-local:
        архивирование одним участником не меняет список других. Элемент `ChatSummary`
        содержит аддитивные `cover_file_id`, `avatar_file_id`, `read_only`, `join_policy` и
        `archived`, а также точный `member_count` (число ACTIVE-участников чата, не
        участников воркспейса).
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DeviceId"
        - name: archived
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: >
            `false`/absent — основной список (без личного архива); `true` — только
            личный архив вызывающего.
      responses:
        "200":
          description: Чаты воркспейса
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [chats]
      operationId: createChat
      summary: Создать DIRECT/GROUP-чат; повтор DIRECT-пары идемпотентен (200)
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCreateRequest"
      responses:
        "201":
          description: Чат создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chat"
        "200":
          description: DIRECT-пара уже существует — возвращается тот же чат
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chat"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: >
            Конфликт состояния. Для создания чата при достижении лимита —
            `409 CHAT_LIMIT_REACHED` с `details.scope` (`USER`|`WORKSPACE`),
            `details.limit` и `details.used`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /workspaces/{workspaceId}/music-room:
    post:
      tags: [plugins]
      operationId: openMusicRoom
      summary: Открыть музыкальную комнату воркспейса (идемпотентно)
      description: >
        Идемпотентный find-or-create единственной музыкальной комнаты воркспейса.
        Комнатой считается GROUP-канал, помеченный в `chat.plugin_rooms` для плагина
        `music-room`: имя канала не используется для поиска, поэтому переименование
        безопасно. Если комнаты нет, создаётся managed GROUP-канал `PUBLIC`/`OPEN` с
        именем «Музыкальная комната»: создатель — `OWNER`, все ACTIVE-участники
        воркспейса добавляются, плагин включается в канале. Повторный вызов возвращает
        существующий канал с `200` и не расходует лимит чатов; создание — `201`. Только
        ACTIVE-участник воркспейса, иначе `403`. Лимиты установки (`CHAT_LIMIT_REACHED`,
        `details.scope`) проверяются только при фактическом создании. Выключенный
        каталог — `422 PLUGIN_DISABLED`; E2EE-воркспейс — `422 PLUGIN_NOT_AVAILABLE`
        (плагин `MANAGED`, E2EE GROUP не поддерживается). Конкурентные вызовы
        сериализуются advisory-локом и PK `(workspace_id, plugin_id)`, поэтому дубликат
        канала невозможен. Сервер не хранит аудио и состояние воспроизведения и не
        создаёт SFU-сессию: фронтенд перечисляет AUDIO-вложения канала и микширует звук
        в звонок локально.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "201":
          description: Комната создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MusicRoomOpen"
        "200":
          description: Комната уже существует — возвращается тот же канал
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MusicRoomOpen"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: >
            `409 CHAT_LIMIT_REACHED` при фактическом создании, если достигнут лимит
            установки; `details.scope` — `USER`|`WORKSPACE`, `details.limit`,
            `details.used`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /workspaces/{workspaceId}/members:
    get:
      tags: [workspaces]
      operationId: listWorkspaceMembers
      summary: Активные участники воркспейса для DIRECT-чата
      description: >
        Только активные членства (`ACTIVE`) в активном воркспейсе и активные
        пользователи. Поля — `user_id`, `display_name`, `role`, `joined_at`; email,
        пароли, устройства и ключи не возвращаются. Вызывающий должен быть активным
        участником воркспейса: чужая или неизвестная workspace даёт `403` без раскрытия
        факта её существования. Поиск — literal-подстрока по `display_name` без учёта
        регистра; стабильный порядок `display_name ASC, user_id ASC`; `cursor`
        непрозрачен и привязан к воркспейсу; `has_more` вычисляется по `limit + 1`.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DeviceId"
        - name: query
          in: query
          required: false
          schema: { type: string, maxLength: 80 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Страница активных участников
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMemberPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [workspaces]
      operationId: addWorkspaceMember
      summary: Добавить существующего пользователя в воркспейс по email
      description: >
        Вызывающий должен быть ACTIVE OWNER/ADMIN воркспейса (иначе `403 FORBIDDEN`,
        существование чужой/неизвестной workspace не раскрывается). Добавлять можно
        только существующий ACTIVE-аккаунт: неизвестный или неактивный email даёт
        `404 USER_NOT_FOUND`, приглашения на незарегистрированный email — v1.1. OWNER
        назначать нельзя (`403 ROLE_CHANGE_FORBIDDEN`), ADMIN может назначать только
        `MEMBER`/`GUEST`. Проверка `max_workspace_members` и вставка выполняются в одной
        транзакции под per-workspace advisory lock; превышение — `409
        WORKSPACE_MEMBER_LIMIT_REACHED` с `details.limit/used`, повтор (включая ранее
        удалённого) — `409 MEMBER_ALREADY_EXISTS`. Событие аудита содержит только
        `user_id` и `role`, без email и display name.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddWorkspaceMemberRequest"
      responses:
        "201":
          description: Участник добавлен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /workspaces/{workspaceId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: "#/components/parameters/DeviceId"
    patch:
      tags: [workspaces]
      operationId: changeWorkspaceMemberRole
      summary: Изменить роль участника воркспейса
      description: >
        OWNER управляет ролями ADMIN/MEMBER/GUEST; ADMIN — только MEMBER/GUEST и не может
        менять OWNER/другого ADMIN. Назначить OWNER нельзя, последнего OWNER нельзя
        понизить, менять собственную роль нельзя. Нарушение прав — `403
        ROLE_CHANGE_FORBIDDEN` (или `403 FORBIDDEN` для не-OWNER/ADMIN), self — `409
        SELF_ACTION_FORBIDDEN`, последний OWNER — `409 LAST_OWNER`; неизвестное активное
        членство — `404 MEMBER_NOT_FOUND`. Повтор той же роли идемпотентен (`200`) и не
        создаёт аудит-событие. Аудит содержит `previous_role`/`role`, без email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeWorkspaceMemberRoleRequest"
      responses:
        "200":
          description: Роль изменена (или уже была такой)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [workspaces]
      operationId: removeWorkspaceMember
      summary: Удалить участника воркспейса
      description: >
        Мягкое удаление (`status = 'REMOVED'`): строка членства и `joined_at`
        сохраняются. Удалённый теряет доступ к воркспейсу и его чатам при следующем
        запросе; уже выданные access-токены не отзываются (проверка прав выполняется на
        каждом запросе). OWNER может удалять ADMIN/MEMBER/GUEST, ADMIN — только
        MEMBER/GUEST; нельзя удалить себя и последнего OWNER (`409
        SELF_ACTION_FORBIDDEN`/`LAST_OWNER`). Аудит содержит `user_id` и `role`.
      responses:
        "204":
          description: Участник удалён (soft)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /workspaces/{workspaceId}/members/me:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/DeviceId"
    delete:
      tags: [workspaces]
      operationId: leaveWorkspace
      summary: Выйти из воркспейса (self-leave)
      description: >
        ACTIVE-участник удаляет собственное членство: строка становится `REMOVED`,
        `joined_at` сохраняется, все участия в чатах этого воркспейса также становятся
        `REMOVED`. Пользователь сразу теряет доступ к списку чатов, участникам, сессиям,
        файлам и realtime-подпискам воркспейса; `GET /me` перестаёт его возвращать, а
        точный `member_count` чатов уменьшается. Повторный вызов (в том числе после
        удаления администратором) идемпотентен — `204` без нового аудит-события.
        Последний ACTIVE OWNER выйти не может — `409 LAST_OWNER` (в текущей схеме OWNER
        ровно один; правило проверяется по живому счётчику). Stateless access-токены не
        отзываются глобально: доступ перепроверяется на каждом запросе. Аудит содержит
        `user_id` (вызывающий), `role` и число удалённых участий в чатах.
      responses:
        "204":
          description: Вы вышли из воркспейса (или уже не были ACTIVE-участником)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /setup/status:
    get:
      tags: [setup]
      operationId: getSetupStatus
      security: []
      summary: Публичный статус первичной настройки (без секретов)
      responses:
        "200":
          description: Нужна ли первичная настройка и открыта ли регистрация
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"

  /admin/settings:
    get:
      tags: [admin]
      operationId: getAdminSettings
      summary: Системные параметры установки (platform_admin)
      responses:
        "200":
          description: Параметры без SMTP-пароля
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      tags: [admin]
      operationId: updateAdminSettings
      summary: Частично обновить параметры или завершить setup (platform_admin)
      description: >
        `complete_setup=true` атомарно завершает первичную настройку; повторная попытка —
        `409 SETUP_ALREADY_COMPLETED`. SMTP-пароль только на запись, в ответах и логах
        отсутствует. Пустое поле `smtp_password` означает «не менять».
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSettingsPatch"
      responses:
        "200":
          description: Сохранённые параметры без SMTP-пароля
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Setup уже завершён (`SETUP_ALREADY_COMPLETED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /admin/settings/test-email:
    post:
      tags: [admin]
      operationId: testAdminEmail
      summary: Отправить тестовое письмо с текущими SMTP-настройками (platform_admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestEmailRequest"
      responses:
        "202":
          description: Письмо принято SMTP-релеем
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestEmailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /admin/overview:
    get:
      tags: [admin]
      operationId: getAdminOverview
      summary: Агрегированный обзор установки (platform_admin)
      responses:
        "200":
          description: Количество пользователей, воркспейсов и чатов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/users:
    get:
      tags: [admin]
      operationId: listAdminUsers
      summary: Список пользователей установки (platform_admin)
      description: >
        Метаданные и агрегаты: email, display name, статус, флаг platform_admin, число
        активных воркспейсов/чатов, использованное место и дата регистрации. Поиск по
        email/display name. Непрозрачный cursor и стабильный порядок
        `created_at DESC, id DESC`. Контент сообщений, E2EE-конверты и содержимое файлов
        не возвращаются; удалённые пользователи в выдачу не попадают. Каждое чтение
        пишет audit-событие `admin.users.viewed` (только счётчики).
      parameters:
        - name: query
          in: query
          required: false
          schema: { type: string, maxLength: 254 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        "200":
          description: Страница пользователей
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/users/{userId}/suspend:
    post:
      tags: [admin]
      operationId: suspendAdminUser
      summary: Приостановить пользователя (platform_admin)
      description: >
        `auth.users.status` → `SUSPENDED`; Keycloak-пользователь выключается, все его
        активные Keycloak-сессии отзываются (`POST /admin/realms/{realm}/users/{id}/logout`,
        refresh-токены перестают работать), live WS-сессии закрываются кадром
        `session.revoked` и close 4403. Действие аудируется (`admin.user.suspended`),
        metadata — только предыдущий/новый статус. Повторная приостановка →
        `409 USER_ALREADY_SUSPENDED`; себя приостановить нельзя (`409
        SELF_ACTION_FORBIDDEN`), последнего platform_admin — нельзя (`409
        LAST_PLATFORM_ADMIN`, атомарная проверка в БД). Неизвестный или удалённый
        пользователь → `404`. Ответ без тела.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Пользователь приостановлен
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /admin/users/{userId}/activate:
    post:
      tags: [admin]
      operationId: activateAdminUser
      summary: Реактивировать пользователя (platform_admin)
      description: >
        `auth.users.status` → `ACTIVE`, Keycloak-пользователь снова включается; отзыв
        сессий при активации не требуется. Действие аудируется
        (`admin.user.activated`), metadata — только предыдущий/новый статус. Повторная
        активация → `409 USER_ALREADY_ACTIVE`; неизвестный или удалённый пользователь →
        `404`. Ответ без тела.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Пользователь активирован
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /admin/chats:
    get:
      tags: [admin]
      operationId: listAdminChats
      summary: Список чатов across workspaces (platform_admin)
      description: >
        Метаданные чатов: workspace, тип, режим, число участников/сообщений и последняя
        активность. Фильтры `workspace_id`, `type`, поиск по имени чата. Непрозрачный
        cursor и стабильный порядок `created_at DESC, id DESC`. Текст сообщений,
        E2EE-конверты и файлы не возвращаются; удалённые чаты/воркспейсы не попадают в
        выдачу. `messages_count` — число выделенных последовательностей (`chat_counters`).
        Каждое чтение пишет audit-событие `admin.chats.viewed` (только счётчики).
      parameters:
        - name: workspace_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: query
          in: query
          required: false
          schema: { type: string, maxLength: 120 }
        - name: type
          in: query
          required: false
          schema: { type: string, enum: [DIRECT, GROUP] }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        "200":
          description: Страница чатов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminChatPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/chats/{chatId}:
    delete:
      tags: [admin]
      operationId: deleteAdminChat
      summary: Soft-delete чата (platform_admin)
      description: >
        Проставляет `chats.deleted_at` и не удаляет физически ни чат, ни сообщения, ни
        вложения: участники перестают видеть чат в списках и получать доступ к сообщениям,
        но данные сохраняются для аудита/восстановления. Действие аудируется
        (`admin.chat.deleted`), metadata — только id воркспейса и число участников, без
        имени чата и текста сообщений. Повторный вызов → `409 CHAT_ALREADY_DELETED`
        (осознанный выбор вместо тихого 204: UI отличает retry от успеха). Неизвестный
        чат → `404`. Ответ без тела.
      parameters:
        - name: chatId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Чат помечен удалённым (soft-delete)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /admin/storage:
    get:
      tags: [admin]
      operationId: getAdminStorage
      summary: Storage dashboard по воркспейсам (platform_admin)
      description: >
        Агрегаты хранения: `used_bytes`/`reserved_bytes` из `file.workspace_usage`,
        число объектов и вложений, разбивка по воркспейсам (и опциональный фильтр
        `workspace_id`). Только агрегаты: имена файлов, object keys, содержимое и E2EE
        не возвращаются. Каждое чтение пишет audit-событие `admin.storage.viewed`
        (только счётчики).
      parameters:
        - name: workspace_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Итоги и разбивка по воркспейсам
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStorage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/audit:
    get:
      tags: [admin]
      operationId: listAdminAudit
      summary: Audit-лог установки (platform_admin)
      description: >
        Cross-tenant страница append-only audit-лога с непрозрачным cursor и стабильным
        порядком `created_at DESC, id DESC`; опциональный точный фильтр `action`. Каждая
        строка содержит только `id`, `action`, `actor_id`, `actor_email`, `target_type`,
        `target_id`, `created_at`: metadata JSONB, хэши цепочки, request id, тела
        сообщений, E2EE-конверты, имена файлов и секреты не возвращаются. Чтение аудита
        само аудируется (`admin.audit.viewed`, только счётчики). Hash-chain не меняется.
      parameters:
        - name: action
          in: query
          required: false
          description: Точное имя действия (например `admin.user.suspended`)
          schema: { type: string, maxLength: 120 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        "200":
          description: Страница audit-лога
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuditPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/audit/export:
    get:
      tags: [admin]
      operationId: exportAdminAudit
      summary: Ограниченный экспорт audit-лога установки (CSV/JSON)
      description: >
        platform_admin. Читает append-only `audit.audit_events` через отдельную
        SECURITY DEFINER функцию, которая повторно проверяет platform_admin. Те же
        колонки, что у страницы (`id`, `action`, `actor_id`, `actor_email`,
        `target_type`, `target_id`, `created_at`); metadata JSONB, хэши hash-chain и
        request id не покидают БД. Экспорт ограничен 10 000 строк: при большем совпадении
        возвращаются первые 10 000 и `X-Export-Truncated: true`. `format=csv` — RFC 4180
        (`text/csv; charset=UTF-8`), `format=json` — объект `AdminAuditExport`. Сам экспорт
        аудируется (`admin.audit.exported`, только format/returned/truncated).
      parameters:
        - name: format
          in: query
          required: true
          schema: { type: string, enum: [csv, json] }
        - name: action
          in: query
          required: false
          description: Точное имя действия
          schema: { type: string, maxLength: 120 }
      responses:
        "200":
          description: Экспорт audit-лога
          headers:
            X-Export-Rows:
              schema: { type: integer }
            X-Export-Truncated:
              schema: { type: boolean }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuditExport"
            text/csv:
              schema: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/sessions:
    get:
      tags: [admin]
      operationId: listAdminSessions
      summary: Сессии выбранного пользователя (platform_admin)
      description: >
        `user_id` обязателен. Локальный пользователь разрешается в непрозрачный Keycloak
        subject через SECURITY DEFINER функцию, повторно проверяющую platform_admin;
        неизвестный пользователь/identity — `404 USER_NOT_FOUND`. Возвращаются только id,
        client-derived device label и timestamps; IP-адрес, username, email и токены не
        пересекают границу. Порядок `last_seen_at DESC, id DESC`, cursor привязан к
        `user_id`. `current` отмечает сессию вызывающего по claim `sid`, если выбран он
        сам. Keycloak недоступен — `503 AUTH_UNAVAILABLE`. Чтение аудируется
        (`admin.sessions.viewed`, только счётчики).
      parameters:
        - name: user_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        "200":
          description: Страница сессий
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /admin/sessions/{sessionId}:
    delete:
      tags: [admin]
      operationId: revokeAdminSession
      summary: Отозвать сессию по id (platform_admin)
      description: >
        Отзывает одну сессию Keycloak по её id без необходимости знать владельца
        (realm-level endpoint Keycloak 26). Идемпотентно: уже отозванная/неизвестная
        сессия — `204`, без побочных эффектов. Keycloak недоступен — `503
        AUTH_UNAVAILABLE`. Аудит хранит target id (если это uuid) и не хранит IP,
        username, токены или содержимое.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "204":
          description: Сессия отозвана (идемпотентно)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /admin/users/{userId}/revoke-sessions:
    post:
      tags: [admin]
      operationId: revokeAdminUserSessions
      summary: Отозвать все сессии пользователя (platform_admin)
      description: >
        Отзывает все активные Keycloak-сессии выбранного пользователя (`POST
        .../users/{id}/logout`). Локальный пользователь разрешается в Keycloak subject
        через SECURITY DEFINER функцию, повторно проверяющую platform_admin; неизвестный
        пользователь/identity — `404 USER_NOT_FOUND`. Возвращает только счётчики
        `revoked_sessions`/`affected_users`; session id, IP, username и токены не
        возвращаются. Действие аудируется (`admin.sessions.revoked_all`, только счётчики).
        Keycloak недоступен — `503 AUTH_UNAVAILABLE`; операция best-effort.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Сессии отозваны
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionRevokeAll"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /admin/plugins/translate:
    get:
      tags: [admin, plugins]
      operationId: getAdminTranslationProvider
      summary: Настройки translation-провайдера (platform_admin)
      description: >
        Возвращает действующую конфигурацию `{enabled, url}`. Явная настройка
        администратора имеет приоритет; пока строки нет, действует fallback
        `KRUG_PLUGINS_TRANSLATE_URL`. Секретов/API-ключей в конфигурации нет, URL не
        логируется.
      responses:
        "200":
          description: Действующие настройки
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranslationProviderSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      tags: [admin, plugins]
      operationId: updateAdminTranslationProvider
      summary: Изменить translation-провайдера (platform_admin)
      description: >
        Частичное обновление; минимум одно поле. `url` — только абсолютный `https` URL с
        опциональным path; credentials/userinfo, query и fragment запрещены, длина
        ≤ 2048 (`422 TRANSLATION_URL_INVALID`). Включение без сохранённого и без
        environment URL — `422 TRANSLATION_URL_REQUIRED`. Повтор с теми же значениями
        идемпотентен и не создаёт второй audit-события. Аудит содержит `enabled` и
        `url_changed`, но не сам URL. Секреты не хранятся.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranslationProviderUpdate"
      responses:
        "200":
          description: Настройки сохранены
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranslationProviderSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /admin/plugins/translate/test:
    post:
      tags: [admin, plugins]
      operationId: testAdminTranslationProvider
      summary: Проверить доступность translation-провайдера (platform_admin)
      description: >
        Один ограниченный по timeouts/size probe с константным текстом; ответ провайдера
        не возвращается и не логируется. `status` — `OK`, `DISABLED` (провайдер выключен,
        сетевого вызова нет) или `UNAVAILABLE` (ошибка/таймаут/непригодный ответ).
        `latency_ms` — измеренная длительность (0 для DISABLED). Тест аудируется
        (`admin.plugin.translate.tested`, только status/latency).
      responses:
        "200":
          description: Результат проверки
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranslationProviderTest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/plugins:
    get:
      tags: [admin, plugins]
      operationId: listAdminPlugins
      summary: Установленные внешние плагины (platform_admin)
      description: >
        Только внешние пакеты (`kind=EXTERNAL`), установленные администратором
        платформы. Встроенные плагины в этот список не входят. Метаданные содержат
        версию, автора, entry, permissions/modes, размер архива, число файлов и
        SHA-256 архива; байты ассетов и object keys не возвращаются.
      responses:
        "200":
          description: Список установленных внешних пакетов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPluginPackageList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [admin, plugins]
      operationId: installPluginPackage
      summary: Установить внешний плагин из ZIP (platform_admin)
      description: >
        Принимает `multipart/form-data` с единственной частью `file`. ZIP проверяется
        безопасно: максимум 5 MiB архива, 10 MiB распакованных данных, 200 файлов,
        запрещены symlink, traversal, абсолютные пути, дубликаты и шифрованные записи;
        `manifest.json` в корне должен соответствовать manifest v1, а `entry` — быть
        существующим `.html`-файлом. Ассеты сохраняются в S3/MinIO, в каталог
        добавляется строка `kind=EXTERNAL, install_state=INSTALLED`. Серверный код
        плагина не исполняется, сетевые вызовы не выполняются.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: ZIP-пакет ≤ 5 MiB с manifest.json в корне.
      responses:
        "201":
          description: Пакет установлен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPluginPackage"
        "400":
          description: >
            Невалидный ZIP или manifest (`PLUGIN_PACKAGE_INVALID`), включая traversal,
            symlink, превышение 10 MiB/200 файлов и отсутствующий entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: >
            Пакет уже установлен (`PLUGIN_ALREADY_INSTALLED`) или id занят встроенным
            плагином (`PLUGIN_ID_RESERVED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/TooLarge"

  /admin/plugins/{pluginId}:
    parameters:
      - $ref: "#/components/parameters/PluginId"
    delete:
      tags: [admin, plugins]
      operationId: uninstallPluginPackage
      summary: Удалить внешний плагин (platform_admin)
      description: >
        Удаляет пакет: catalog-строка переводится в `install_state=UNINSTALLED` и
        `state=DISABLED` (чтобы per-chat ссылки не нарушали FK), metadata пакета
        удаляется, объекты в S3/MinIO удаляются best-effort после коммита. Повторное
        удаление неизвестного пакета — `404 PLUGIN_NOT_FOUND`. Встроенный плагин
        удалить нельзя.
      responses:
        "204":
          description: Пакет удалён
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /auth/register:
    post:
      tags: [auth]
      operationId: authRegister
      security: []
      summary: Регистрация через BFF; пароль хранит только Keycloak
      description: >
        Создаёт пользователя в Keycloak (`enabled=false`, `emailVerified=false`),
        генерирует 20-байтный TOTP-секрет (RFC 6238, SHA-1, 6 цифр, шаг 30 с) и
        отправляет 6-значный код письмом. Ответ не раскрывает существование аккаунта
        сверх документированного `409 EMAIL_TAKEN`. Пароль не сохраняется в БД
        приложения и не логируется.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRegisterRequest"
      responses:
        "202":
          description: Код отправлен на email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthRegisterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Регистрация закрыта (`REGISTRATION_CLOSED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email уже занят (`EMAIL_TAKEN`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Пароль отклонён политикой Keycloak (`VALIDATION_FAILED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/verify-email:
    post:
      tags: [auth]
      operationId: authVerifyEmail
      security: []
      summary: Подтвердить email 6-значным TOTP-кодом и получить сессию
      description: >
        Неверный код — `422 CODE_INVALID` (до 5 попыток), истёкший/использованный —
        `410 CODE_EXPIRED`, исчерпанные попытки — `429 RATE_LIMITED`. Успех включает
        пользователя в Keycloak (`enabled=true`, `emailVerified=true`) и возвращает
        токены Keycloak. Пароль в запросе отсутствует. Если установка требует 2FA,
        вместо сессии выдаётся `202` challenge (`mode=ENROLL`/`TOTP`); email-код не
        является вторым фактором.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthVerifyEmailRequest"
      responses:
        "200":
          description: Email подтверждён, сессия выдана (2FA не требуется)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "202":
          description: >
            Email подтверждён, но требуется второй фактор: выдан login challenge, токены
            до его завершения не возвращаются.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTwoFactorChallenge"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          description: Код истёк или уже использован (`CODE_EXPIRED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Неверный код (`CODE_INVALID`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/resend-email-code:
    post:
      tags: [auth]
      operationId: authResendEmailCode
      security: []
      summary: Повторно отправить код подтверждения
      description: >
        Новый TOTP-код выводится из нового секрета; старый код перестаёт действовать.
        Повтор возможен не чаще `resend_after` секунд, иначе `429 RATE_LIMITED`.
        Срок жизни подтверждения (`expires_in`) не продлевается.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthResendEmailCodeRequest"
      responses:
        "202":
          description: Код отправлен повторно
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResendEmailCodeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          description: Подтверждение истекло или уже использовано (`CODE_EXPIRED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/login:
    post:
      tags: [auth]
      operationId: authLogin
      security: []
      summary: Вход по email/паролю через Keycloak token endpoint
      description: >
        Keycloak `grant_type=password`, client `krug-web`. Неверные учётные данные —
        `401 INVALID_CREDENTIALS`; неподтверждённый/отключённый пользователь —
        `403 EMAIL_NOT_VERIFIED` с `details.verification_id`, если подтверждение ещё
        живо. Пароль не логируется.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
      responses:
        "200":
          description: Сессия выдана (2FA не включена)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "202":
          description: >
            Пароль верен, но нужен второй фактор: вместо сессии выдан одноразовый
            login challenge (`mode=TOTP` при включённом аутентификаторе, `mode=ENROLL`
            когда установка требует 2FA, а аутентификатор ещё не создан). Токены
            Keycloak до завершения challenge не возвращаются. Enrollment завершается
            через `POST /auth/2fa/enroll/start` и `POST /auth/2fa/enroll/verify`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTwoFactorChallenge"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Неверные учётные данные (`INVALID_CREDENTIALS`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Email не подтверждён (`EMAIL_NOT_VERIFIED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/refresh:
    post:
      tags: [auth]
      operationId: authRefresh
      security: []
      summary: Обновить пару токенов через Keycloak
      description: >
        Refresh-токен передаётся в теле, не в URL. Keycloak ротирует пару; недействительный
        refresh — `401 INVALID_CREDENTIALS`. #101: если серверная сессия простаивала
        дольше `session_timeout_minutes` активного воркспейса (strictest wins), refresh
        отклоняется с `401 AUTH_SESSION_EXPIRED`, а новый refresh-токен отзывается. Время
        простоя считается по реальным API-запросам, а не по самому refresh.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRefreshRequest"
      responses:
        "200":
          description: Новая сессия
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Refresh-токен недействителен (`INVALID_CREDENTIALS`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >
            Сессия не проходила обязательный второй фактор (`TWO_FACTOR_REQUIRED`).
            Такой refresh-токен нельзя использовать для продления парольной сессии;
            нужен новый вход с TOTP/ENROLL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/logout:
    post:
      tags: [auth]
      operationId: authLogout
      security: []
      summary: Отозвать refresh-токен в Keycloak
      description: Идемпотентно; недействительный refresh-токен также даёт `204`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLogoutRequest"
      responses:
        "204":
          description: Сессия отозвана (или уже была недействительна)
        "400":
          $ref: "#/components/responses/BadRequest"

  /me:
    get:
      tags: [auth]
      operationId: me
      summary: Профиль и доступные воркспейсы после OIDC-входа
      responses:
        "200":
          description: Пользователь и его воркспейсы
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [auth]
      operationId: updateMe
      summary: Обновить свой профиль
      description: >
        Частичное обновление только собственного профиля. Отсутствующее поле не меняется;
        `bio`/`phone` со значением `null` или пустой строкой очищают поле. Email, пароль,
        статус, платформенная роль и E2EE-ключи устройств через этот endpoint недоступны.
        Неизвестные поля (включая `email`/`password`) игнорируются. Текстовые значения
        хранятся как plain text и не интерпретируются сервером как HTML.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Обновлённый профиль пользователя
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /me/sessions:
    get:
      tags: [auth]
      operationId: listMySessions
      summary: Активные сессии Keycloak текущего пользователя
      description: >
        Только сессии вызывающего пользователя. IP-адрес и username Keycloak в ответ не
        попадают; `name` — метка клиента. `current=true` у сессии, на которую указывает
        claim `sid` текущего access token. Если Keycloak недоступен — `503 AUTH_UNAVAILABLE`.
      responses:
        "200":
          description: Сессии пользователя, сначала недавно использованные
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileSessions"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /me/sessions/{sessionId}:
    delete:
      tags: [auth]
      operationId: revokeMySession
      summary: Отозвать собственную сессию Keycloak
      description: >
        Отзывает ровно одну сессию, принадлежащую вызывающему. Чужая или уже отозванная
        сессия неотличимы и дают `404 NOT_FOUND` без побочных эффектов. Текущую сессию
        также можно отозвать. Недоступный Keycloak — `503 AUTH_UNAVAILABLE`.
      parameters:
        - name: sessionId
          in: path
          required: true
          description: Идентификатор сессии Keycloak
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Сессия отозвана (или уже была недействительна)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /devices:
    post:
      tags: [devices]
      operationId: registerDevice
      summary: Зарегистрировать устройство после входа
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRegistration"
      responses:
        "201":
          description: Устройство зарегистрировано
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "422":
          $ref: "#/components/responses/Unprocessable"
    get:
      tags: [devices]
      operationId: listDevices
      summary: Список своих устройств (для revoke/UX)
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: Устройства пользователя
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /devices/{deviceId}:
    delete:
      tags: [devices]
      operationId: revokeDevice
      summary: Отозвать устройство; key_generation++
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Устройство отозвано (повтор идемпотентен)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"

  /devices/{deviceId}/prekeys:
    post:
      tags: [devices]
      operationId: uploadPrekeys
      summary: Ротация signed prekey и пополнение one-time prekeys
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignedPrekeyUpload"
      responses:
        "200":
          description: Prekeys сохранены (повтор с теми же bytes идемпотентен)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrekeyUploadResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /keys/claim:
    post:
      tags: [devices]
      operationId: claimPrekeys
      summary: Атомарно выдать prekey bundle для устройств участников чата
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyClaimRequest"
      responses:
        "200":
          description: Bundles и недоступные устройства
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyClaimResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /workspaces:
    post:
      tags: [workspaces]
      operationId: createWorkspace
      summary: Создать воркспейс при первом входе
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceRequest"
      responses:
        "201":
          description: Воркспейс создан; пользователь — OWNER
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /realtime/ticket:
    post:
      tags: [realtime]
      operationId: createRealtimeTicket
      summary: Одноразовый тикет для WebSocket (TTL 30 с)
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: Тикет создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealtimeTicket"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: In-app уведомления пользователя
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        "200":
          description: Страница уведомлений и unread_count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPage"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /notifications/read:
    post:
      tags: [notifications]
      operationId: markNotificationsRead
      summary: Отметить уведомления прочитанными
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadNotificationsRequest"
      responses:
        "204":
          description: Отмечено
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /notification-preferences:
    get:
      tags: [notifications]
      operationId: getNotificationPreferences
      summary: Настройки уведомлений
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: Настройки
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [notifications]
      operationId: updateNotificationPreference
      summary: Изменить настройку уведомлений
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferencePatch"
      responses:
        "200":
          description: Настройка обновлена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreference"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /sticker-packs:
    get:
      tags: [stickers]
      operationId: listStickerPacks
      summary: Наборы стикеров, доступные в чате
      parameters:
        - name: chat_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: Наборы и стикеры
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StickerPackList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /plugins:
    get:
      tags: [plugins]
      operationId: listPlugins
      summary: Каталог плагинов (встроенные и установленные внешние)
      description: >
        Установленный каталог плагинов. Встроенные (`kind=BUILTIN`) — курируемый список
        first-party; внешние (`kind=EXTERNAL`) — admin-установленные статические
        ZIP-пакеты. Код плагинов не исполняется сервером: это только метаданные и
        статические ассеты. `permissions` — закрытый словарь: для built-in
        (`MESSAGES`, `MEMBERS`, `FILES`, `WEBHOOKS`), для external — manifest-токены
        (`chat.messages.read`, `chat.messages.write`, `chat.members.read`,
        `chat.files.read`, `chat.files.write`, `webhooks.send`). В этом срезе права
        описательные, не выданные capability-гранты. `modes` — `MANAGED` и/или `E2EE`.
        `state` — `ACTIVE`/`DISABLED` (kill switch). Для external дополнительно
        отдаются `version`, `author`, `entry_url` — аутентифицированный путь к
        entry-файлу пакета; built-in эти поля не отдают. Требуется аутентификация;
        членство в воркспейсе не требуется. Ответ стабильно отсортирован по каталогу.
      responses:
        "200":
          description: Установленный каталог плагинов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /plugins/{pluginId}/assets/{assetPath}:
    parameters:
      - $ref: "#/components/parameters/PluginId"
      - name: assetPath
        in: path
        required: true
        description: >
          Относительный путь файла внутри пакета. Допустимы только ASCII-сегменты
          `[A-Za-z0-9._-]`, разделитель `/`; `..`, `\\`, абсолютные пути и пустые
          сегменты запрещены. Обслуживается только путь, записанный при установке.
        schema:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._/-]{0,511}$"
    get:
      tags: [plugins]
      operationId: getPluginAsset
      summary: Статический ассет установленного внешнего плагина
      description: >
        Отдаёт файл из S3/MinIO по точному пути, сохранённому при установке. Требуется
        bearer JWT (ассеты доступны любому аутентифицированному пользователю). Сервер не исполняет содержимое: ответ приходит с `nosniff`,
        ограничивающим CSP (`default-src 'none'`, `connect-src 'none'`) и
        `frame-ancestors 'self'`; для HTML дополнительно включён CSP `sandbox`.
        Host обязан рендерить пакет в `<iframe sandbox="allow-scripts">` без
        `allow-same-origin`.
      responses:
        "200":
          description: Байты статического ассета
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /stickers/{stickerId}/favorite:
    parameters:
      - $ref: "#/components/parameters/StickerId"
      - $ref: "#/components/parameters/DeviceId"
    put:
      tags: [stickers]
      operationId: favoriteSticker
      summary: Добавить стикер в избранное
      responses:
        "204":
          description: Добавлено
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [stickers]
      operationId: unfavoriteSticker
      summary: Убрать стикер из избранного
      responses:
        "204":
          description: Убрано
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /workspaces/{workspaceId}/limits:
    get:
      tags: [workspaces]
      operationId: getWorkspaceLimits
      summary: Серверные лимиты и квота воркспейса
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: Лимиты и текущая квота
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceLimits"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /workspaces/{workspaceId}/overview:
    get:
      tags: [workspaces]
      operationId: getWorkspaceOverview
      summary: Агрегаты дашборда воркспейса (для любого ACTIVE-участника)
      description: >
        Доступно любому ACTIVE-участнику ACTIVE-воркспейса; чужая/неизвестная workspace —
        `403` без раскрытия существования. Возвращаются только счётчики и байты:
        участники (`total`/`online`), чаты, сообщения (`total` — сумма выделенных
        последовательностей `chat_counters`, `last_24h` — реальные неудалённые строки за
        24 часа), файлы (`total`, `used_bytes`, `reserved_bytes`), DLP-события за 24 часа,
        квота хранилища и до пяти последних audit-действий. `audit_recent` заполняется
        только для OWNER/ADMIN; остальные участники получают пустой список. `online` —
        live-сигнал single-node realtime (различные пользователи с открытым WS), не
        персистентный и ограничен `members.total`. Тексты сообщений, E2EE-конверты, имена
        файлов, IP и токены не возвращаются; SQL-функция повторно проверяет членство.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: Агрегаты воркспейса
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /workspaces/{workspaceId}/dlp/policies:
    get:
      tags: [security]
      operationId: listWorkspaceDlpPolicies
      summary: DLP-правила воркспейса (OWNER/ADMIN)
      description: >
        Только ACTIVE OWNER/ADMIN активного воркспейса; чужая/неизвестная workspace —
        `403` без раскрытия существования. Список ограничен 100 правилами на воркспейс
        и упорядочен `created_at DESC, id DESC`. Правила доступны только в MANAGED
        воркспейсе: E2EE-контент непрозрачен для сервера, поэтому список отдаётся пустым
        без ошибки, а создание/изменение/удаление в E2EE — `422 DLP_E2EE_UNSUPPORTED`.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: Правила воркспейса
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DlpPolicyList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [security]
      operationId: createWorkspaceDlpPolicy
      summary: Создать DLP-правило
      description: >
        OWNER/ADMIN; только MANAGED. `pattern_type=KEYWORD` — литерал, поиск без учёта
        регистра; `PATTERN` — тот же литерал с wildcard `*` (не более 20). Регулярные
        выражения не компилируются ни приложением, ни БД, поэтому ReDoS невозможен.
        `name` уникально в воркспейсе без учёта регистра (`409
        DLP_POLICY_NAME_TAKEN`), `pattern` — 1..200 печатных символов без control
        characters. Лимит 100 правил — `409 DLP_POLICY_LIMIT`. Аудит содержит id,
        action, pattern_type и enabled, но не текст pattern.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DlpPolicyCreateRequest"
      responses:
        "201":
          description: Правило создано
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DlpPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /workspaces/{workspaceId}/dlp/policies/{policyId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/PolicyId"
      - $ref: "#/components/parameters/DeviceId"
    patch:
      tags: [security]
      operationId: updateWorkspaceDlpPolicy
      summary: Изменить DLP-правило
      description: >
        OWNER/ADMIN; только MANAGED. Частичное обновление: хотя бы одно поле. Повтор
        тех же значений идемпотентен (`200`, без нового audit-события). Неизвестное или
        чужое правило — `404`. Дубликат name — `409 DLP_POLICY_NAME_TAKEN`. Смена
        pattern_type повторно проверяет wildcard-лимит. Аудит перечисляет изменённые
        поля, без текста pattern.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DlpPolicyUpdateRequest"
      responses:
        "200":
          description: Правило изменено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DlpPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      tags: [security]
      operationId: deleteWorkspaceDlpPolicy
      summary: Удалить DLP-правило
      description: >
        OWNER/ADMIN; только MANAGED. Неизвестное/чужое правило — `404`. Исторические
        DLP-события сохраняются: `policy_id` становится `null`, а name snapshot остаётся.
      responses:
        "204":
          description: Правило удалено
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /workspaces/{workspaceId}/dlp/events:
    get:
      tags: [security]
      operationId: listWorkspaceDlpEvents
      summary: Content-free журнал DLP-событий (OWNER/ADMIN)
      description: >
        OWNER/ADMIN. Стабильный порядок `created_at DESC, id DESC`, непрозрачный
        workspace-bound cursor, `has_more` по `limit + 1`. Опциональные точные фильтры
        `policy_id` и `action` (`WARN`/`BLOCK`). Строка содержит только id, policy_id,
        name snapshot, action, actor_id, chat_id и created_at: текста сообщения,
        ciphertext, имени файла, email и IP-адреса в таблице и ответе нет.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DeviceId"
        - name: policy_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: action
          in: query
          required: false
          schema: { type: string, enum: [WARN, BLOCK] }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        "200":
          description: Страница DLP-событий
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DlpEventPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /workspaces/{workspaceId}/audit:
    get:
      tags: [security]
      operationId: listWorkspaceAudit
      summary: Audit-лог воркспейса (OWNER/ADMIN)
      description: >
        Только ACTIVE OWNER/ADMIN. Читается существующий append-only
        `audit.audit_events`; SQL-функция повторно проверяет роль и явно фильтрует
        `workspace_id`, поэтому события актора из другого воркспейса не утекают.
        Возвращаются только `id`, `action`, `actor_id`, `target_type`, `target_id`,
        `created_at`: metadata JSONB, хэши hash-chain, request id, actor email и
        содержимое сообщений/файлов не покидают БД. Фильтры `action` (точное имя) и
        `actor_id` (точный uuid), `from`/`to` включительно; `from > to` — `400`.
        Порядок `created_at DESC, id DESC`, cursor непрозрачен и привязан к воркспейсу.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DeviceId"
        - name: action
          in: query
          required: false
          schema: { type: string, maxLength: 120 }
        - name: actor_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        "200":
          description: Страница audit-лога
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceAuditPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /workspaces/{workspaceId}/audit/export:
    get:
      tags: [security]
      operationId: exportWorkspaceAudit
      summary: Ограниченный экспорт audit-лога (CSV/JSON)
      description: >
        OWNER/ADMIN. Те же фильтры, что у страницы, без cursor/limit. Экспорт ограничен
        10 000 строк: при большем совпадении возвращаются первые 10 000 и
        `X-Export-Truncated: true`, вызвавшему нужно сузить `from`/`to`. `format`
        обязателен. CSV — RFC 4180 (кавычки только при `,`, `"`, CR/LF; внутренняя
        кавычка удваивается), JSON — объект `WorkspaceAuditExport`. Экспорт сам
        аудируется событием `workspace.audit.exported` (format, returned, truncated —
        только счётчики, без содержимого).
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DeviceId"
        - name: format
          in: query
          required: true
          schema: { type: string, enum: [csv, json] }
        - name: action
          in: query
          required: false
          schema: { type: string, maxLength: 120 }
        - name: actor_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Экспорт (не более 10 000 строк)
          headers:
            X-Export-Rows:
              description: Число строк в ответе
              schema: { type: integer }
            X-Export-Truncated:
              description: true, если совпадений больше лимита
              schema: { type: boolean }
          content:
            text/csv:
              schema: { type: string }
              example: |
                created_at,action,actor_id,target_type,target_id
                2026-01-01T00:00:00Z,workspace.security.updated,00000000-0000-0000-0000-000000000000,workspace_security,
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceAuditExport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /workspaces/{workspaceId}/sessions:
    get:
      tags: [security]
      operationId: listWorkspaceSessions
      summary: Активные сессии участников воркспейса (OWNER/ADMIN)
      description: >
        OWNER/ADMIN. Живые сессии Keycloak всех ACTIVE-участников, у которых есть
        Keycloak identity, в порядке `last_seen_at DESC, id DESC`; cursor непрозрачен и
        привязан к воркспейсу. В строке только `id`, `user_id`, device-метка клиента,
        `created_at`, `last_seen_at`, `current`; IP-адрес, username и токены Keycloak
        не возвращаются. `current=true` — сессия вызывающего по claim `sid`.
        Недоступный Keycloak — `503 AUTH_UNAVAILABLE`.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DeviceId"
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Страница сессий
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSessionPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /workspaces/{workspaceId}/sessions/revoke-all:
    post:
      tags: [security]
      operationId: revokeAllWorkspaceSessions
      summary: Отозвать все сессии участников воркспейса
      description: >
        OWNER/ADMIN. Отзывает сессии всех ACTIVE-участников через Keycloak Admin API;
        текущая сессия вызывающего сохраняется, чтобы администратор не разлогинил сам
        себя. Возвращает число отозванных сессий и затронутых пользователей. Недоступный
        Keycloak — `503 AUTH_UNAVAILABLE`; операция best-effort и может успеть отозвать
        часть сессий до сбоя. Событие аудита содержит только счётчики.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: Сессии отозваны (счётчики)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSessionRevokeAll"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /workspaces/{workspaceId}/sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/DeviceId"
    delete:
      tags: [security]
      operationId: revokeWorkspaceSession
      summary: Отозвать одну сессию участника воркспейса
      description: >
        OWNER/ADMIN. Сессия должна принадлежать ACTIVE-участнику этого воркспейса:
        чужая и уже отозванная неотличимы и дают `404 NOT_FOUND` без побочных эффектов.
        Недоступный Keycloak — `503 AUTH_UNAVAILABLE`. Аудит содержит id участника, без
        session id/IP/username.
      responses:
        "204":
          description: Сессия отозвана
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /workspaces/{workspaceId}/security:
    get:
      tags: [security]
      operationId: getWorkspaceSecurity
      summary: Настройки безопасности воркспейса (OWNER/ADMIN)
      description: >
        OWNER/ADMIN. Политика воркспейса: `require_2fa`, `session_timeout_minutes`
        (15..10080), `dlp_enabled`, `retention_days` (1..3650). `security_mode`
        намеренно отсутствует: режим immutable (V16 trigger) и не меняется этим API.
        Значения хранятся для security-UI и последующего применения политик; в этом
        срезе они не добавляют новую точку enforcement в логин/message pipeline.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: Настройки безопасности
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSecurity"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      tags: [security]
      operationId: updateWorkspaceSecurity
      summary: Изменить настройки безопасности воркспейса
      description: >
        OWNER/ADMIN. Частичное обновление: хотя бы одно поле. Повтор тех же значений
        идемпотентен (`200`, без audit-события). Явный `security_mode` в теле — `422
        MODE_CHANGE_FORBIDDEN` (режим нельзя переключить, в том числе E2EE → MANAGED).
        `dlp_enabled=true` в E2EE — `422 DLP_E2EE_UNSUPPORTED`. Аудит содержит только
        список изменённых полей, без значений.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceSecurityUpdateRequest"
      responses:
        "200":
          description: Настройки обновлены
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSecurity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /uploads/preflight:
    post:
      tags: [files]
      operationId: preflightUpload
      summary: Проверить лимиты/квоту до загрузки (сервер — источник истины)
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreflightRequest"
      responses:
        "200":
          description: Решение по каждому файлу
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreflightResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /uploads:
    post:
      tags: [files]
      operationId: initUpload
      summary: Создать upload-сессию и резерв квоты
      description: >
        #101: до создания upload-сессии и резерва квоты имя/расширение/MIME/размер
        вложения проверяются workspace DLP (`scope=ATTACHMENT` или `ALL`). BLOCK →
        `422 DLP_BLOCKED` без upload-строки, резерва и записи объекта; имена файлов в
        DLP-событие не попадают.
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadInitRequest"
      responses:
        "201":
          description: Сессия создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /uploads/{uploadId}:
    get:
      tags: [files]
      operationId: getUpload
      summary: Состояние загрузки и список полученных частей
      parameters:
