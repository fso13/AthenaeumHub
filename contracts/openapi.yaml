  /chats/{chatId}/messages/{messageId}/translate:
    parameters:
      - $ref: "#/components/parameters/ChatId"
      - $ref: "#/components/parameters/MessageId"
      - $ref: "#/components/parameters/DeviceId"
    post:
      tags: [plugins]
      operationId: translateMessage
      summary: Перевод managed TEXT-сообщения (плагин `translate`)
      description: >
        Только ACTIVE-участник чата при включённом плагине `translate` и только для
        managed-сообщения типа `TEXT`, которое не удалено и не скрыто вызывающим.
        E2EE-чат/сообщение — `422 E2EE_METADATA_FORBIDDEN` (сервер не читает
        ciphertext); не-TEXT — `422 MESSAGE_NOT_TRANSLATABLE`. Внешний провайдер по
        умолчанию не настроен: без `krug.plugins.translate.url` запрос немедленно
        возвращает `503 TRANSLATION_UNAVAILABLE` с `Retry-After` и не делает сетевых
        вызовов. При настроенном URL сервер делает bounded HTTP-вызов (connect/read
        timeout, лимит размера ответа), не логирует текст, не сохраняет секреты и
        отклоняет HTML/control-символы в ответе. Audit — только id сообщения; вопрос,
        заголовок и текст никогда не пишутся. #101: вход и результат перевода
        проверяются workspace DLP (`scope=PLUGIN` или `ALL`); BLOCK → `422 DLP_BLOCKED`,
        провайдер не вызывается для заблокированного входа, результат не возвращается.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranslationRequest"
      responses:
        "200":
          description: Перевод
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Translation"
