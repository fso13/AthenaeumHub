  /chats/{chatId}/messages:
    parameters:
      - $ref: "#/components/parameters/ChatId"
      - $ref: "#/components/parameters/DeviceId"
    get:
      tags: [messages]
      operationId: listMessages
      description: >
        Без after_seq — последняя страница (seq DESC); с after_seq — вперёд (seq ASC).
        Клиент сортирует по seq и не полагается на created_at.
        Без `thread_root_id` возвращается только основная лента (`thread_root_id = null`):
        ответы тредов в неё не попадают. С `thread_root_id` — ответы одного треда,
        упорядоченные по seq с той же cursor/limit-семантикой.
      parameters:
        - name: after_seq
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
        - name: before_seq
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: thread_root_id
          in: query
          description: >
            Корень треда. Должен существовать в этом чате и сам не быть ответом
            (глубина 1). Для E2EE-чата треды не поддерживаются → `422
            THREADS_E2EE_UNSUPPORTED`.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Страница сообщений
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

    post:
      tags: [messages]
      operationId: sendMessage
      summary: Отправить сообщение; managed — text/attachments, E2EE — только envelopes
      description: >
        С `thread_root_id` создаётся ответ в тред: корень должен существовать в том же
        чате, сам не быть ответом (максимальная глубина 1) и не быть удалённым; тот же
        `Idempotency-Key`. В E2EE-чате треды не поддерживаются → `422
        THREADS_E2EE_UNSUPPORTED`. Ответ на ответ → `422 THREAD_NESTING_UNSUPPORTED`.
        P0-2: канал с `read_only=true` отклоняет отправку не-OWNER/ADMIN ролью (`403
        CHAT_READ_ONLY`); право `post_messages` из матрицы канала проверяется отдельно
        (`403 CHAT_PERMISSION_DENIED`). Идемпотентный replay сохранённого
        `Idempotency-Key` возвращается до этих проверок и не ломается включением
        read-only. P0-3: в MANAGED-воркспейсе с включённым DLP текстовое сообщение
        проверяется по литеральным правилам до выделения `seq`; совпадение с `BLOCK`
        даёт `422 DLP_BLOCKED` и откатывает отправку, а content-free событие (id правила,
        name snapshot, action) сохраняется независимо; `WARN` сохраняет событие и
        пропускает сообщение. E2EE не проверяется: plaintext на сервере отсутствует.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageCreate"
      responses:
        "201":
          description: >
            Сообщение создано; seq назначен сервером. Managed-ответ не содержит
            envelope_coverage; E2EE-ответ обязан его содержать (D-S4-04).
          headers:
            Idempotent-Replay:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageCreateResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /chats/{chatId}/messages/{messageId}:
    parameters:
      - $ref: "#/components/parameters/ChatId"
      - $ref: "#/components/parameters/DeviceId"
      - $ref: "#/components/parameters/MessageId"
    patch:
      tags: [messages]
      operationId: editMessage
      summary: Редактировать собственное TEXT-сообщение (managed-only)
      description: >
        Только автор сообщения и только активный участник чата. Редактируются лишь
        managed `TEXT`-сообщения, не удалённые (delete-for-all) и не скрытые для
        вызывающего. `text` — 1..8000 символов. Сервер выставляет `edited_at`, увеличивает
        `version` и публикует WS `message.updated`. Если передан `version` и он не совпал
        с текущим — `409 VERSION_CONFLICT` (оптимистичная блокировка). E2EE-чат →
        `422 E2EE_METADATA_FORBIDDEN` (сервер не редактирует шифротекст и не хранит
        plaintext-метаданные); STICKER/SYSTEM → `422 MESSAGE_NOT_EDITABLE`. #101:
        отредактированный текст повторно проходит workspace DLP; BLOCK →
        `422 DLP_BLOCKED`, исходный текст и версия не меняются, событие пишется без
        содержимого.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageEdit"
      responses:
        "200":
          description: Обновлённое сообщение с новыми `version` и `edited_at`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      tags: [messages]
      operationId: deleteMessage
      summary: Удалить сообщение для себя или для всех (только автор)
      description: >
        `scope=me` (по умолчанию) создаёт per-user маркер: сообщение исчезает только из
        чтений вызывающего, остальные участники его видят. `scope=all` доступен только
        автору сообщения (владелец/админ чата не получает это право) и является soft
        delete: строка и `seq` остаются, `deleted_at`/`deleted_by` выставляются,
        managed-контент очищается, вложения помечаются удалёнными, реакции удаляются;
        публикуется WS `message.deleted` (`scope=all`). Повторный вызов идемпотентен
        (`204`). Неизвестное/чужое сообщение → `404`; delete-for-all не автором → `403`.
        E2EE-сообщение удаляется тем же tombstone-путём (конверты удаляются), чтобы
        контент не оставался доступным.
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [me, all]
            default: me
      responses:
        "204":
          description: Удалено (идемпотентно)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /chats/{chatId}/messages/{messageId}/reactions:
    parameters:
      - $ref: "#/components/parameters/ChatId"
      - $ref: "#/components/parameters/DeviceId"
      - $ref: "#/components/parameters/MessageId"
    post:
      tags: [messages]
      operationId: addMessageReaction
      summary: Поставить реакцию (идемпотентно)
      description: >
        Managed-only: E2EE-чат → `422 E2EE_METADATA_FORBIDDEN`. Уникальность
        `(message, user, emoji)`; повторный POST не создаёт дубль и возвращает текущий
        агрегат. `emoji` — 1..32 символа, валидная Unicode-последовательность без HTML,
        пробелов и control-символов. Удалённое (delete-for-all) или скрытое для
        вызывающего сообщение → `404`. Публикуется WS `message.reaction.changed`
        (`action=ADDED`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReactionCreate"
      responses:
        "200":
          description: Текущий агрегат реакции
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReactionSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /chats/{chatId}/messages/{messageId}/reactions/{emoji}:
    parameters:
      - $ref: "#/components/parameters/ChatId"
      - $ref: "#/components/parameters/DeviceId"
      - $ref: "#/components/parameters/MessageId"
      - $ref: "#/components/parameters/Emoji"
    delete:
      tags: [messages]
      operationId: removeMessageReaction
      summary: Снять реакцию (идемпотентно)
      description: >
        Удаляет только реакцию вызывающего с этим `emoji`; отсутствующая реакция тоже
        даёт `204`. Managed-only (`422 E2EE_METADATA_FORBIDDEN`). Публикуется WS
        `message.reaction.changed` (`action=REMOVED`).
      responses:
        "204":
          description: Реакция снята (идемпотентно)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /chats/{chatId}/read:
    parameters:
      - $ref: "#/components/parameters/ChatId"
      - $ref: "#/components/parameters/DeviceId"
    post:
      tags: [messages]
      operationId: markRead
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadRequest"
      responses:
        "204":
          description: Read receipt обновлён
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /sync:
    get:
      tags: [sync]
      operationId: sync
      parameters:
        - $ref: "#/components/parameters/WorkspaceIdQuery"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: Состояние чатов для reconnect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /chats/{chatId}/members:
    get:
      tags: [chat]
      summary: List active chat members
      description: >
        Только ACTIVE-участники канала. `members[]` содержит `user_id`, `display_name`,
        `role`, `status`, `joined_at`; `user_ids` сохранён как аддитивная плоская проекция
        для выбора участников группового звонка. Email, устройства и ключи не
        возвращаются. Стабильный порядок `display_name ASC, user_id ASC`. Вызывающий
        должен быть ACTIVE-участником чата, иначе `404` без раскрытия существования чата.
        DIRECT возвращает двух участников.
      operationId: listChatMembers
      parameters:
        - $ref: '#/components/parameters/ChatId'
      responses:
        '200':
          description: ACTIVE-участники чата (детали и плоский список id)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMemberIds'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [chat]
      operationId: addChatMember
      summary: Добавить ACTIVE-участника воркспейса в GROUP-канал
      description: >
        OWNER/ADMIN канала либо роль с правом `invite_members` (по умолчанию также
        MODERATOR); добавляемый — ACTIVE-участник того же воркспейса (иначе `404
        USER_NOT_FOUND`). Разрешено для PUBLIC и PRIVATE GROUP-каналов; DIRECT —
        `422 CHAT_MEMBERSHIP_UNSUPPORTED`. Роль по умолчанию `MEMBER`; OWNER может
        назначать любую роль, ADMIN — только `MODERATOR`/`MEMBER`/`GUEST`, а роль ниже
        ADMIN с `invite_members` — только `MEMBER`/`GUEST` (`403 ROLE_CHANGE_FORBIDDEN`).
        Идемпотентно:
        повтор для уже ACTIVE-участника не меняет его роль и возвращает `200` с текущей
        ролью; первый успешный вызов — `201`. Смена роли существующего участника — только
        через PATCH. Лимиты чатов (user/workspace) не расходуются. Аудит содержит только
        `user_id` и `role`, без email и display name.
      parameters:
        - $ref: '#/components/parameters/ChatId'
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddChatMemberRequest'
      responses:
        '201':
          description: Участник добавлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMember'
        '200':
          description: Участник уже ACTIVE — идемпотентный повтор, роль не меняется
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /chats/{chatId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/ChatId'
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/DeviceId'
    patch:
      tags: [chat]
      operationId: changeChatMemberRole
      summary: Изменить роль участника канала
      description: >
        OWNER/ADMIN канала. Нельзя менять собственную роль (`409 SELF_ACTION_FORBIDDEN`),
        нельзя снять последнего ACTIVE OWNER (`409 LAST_OWNER`). ADMIN не может менять
        OWNER/ADMIN и назначать `OWNER`/`ADMIN` (`403 ROLE_CHANGE_FORBIDDEN`); OWNER может
        назначать любую роль. Неизвестный/не-Active участник — `404 MEMBER_NOT_FOUND`.
        Повтор той же роли идемпотентен (`200`) и не пишет аудит. DIRECT —
        `422 CHAT_MEMBERSHIP_UNSUPPORTED`. Аудит: `user_id`, `previous_role`, `role`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeChatMemberRoleRequest'
      responses:
        '200':
          description: Роль изменена (или уже была такой)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      tags: [chat]
      operationId: removeChatMember
      summary: Удалить участника канала (soft) или выйти самому
      description: >
        OWNER/ADMIN канала либо self (leave). Мягкое удаление: `status = 'REMOVED'`, строка
        и `joined_at` сохраняются, доступ пропадает при следующем запросе. Нельзя удалить
        последнего ACTIVE OWNER (`409 LAST_OWNER`); ADMIN не может удалять OWNER/ADMIN
        (`403 ROLE_CHANGE_FORBIDDEN`). Self-удаление идемпотентно (`204` даже если уже
        REMOVED); удаление другого не-Active участника — `404 MEMBER_NOT_FOUND`. DIRECT —
        `422 CHAT_MEMBERSHIP_UNSUPPORTED`. Аудит: `user_id` и `role`.
      responses:
        '204':
          description: Участник удалён (soft) или уже отсутствует
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /chats/{chatId}/leave:
    post:
      tags: [chat]
      operationId: leaveChat
      summary: Выйти из GROUP-канала (alias self-removal)
      description: >
        Идемпотентный alias `DELETE /chats/{chatId}/members/{me}`: `204`, в том числе при
        повторном вызове. Последний ACTIVE OWNER выйти не может — `409 LAST_OWNER`.
        DIRECT — `422 CHAT_MEMBERSHIP_UNSUPPORTED`. Аудит: `user_id`, `role`.
      parameters:
        - $ref: '#/components/parameters/ChatId'
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '204':
          description: Вы вышли из канала (или уже не участник)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /chats/{chatId}/invites:
    parameters:
      - $ref: '#/components/parameters/ChatId'
    get:
      tags: [chat]
      operationId: listChatInvites
      summary: Список invite-ссылок канала
      description: >
        OWNER/ADMIN канала. Возвращает только метаданные (`id`, `role`, `status`,
        `used_count`, `max_uses`, `expires_at`, `created_at`, `created_by`); сам токен и его
        hash никогда не возвращаются повторно. `status` вычисляется на сервере:
        `ACTIVE`/`EXPIRED`/`EXHAUSTED`/`REVOKED`. DIRECT — `422
        CHAT_MEMBERSHIP_UNSUPPORTED`.
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Invite-ссылки канала
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatInviteList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
    post:
      tags: [chat]
      operationId: createChatInvite
      summary: Создать invite-ссылку канала (токен возвращается один раз)
      description: >
        OWNER/ADMIN канала либо роль с правом `invite_members` (по умолчанию также
        MODERATOR). Разрешено для PUBLIC и PRIVATE GROUP-каналов. Роль приглашения
        по умолчанию `MEMBER`; `OWNER` приглашением не назначается (владелец назначается
        через PATCH/add). ADMIN может создать приглашение только на
        `MODERATOR`/`MEMBER`/`GUEST`, а роль ниже ADMIN — только на `MEMBER`/`GUEST`
        (`403 ROLE_CHANGE_FORBIDDEN`). В БД хранится только
        SHA-256 hash токена; сырой токен возвращается ровно один раз в `token` и больше не
        восстановим. `expires_in_seconds` по умолчанию 7 дней (300…2592000), `max_uses`
        опционален (1…1000; отсутствие — без ограничения). Аудит: `invite_id`, `role`,
        `max_uses`, `expires_at` — без токена/hash. Повторные POST создают новые ссылки
        (Idempotency-Key не применяется, иначе пришлось бы хранить сырой токен).
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatInviteCreateRequest'
      responses:
        '201':
          description: Invite создан; `token` возвращается один раз
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatInviteCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /chats/{chatId}/invites/{inviteId}:
    parameters:
      - $ref: '#/components/parameters/ChatId'
      - $ref: '#/components/parameters/InviteId'
      - $ref: '#/components/parameters/DeviceId'
    delete:
      tags: [chat]
      operationId: revokeChatInvite
      summary: Отозвать invite-ссылку канала
      description: >
        OWNER/ADMIN канала. `revoked_at = now()`: ссылка перестаёт работать (`410
        INVITE_REVOKED`). Идемпотентно: повторный вызов — `204` без нового аудита.
        Неизвестный invite этого канала — `404 INVITE_NOT_FOUND`.
      responses:
        '204':
          description: Invite отозван (или уже был отозван)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /invites/{token}/accept:
    post:
      tags: [chat]
      operationId: acceptChatInvite
      summary: Принять invite-ссылку канала
      description: >
        Вызывающий должен быть ACTIVE-участником воркспейса канала (иначе `403`), иначе
        `404 INVITE_NOT_FOUND` без раскрытия существования. Присоединение — с ролью
        приглашения. Идемпотентно: если вызывающий уже ACTIVE-участник, возвращается `200`
        с `already_member=true`, `used_count` не увеличивается и аудит не пишется. Истёкшая
        ссылка — `410 INVITE_EXPIRED`, отозванная — `410 INVITE_REVOKED`, исчерпавшая
        `max_uses` — `410 INVITE_EXHAUSTED`. Rate limit per user (`429 RATE_LIMITED` с
        `Retry-After`). Аудит только при фактическом вступлении: `invite_id`, `user_id`,
        `role`.
      parameters:
        - $ref: '#/components/parameters/InviteToken'
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Вступление выполнено или уже было выполнено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteAcceptResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /users/{userId}/block:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/DeviceId'
    post:
      tags: [users]
      operationId: blockUser
      summary: Заблокировать пользователя
      description: >
        Только для себя: блокирует вызывающий. Идемпотентно (`204`, повтор не создаёт
        новую запись и аудит). Нельзя заблокировать себя (`400 VALIDATION_FAILED`) или
        неизвестного/неактивного пользователя (`404 USER_NOT_FOUND`). В ответе нет email
        и display name; аудит — `user_id` цели.
      responses:
        '204':
          description: Пользователь заблокирован (или уже был)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [users]
      operationId: unblockUser
      summary: Разблокировать пользователя
      description: >
        Идемпотентно (`204`, в том числе если блокировки не было). Неизвестный пользователь
        — `404 USER_NOT_FOUND`; self — `400 VALIDATION_FAILED`.
      responses:
        '204':
          description: Блокировка снята (или её не было)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /me/blocked:
    get:
      tags: [users]
      operationId: listBlockedUsers
      summary: Список заблокированных пользователей
      description: >
        Только собственные блокировки вызывающего. Поля — `user_id` и `blocked_at`; email,
        display name, устройства и ключи не возвращаются. Стабильный порядок
        `blocked_at DESC, user_id ASC`.
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Заблокированные пользователи
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockedUserList'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me/avatar:
    post:
      tags: [auth]
      operationId: setMyAvatar
      summary: Установить аватар из существующего CLEAN-изображения
      description: >
        Изображение загружается с устройства через `POST /media/images`
        (`multipart/form-data`, до 5 MiB, PNG/JPEG/WebP) либо обычным файловым flow;
        тело ссылается на уже созданное managed-вложение, которое принадлежит
        вызывающему, является изображением и прошло AV-проверку
        (`READY`/`BOUND` + `CLEAN`/`SKIPPED`). Чужое/отсутствующее вложение — скрытый `404`;
        не изображение — `422 AVATAR_INVALID`; `PENDING` — `409 ATTACHMENT_NOT_READY`;
        заражённое — `423 ATTACHMENT_QUARANTINED`. `avatar_url` в профиле — стабильный
        относительный URL, а не ключ хранения.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvatarUpdate"
      responses:
        "200":
          description: Обновлённый профиль
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "423":
          description: Вложение помещено в карантин (`ATTACHMENT_QUARANTINED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [auth]
      operationId: deleteMyAvatar
      summary: Удалить аватар (идемпотентно)
      responses:
        "204":
          description: Аватар удалён (или уже отсутствовал)
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      tags: [auth]
      operationId: getMyAvatar
      summary: Получить аватар (302 на короткоживущий presigned URL)
      description: >
        Требуется аутентификация; ответ — `302` с `Location` на presigned object URL
        (TTL 5 минут). В теле дополнительно возвращаются URL и срок жизни. Аватар
        отсутствует — `404`.
      responses:
        "302":
          description: Временный redirect на presigned URL
          headers:
            Location:
              schema: { type: string, format: uri }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileAvatar"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /me/2fa:
    get:
      tags: [auth]
      operationId: getMyTwoFactor
      summary: Состояние TOTP-аутентификатора
      description: >
        Секрет, код и recovery-коды никогда не возвращаются. `enabled=false` означает,
        что настройка не начата или не подтверждена.
      responses:
        "200":
          description: Состояние 2FA
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [auth]
      operationId: disableMyTwoFactor
      summary: Отключить 2FA
      description: >
        Требует пароль текущего аккаунта (re-auth в Keycloak) и действующий TOTP-код или
        одноразовый recovery-код. Только possession access token недостаточно. Все
        recovery-коды удаляются. Событие аудита не содержит секретов/кодов.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorDisableRequest"
      responses:
        "204":
          description: 2FA отключена
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Пароль не подтверждён (`REAUTH_FAILED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 2FA не включена (`TWO_FACTOR_NOT_ENABLED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Неверный TOTP/recovery-код
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /me/2fa/setup:
    post:
      tags: [auth]
      operationId: setupMyTwoFactor
      summary: Начать настройку TOTP
      description: >
        Требует пароль (re-auth в Keycloak, привязанный к subject вызывающего). Возвращает
        секрет, `otpauth://` URI и `qr_payload` (тот же URI для QR) ровно один раз; в БД
        секрет хранится только как AES-256-GCM ciphertext. Повторный setup до подтверждения
        ротирует секрет; после включения — `409 TWO_FACTOR_ALREADY_ENABLED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorSetupRequest"
      responses:
        "200":
          description: Параметры настройки (показываются один раз)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorSetup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Пароль не подтверждён (`REAUTH_FAILED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 2FA уже включена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /me/2fa/verify:
    post:
      tags: [auth]
      operationId: verifyMyTwoFactor
      summary: Подтвердить настройку TOTP шестизначным кодом
      description: >
        Принятый time step сохраняется, поэтому повторное использование того же кода
        отклоняется. Неверный код — `422 TWO_FACTOR_CODE_INVALID`; setup не начат —
        `409 TWO_FACTOR_NOT_SETUP`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorVerifyRequest"
      responses:
        "200":
          description: 2FA включена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Setup не начат или уже включён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Неверный код (`TWO_FACTOR_CODE_INVALID`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /me/2fa/recovery-codes:
    post:
      tags: [auth]
      operationId: regenerateMyRecoveryCodes
      summary: Перевыпустить одноразовые recovery-коды
      description: >
        Требует пароль. Предыдущий набор перестаёт действовать целиком. В ответе — 10
        plaintext-кодов один раз; в БД лежат только SHA-256 digest'ы, при использовании
        код помечается использованным.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorRecoveryCodesRequest"
      responses:
        "200":
          description: Новые одноразовые коды
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorRecoveryCodes"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Пароль не подтверждён (`REAUTH_FAILED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 2FA не включена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/2fa/verify:
    post:
      tags: [auth]
      operationId: authVerifyTwoFactor
      summary: Завершить login challenge вторым фактором
      description: >
        `challenge_id` получен из `202` ответа `POST /auth/login`. Код — TOTP (6 цифр) или
        одноразовый recovery-код. Токены Keycloak до этого момента хранятся только
        server-side; challenge одноразовый, ограничен TTL и числом попыток. Неверный/
        истёкший challenge — `401 TWO_FACTOR_CHALLENGE_INVALID`, неверный код — `422`,
        исчерпанные попытки — `429`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthTwoFactorVerifyRequest"
      responses:
        "200":
          description: Второй фактор принят, сессия выдана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Challenge недействителен/истёк
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            2FA больше не включена (`TWO_FACTOR_NOT_ENABLED`) либо challenge имеет
            `mode=ENROLL` и должен завершаться через `/auth/2fa/enroll/verify`
            (`TWO_FACTOR_ENROLLMENT_REQUIRED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Неверный TOTP/recovery-код
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/2fa/enroll/start:
    post:
      tags: [auth]
      operationId: authStartTwoFactorEnrollment
      security: []
      summary: Начать enrollment TOTP по login challenge
      description: >
        Принимает `challenge_id` из `202` ответа `POST /auth/login` (или
        `POST /auth/verify-email`) с `mode=ENROLL`. Пароль уже проверен на шаге входа,
        поэтому повторная re-auth не требуется. Возвращает секрет, `otpauth://` URI и
        `qr_payload` один раз за challenge; в БД секрет хранится только как
        AES-256-GCM ciphertext. Повторный вызов до подтверждения возвращает тот же
        ожидающий секрет (без ротации). Чужой/истёкший/потреблённый challenge —
        `401 TWO_FACTOR_CHALLENGE_INVALID`; уже включённый аутентификатор —
        `409 TWO_FACTOR_ALREADY_ENABLED`. Секрет и коды не логируются.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthTwoFactorEnrollStartRequest"
      responses:
        "200":
          description: Параметры enrollment (секрет показывается клиенту один раз)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorSetup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Challenge недействителен/истёк/уже использован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Аутентификатор уже включён (`TWO_FACTOR_ALREADY_ENABLED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/2fa/enroll/verify:
    post:
      tags: [auth]
      operationId: authVerifyTwoFactorEnrollment
      security: []
      summary: Завершить enrollment и получить сессию
      description: >
        Подтверждает ожидающий секрет шестизначным TOTP-кодом и возвращает `AuthSession`
        из токенов, удерживаемых server-side. Challenge одноразовый, живёт ограниченное
        время и имеет лимит попыток: неверный код — `422 TWO_FACTOR_CODE_INVALID`,
        исчерпанные попытки/истёкший/потреблённый challenge — `401
        TWO_FACTOR_CHALLENGE_INVALID`. Неверный код не включает аутентификатор. Принятый
        time step сохраняется, поэтому повторное использование кода отклоняется.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthTwoFactorEnrollVerifyRequest"
      responses:
        "200":
          description: Аутентификатор включён, сессия выдана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Challenge недействителен/истёк/исчерпан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            Enrollment не начат (`TWO_FACTOR_NOT_SETUP`) или аутентификатор уже включён
            (`TWO_FACTOR_ALREADY_ENABLED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Неверный код (`TWO_FACTOR_CODE_INVALID`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /workspaces/{workspaceId}:
    patch:
      tags: [workspaces]
      operationId: updateWorkspace
      summary: Обновить name/description/logo_file_id
      description: >
        Частичное обновление; отсутствующее поле не меняется, `null`/пустая строка для
        `description` очищает его, `logo_file_id: null` убирает логотип. Требуется
        `manage_workspace` (OWNER всегда, ADMIN по умолчанию). `logo_file_id` ссылается на
        существующее CLEAN-изображение этого воркспейса. Security mode неизменяем и в теле
        не принимается. Audit хранит только имена изменённых полей.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceUpdate"
      responses:
        "200":
          description: Обновлённый воркспейс
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "423":
          description: Логотип помещён в карантин (`ATTACHMENT_QUARANTINED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [workspaces]
      operationId: deleteWorkspace
      summary: Мягко удалить воркспейс (только OWNER)
      description: >
        Только ACTIVE OWNER. Устанавливает `status = 'DELETED'`, `deleted_at`/`deleted_by`,
        переводит все членства и участия в чатах в `REMOVED`, отзывает все invite-ссылки
        (`revoked_at`) и выключает ботов (`DISABLED`). Чужая/неизвестная workspace — `403
        FORBIDDEN` без раскрытия существования; ACTIVE-участник не-OWNER — `403
        WORKSPACE_PERMISSION_DENIED`. Повтор владельцем идемпотентен (`204`, без второго
        аудит-события). Строки чатов, сообщений, вложений и байты объектного хранилища
        намеренно не удаляются: их обрабатывает retention/export job позже; API-доступ
        пропадает сразу, потому что все guard'ы требуют ACTIVE-членство. Stateless
        access-токены глобально не отзываются (один Keycloak-сеанс может обслуживать другие
        воркспейсы): доступ перепроверяется на каждом запросе, включая /sessions, чаты и
        файлы. Аудит содержит только id и счётчики.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "204":
          description: Воркспейс мягко удалён (или уже был удалён этим OWNER)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /workspaces/{workspaceId}/avatar:
    post:
      tags: [workspaces]
      operationId: setWorkspaceAvatar
      summary: Установить логотип воркспейса из CLEAN-изображения
      description: >
        Требуется `manage_workspace`. `file_id` — изображение `READY`/`BOUND` +
        `CLEAN`/`SKIPPED`: вложение этого воркспейса либо `source=DIRECT_IMAGE`,
        загруженное вызывающим через `POST /media/images` (в том числе в другом его
        воркспейсе). Чужое/произвольное вложение из другого воркспейса — скрытый
        `404`; не изображение — `422 WORKSPACE_LOGO_INVALID`; `PENDING` — `409
        ATTACHMENT_NOT_READY`; заражённое — `423 ATTACHMENT_QUARANTINED`.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceAvatarRequest"
      responses:
        "200":
          description: Обновлённый воркспейс
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: Не изображение (`WORKSPACE_LOGO_INVALID`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "423":
          description: Вложение помещено в карантин
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [workspaces]
      operationId: deleteWorkspaceAvatar
      summary: Удалить логотип (идемпотентно)
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "204":
          description: Логотип удалён (или уже отсутствовал)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /workspaces/{workspaceId}/invites:
    get:
      tags: [workspaces]
      operationId: listWorkspaceInvites
      summary: Метаданные invite-ссылок (без токенов)
      description: Требуется `manage_invites` (OWNER/ADMIN по умолчанию).
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Список ссылок
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInviteList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [workspaces]
      operationId: createWorkspaceInvite
      summary: Создать invite-ссылку или email-приглашение
      description: >
        Без `email` возвращает `token` и `accept_url` ровно один раз; в БД хранится только
        SHA-256 hash. OWNER может приглашать ADMIN/MEMBER/GUEST, ADMIN — MEMBER/GUEST;
        OWNER через ссылку не выдаётся. `expires_in_seconds` 300..2592000 (по умолчанию 7
        дней), `max_uses` 1..1000 или unlimited. #100: с непустым `email` создаётся
        одноразовое приглашение (max_uses = 1), нормализованный адрес сохраняется, письмо
        с accept-ссылкой отправляется через SMTP (Mailpit в dev); токен/hash/адрес не
        логируются. Отправка ограничена rate limit per workspace и per email.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceInviteCreateRequest"
      responses:
        "201":
          description: Ссылка создана; токен показывается один раз
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInviteCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Роль запрещена (`WORKSPACE_INVITE_ROLE_FORBIDDEN`) или нет прав
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /workspaces/{workspaceId}/invites/{inviteId}:
    delete:
      tags: [workspaces]
      operationId: revokeWorkspaceInvite
      summary: Отозвать invite-ссылку
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: inviteId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Ссылка отозвана (идемпотентно)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Ссылка не найдена (`WORKSPACE_INVITE_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /workspace-invites/{token}:
    get:
      tags: [workspaces]
      operationId: previewWorkspaceInvite
      security: []
      summary: Публичный предпросмотр invite-ссылки
      description: >
        #100: единственная анонимная операция с invite-токеном. Ответ содержит только имя
        и slug воркспейса, роль, признак привязки к email и срок действия; сам токен, его
        hash и адрес приглашённого не возвращаются. Неизвестный/недоступный токен — `404`,
        отозванный/истёкший/исчерпанный — `410` с отдельным кодом. Rate limit per IP.
      parameters:
        - $ref: "#/components/parameters/InviteToken"
      responses:
        "200":
          description: Приглашение активно
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInvitePreview"
        "404":
          description: Ссылка не найдена (`WORKSPACE_INVITE_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: Ссылка отозвана/истекла/исчерпана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /workspace-invites/{token}/accept:
    post:
      tags: [workspaces]
      operationId: acceptWorkspaceInvite
      summary: Принять invite-ссылку и войти в воркспейс
      description: >
        Вызывающий должен быть аутентифицированным активным пользователем. SECURITY
        DEFINER функция блокирует строку приглашения, поэтому `max_uses` соблюдается
        атомарно. Повторный accept действующим участником идемпотентен
        (`already_member=true`) и не расходует использование. Отозванная/истёкшая/
        исчерпанная ссылка — `410` с отдельным кодом; неизвестный токен — `404`.
        #100: если приглашение привязано к email, принять его может только аккаунт с этим
        адресом (сравнение без учёта регистра); другой аккаунт получает
        `403 WORKSPACE_INVITE_EMAIL_MISMATCH`, приглашение при этом не расходуется.
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 20, maxLength: 128 }
      responses:
        "200":
          description: Участие выдано
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInviteAcceptance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Ссылка не найдена (`WORKSPACE_INVITE_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: Ссылка отозвана/истекла/исчерпана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /workspaces/{workspaceId}/permissions:
    get:
      tags: [workspaces]
      operationId: getWorkspacePermissions
      summary: Матрица прав OWNER/ADMIN/MEMBER
      description: >
        Доступна любому активному участнику (описывает его собственные эффективные
        права). OWNER всегда `true` и неизменяем.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Эффективная матрица
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspacePermissionMatrix"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [workspaces]
      operationId: updateWorkspacePermissions
      summary: Изменить матрицу прав
      description: >
        Требуется `manage_permissions`. OWNER-ячейки неизменяемы (`422
        OWNER_PERMISSIONS_IMMUTABLE`); ADMIN может менять только MEMBER-ячейки, OWNER —
        ADMIN и MEMBER (`403 PERMISSION_CHANGE_FORBIDDEN`). Изменения атомарны; audit
        хранит только role/permission/allowed.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspacePermissionUpdate"
      responses:
        "200":
          description: Обновлённая матрица
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspacePermissionMatrix"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"


  /workspaces/{workspaceId}/bots:
    post:
      tags: [bots]
      operationId: createBot
      summary: Создать бота и получить одноразовый токен (OWNER/ADMIN)
      description: >
        Только workspace OWNER/ADMIN (роль, не настраиваемая матрица). В ответе ровно один
        раз возвращается bearer-токен бота; в БД хранится только его SHA-256 hash, поэтому
        повторно прочитать токен нельзя (для смены — `POST .../token`). `scopes` в MVP
        содержит только `chat.write`: бот не может читать сообщения, звонить, работать с
        файлами или вызывать админские API. Токен не пишется в audit, лог или БД в открытом
        виде. `name` — 1..80 символов. Создание пишет audit `bot.created` только с id.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BotCreateRequest"
      responses:
        "201":
          description: Бот создан; токен показывается один раз
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"

    get:
      tags: [bots]
      operationId: listBots
      summary: Боты воркспейса (без токенов)
      description: >
        Доступно любому ACTIVE-участнику воркспейса. Возвращаются только метаданные (id,
        имя, аватар, scopes, статус, audit-поля); токен и hash не возвращаются никогда.
        Чужой воркспейс — `403` без раскрытия существования.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: Список ботов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /workspaces/{workspaceId}/bots/{botId}:
    patch:
      tags: [bots]
      operationId: updateBot
      summary: Изменить имя/scopes/статус/аватар бота (OWNER/ADMIN)
      description: >
        Отсутствующие поля не меняются. `status=DISABLED` — мягкое отключение (токен
        немедленно перестаёт аутентифицироваться); `status=ACTIVE` возвращает бота в строй.
        `avatar_file_id` должен быть существующим готовым изображением того же воркспейса;
        `clear_avatar=true` очищает ссылку (поля взаимоисключающие). Токен этим методом не
        меняется. Audit `bot.updated` содержит только id.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/BotId"
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BotUpdateRequest"
      responses:
        "200":
          description: Обновлённый бот
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

    delete:
      tags: [bots]
      operationId: disableBot
      summary: Отключить/удалить бота (OWNER/ADMIN)
      description: >
        Мягкое удаление: `status=DISABLED`, строка и установки сохраняются для истории,
        токен сразу перестаёт работать. Идемпотентно (повторный DELETE — `204` без второго
        audit). Audit `bot.disabled` содержит только id.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/BotId"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "204":
          description: Бот отключён
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /workspaces/{workspaceId}/bots/{botId}/token:
    post:
      tags: [bots]
      operationId: rotateBotToken
      summary: Ротировать токен бота (OWNER/ADMIN)
      description: >
        Атомарно заменяет hash токена: старый токен сразу получает `401`, новый показывается
        ровно один раз в ответе. Для отключённого бота ротация разрешена, но новый токен
        начнёт работать только после `status=ACTIVE`. Audit `bot.token.rotated` содержит
        только id — ни токен, ни hash в audit/лог не попадают.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/BotId"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: Новый токен (показывается один раз)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /chats/{chatId}/bots:
    get:
      tags: [bots]
      operationId: listChatBots
      summary: Боты, установленные в чате
      description: >
        Доступно любому ACTIVE-участнику чата. Возвращает установленных ботов с
        метаданными (без токена/hash). Неизвестный/удалённый/чужой чат — `404` без
        раскрытия существования.
      parameters:
        - $ref: "#/components/parameters/ChatId"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: Установленные боты
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatBotList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      tags: [bots]
      operationId: installChatBot
      summary: Установить бота в чат (chat OWNER/ADMIN)
      description: >
        Только ACTIVE-участник чата с ролью OWNER/ADMIN. Бот должен принадлежать тому же
        воркспейсу и быть ACTIVE; чат должен быть MANAGED. E2EE-чат — `422
        BOT_E2EE_UNSUPPORTED`, отключённый бот — `422 BOT_DISABLED`. Установка идемпотентна;
        audit `chat.bot.installed` содержит только chat/bot id. После установки бот может
        отправлять сообщения через `POST /bots/{botId}/messages`.
      parameters:
        - $ref: "#/components/parameters/ChatId"
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatBotInstallRequest"
      responses:
        "201":
          description: Бот установлен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatBot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /chats/{chatId}/bots/{botId}:
    delete:
      tags: [bots]
      operationId: uninstallChatBot
      summary: Удалить бота из чата (chat OWNER/ADMIN)
      description: >
        Только ACTIVE-участник чата с ролью OWNER/ADMIN. Идемпотентно (`204` без audit при
        отсутствии установки). После удаления бот получает `403 BOT_NOT_INSTALLED` при
        попытке отправки в этот чат; история сообщений сохраняется. Audit
        `chat.bot.uninstalled` содержит только chat/bot id.
      parameters:
        - $ref: "#/components/parameters/ChatId"
        - $ref: "#/components/parameters/BotId"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "204":
          description: Бот удалён из чата
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /workspaces/{workspaceId}/bots/{botId}/secret:
    post:
      tags: [bots]
      operationId: rotateBotSigningSecret
      summary: Сгенерировать/ротировать signing secret бота (OWNER/ADMIN)
      description: >
        #98. Новый HMAC-секрет генерируется сервером, в БД хранится только AES-256-GCM
        ciphertext, а открытое значение возвращается ровно один раз в этом ответе. Старый
        секрет сразу перестаёт проверять подписи. Секрет не попадает в audit/лог/read API.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/BotId"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: Секрет создан (показывается один раз)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotSigningSecret"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /workspaces/{workspaceId}/bots/{botId}/deliveries:
    get:
      tags: [bots]
      operationId: listBotDeliveries
      summary: Последние доставки событий бота (OWNER/ADMIN)
      description: >
        #98. Content-free статусы outbox: id, тип/идентификатор события, чат, статус,
        число попыток, следующий retry, последний HTTP-код и безопасная причина ошибки.
        Payload, events_url и signing secret не возвращаются. Новые — первыми.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/BotId"
        - $ref: "#/components/parameters/DeviceId"
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Доставки
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotDeliveryList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /workspaces/{workspaceId}/bots/{botId}/test-event:
    post:
      tags: [bots]
      operationId: testBotEvent
      summary: Поставить тестовый webhook в очередь (OWNER/ADMIN)
      description: >
        #98. Ставит подписанный `test` event в outbox и возвращает `202 {delivery_id}`.
        Требуется настроенный `events_url` и существующий signing secret (`422
        BOT_EVENTS_NOT_CONFIGURED`), иначе ping невозможен. Тест не зависит от
        `events_enabled` и не создаёт сообщение в чате.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/BotId"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "202":
          description: Тестовое событие поставлено в очередь
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotDeliveryAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /chats/{chatId}/commands:
    post:
      tags: [bots]
      operationId: invokeBotCommand
      summary: Вызвать slash-команду установленного бота (участник чата)
      description: >
        #98. Доступно любому ACTIVE-участнику MANAGED-чата. Команда ищется среди
        installed+enabled ботов чата: ноль совпадений — `404 BOT_COMMAND_NOT_FOUND`, два и
        больше — `409 BOT_COMMAND_AMBIGUOUS`. У бота должен быть активный events_url и
        signing secret (`422 BOT_EVENTS_NOT_CONFIGURED`), E2EE-чат — `422
        BOT_E2EE_UNSUPPORTED`. Создаётся подписанная доставка `slash_command` с одноразовым
        `response_url` (TTL 5 минут); сообщение в чат НЕ создаётся. Ответ — `202
        {delivery_id}`. Действует rate limit по пользователю и чату (`429`).
      parameters:
        - $ref: "#/components/parameters/ChatId"
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BotCommandInvoke"
      responses:
        "202":
          description: Команда поставлена в очередь
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotCommandAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /bot-responses/{token}:
    post:
      tags: [bots]
      operationId: sendBotResponse
      summary: Ответить на slash-команду по одноразовому response_url
      description: >
        #98. Токен из `response_url` сам авторизует ровно одно сообщение: bot JWT и
        X-Device-Id не нужны, но и bot bearer не требуется. Токен одноразовый, живёт 5
        минут, хранится только как SHA-256 hash и атомарно расходуется в одной транзакции с
        сообщением. Создаётся обычное BOT-сообщение в исходном чате через общий pipeline
        (scope/install/MANAGED/rate-limit проверки действуют). Повторное использование —
        `409 BOT_RESPONSE_USED`, истёкший — `410 BOT_RESPONSE_EXPIRED`, битый/чужой —
        `401 BOT_RESPONSE_INVALID`. Токен не логируется. Rate limit — по токену и боту.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 100, maxLength: 140 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BotResponseCreate"
      responses:
        "201":
          description: Сообщение бота создано
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /bots/{botId}/messages:
    post:
      tags: [bots]
      operationId: sendBotMessage
      summary: Отправить сообщение от имени бота (bot token)
      description: >
        Единственный bot-token endpoint. Авторизация — `Authorization: Bearer
        sova_bot_...` (отдельная security-цепочка; JWT и X-Device-Id не используются).
        Токен сравнивается по SHA-256 hash в constant time; отключённый/неизвестный токен,
        чужой `botId` и битый токен дают одинаковый `401`. Требуется scope `chat.write`
        (`403 BOT_SCOPE_FORBIDDEN`), чат должен быть MANAGED (`422 BOT_E2EE_UNSUPPORTED`) и
        бот установлен+включён в нём (`403 BOT_NOT_INSTALLED`). Сообщение создаётся как
        `sender_type=BOT` с `bot_id`, именем бота в `sender_display_name` и без
        `sender_id`/device — импersonation пользователя невозможна. `Idempotency-Key`
        обязателен: повтор с тем же телом возвращает исходное сообщение и
        `Idempotent-Replay: true`, а с другим телом — `409 IDEMPOTENCY_KEY_REUSED`.
        Действует отдельный rate limit по боту и по чату (`429` + `Retry-After`).
      security:
        - botTokenAuth: []
      parameters:
        - $ref: "#/components/parameters/BotId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BotMessageCreate"
      responses:
        "201":
          description: Сообщение создано (или идемпотентный replay)
          headers:
            Idempotent-Replay:
              schema: { type: string, enum: ["true"] }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    botTokenAuth:
      type: http
      scheme: bearer
      description: >
        #96: одноразовый bot-токен вида `sova_bot_<workspace_id>_<bot_id>_<secret>`.
        Действует только на `POST /bots/{botId}/messages`; в БД хранится только его
        SHA-256 hash. Не JWT: отдельная security-цепочка, X-Device-Id не нужен.
      bearerFormat: BotToken

  parameters:
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        #95: recommended for poll/task creation. With the header, a retry with the same key
        and body returns the original poll/task and its timeline message id instead of
        creating a second entity/message. Without it the server generates a fresh key, so
        every request is a new create.
      schema: { type: string, format: uuid }
    ChatId:
      name: chatId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BotId:
      name: botId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      description: Идентификатор пользователя (участника воркспейса/канала).
      schema: { type: string, format: uuid }
    PolicyId:
      name: policyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      description: >
        Идентификатор сессии Keycloak (opaque, обычно uuid). Не логируется и не
        возвращается повторно.
      schema: { type: string, minLength: 1, maxLength: 128 }
    InviteId:
      name: inviteId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InviteToken:
      name: token
      in: path
      required: true
      description: >
        Opaque invite-токен (base64url, 32 случайных байта). Хранится только его SHA-256
        hash; сервер не логирует и не возвращает токен повторно.
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{20,128}$" }
    MessageId:
      name: messageId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Emoji:
      name: emoji
      in: path
      required: true
      description: >
        Одна emoji-последовательность в percent-encoding, без HTML/пробелов/control.
      schema: { type: string, minLength: 1, maxLength: 32 }
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    WorkspaceIdQuery:
      name: workspace_id
      in: query
      required: true
      schema: { type: string, format: uuid }
    StickerId:
      name: stickerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PluginId:
      name: pluginId
      in: path
      required: true
      description: Slug плагина из `plugin.catalog` (built-in или установленного external).
      schema: { type: string, pattern: "^[a-z][a-z0-9-]{0,63}$" }
    PollId:
      name: pollId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UploadId:
      name: uploadId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PartNo:
      name: partNo
      in: path
      required: true
      schema: { type: integer, minimum: 1, maximum: 10000 }
    ContentSha256:
      name: Content-SHA256
      in: header
      required: true
      schema: { type: string, pattern: "^[a-f0-9]{64}$" }

  schemas:
    ChatMember:
      type: object
      required: [user_id, display_name, role, status, joined_at]
      description: >
        ACTIVE-участник канала. `display_name` берётся из профиля пользователя;
        email, устройства и ключи не возвращаются.
      properties:
        user_id: { type: string, format: uuid }
        display_name: { type: string, minLength: 1, maxLength: 80 }
        role:
          type: string
          enum: [OWNER, ADMIN, MODERATOR, MEMBER, GUEST]
        status:
          type: string
          enum: [INVITED, ACTIVE, REMOVED]
        joined_at: { type: string, format: date-time }
    AddChatMemberRequest:
      type: object
      required: [user_id]
      description: >
        `role` по умолчанию `MEMBER`. `OWNER` назначает только OWNER канала; ADMIN может
        назначать лишь `MODERATOR`/`MEMBER`/`GUEST`. Для уже ACTIVE-участника роль не
        меняется (используйте PATCH).
      properties:
        user_id: { type: string, format: uuid }
        role:
          type: string
          enum: [OWNER, ADMIN, MODERATOR, MEMBER, GUEST]
          default: MEMBER
    ChangeChatMemberRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [OWNER, ADMIN, MODERATOR, MEMBER, GUEST]
    ChatMemberIds:
      type: object
      required: [user_ids, members]
      description: >
        ACTIVE-участники канала. `members` — детали (display_name/role/status/joined_at),
        `user_ids` — совместимая плоская проекция для выбора участников группового звонка.
      properties:
        user_ids:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 1000
        members:
          type: array
          items:
            $ref: '#/components/schemas/ChatMember'
          minItems: 1
          maxItems: 1000
    ChatInvite:
      type: object
      required: [id, role, status, used_count, max_uses, expires_at, created_at]
      description: >
        Метаданные invite-ссылки канала. Токен и его hash никогда не возвращаются.
        `status` вычисляется сервером: `REVOKED` приоритетнее `EXPIRED`, затем
        `EXHAUSTED`, иначе `ACTIVE`.
      properties:
        id: { type: string, format: uuid }
        role:
          type: string
          enum: [ADMIN, MODERATOR, MEMBER, GUEST]
        status:
          type: string
          enum: [ACTIVE, EXPIRED, EXHAUSTED, REVOKED]
        used_count: { type: integer, minimum: 0 }
        max_uses:
          type: [integer, "null"]
          minimum: 1
          maximum: 1000
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid }
    ChatInviteCreated:
      allOf:
        - $ref: '#/components/schemas/ChatInvite'
        - type: object
          required: [token]
          description: >
            `token` возвращается ровно один раз при создании; повторно получить его
            невозможно (в БД хранится только SHA-256 hash).
          properties:
            token:
              type: string
              pattern: "^[A-Za-z0-9_-]{20,128}$"
    ChatInviteCreateRequest:
      type: object
      description: >
        Все поля опциональны. `role` по умолчанию `MEMBER` (OWNER приглашением не
        назначается). `expires_in_seconds` по умолчанию 604800 (7 дней), допустимо
        300…2592000. `max_uses` отсутствует — без ограничения по числу вступлений.
      properties:
        role:
          type: string
          enum: [ADMIN, MODERATOR, MEMBER, GUEST]
          default: MEMBER
        max_uses:
          type: [integer, "null"]
          minimum: 1
          maximum: 1000
        expires_in_seconds:
          type: integer
          minimum: 300
          maximum: 2592000
          default: 604800
    ChatInviteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChatInvite'
    InviteAcceptResult:
      type: object
      required: [invite_id, workspace_id, chat_id, role, already_member]
      description: >
        Результат вступления. `already_member=true` означает идемпотентный повтор: роль —
        текущая роль участника, `used_count` не менялся.
      properties:
        invite_id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        chat_id: { type: string, format: uuid }
        role:
          type: string
          enum: [OWNER, ADMIN, MODERATOR, MEMBER, GUEST]
        already_member: { type: boolean }
    BlockedUser:
      type: object
      required: [user_id, blocked_at]
      description: >
        Собственная блокировка вызывающего. Email и display name не возвращаются.
      properties:
        user_id: { type: string, format: uuid }
        blocked_at: { type: string, format: date-time }
    BlockedUserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BlockedUser'
    Error:
      type: object
      required: [code, message, request_id]
      description: >
        `code` — свободная строка. E2EE-коды §4.8: DEVICE_LIMIT_REACHED,
        DEVICE_ID_CONFLICT, INVALID_KEY_FORMAT, INVALID_SPK_SIGNATURE, INVALID_PREKEY,
        PREKEY_ID_CONFLICT, PREKEY_LIMIT_EXCEEDED, NO_PREKEYS, UNKNOWN_DEVICE,
        KEY_GENERATION_MISMATCH, ENVELOPES_REQUIRED, ENVELOPES_NOT_ALLOWED,
        E2EE_PLAINTEXT_FORBIDDEN, TOO_MANY_ENVELOPES, DUPLICATE_ENVELOPE,
        INVALID_ENVELOPE_FORMAT, UNSUPPORTED_ENVELOPE_VERSION, ENVELOPE_TOO_LARGE,
        PAYLOAD_TOO_LARGE, E2EE_NO_ACTIVE_DEVICES, E2EE_NO_PEER_ENVELOPE,
        E2EE_DISABLED, MODE_NOT_SUPPORTED, MODE_CHANGE_FORBIDDEN,
        CLIENT_MESSAGE_ID_CONFLICT, IDENTITY_KEY_CONFLICT, INVALID_IDENTITY_BINDING,
        NO_KEYS, E2EE_LEGACY_DEVICE, VH_VERSION_UNSUPPORTED, E2EE_GROUP_NOT_SUPPORTED,
        KEY_CHANGED, DEVICE_REVOKED, INVALID_SAFETY_NUMBER_HASH, TOO_MANY_DEVICES.
        Auth BFF (docs/TASKS-AUTH-BFF.md §1): INVALID_CREDENTIALS, EMAIL_NOT_VERIFIED,
        CODE_INVALID, CODE_EXPIRED, EMAIL_TAKEN, RATE_LIMITED, REGISTRATION_CLOSED,
        AUTH_UNAVAILABLE.
        E8 (R-01…R-04, docs/TASKS-ADMIN-SETTINGS.md): CHAT_LIMIT_REACHED,
        SETUP_ALREADY_COMPLETED, SMTP_UNAVAILABLE.
        E11 (R-08, docs/TASKS-ADMIN-V2.md): SELF_ACTION_FORBIDDEN,
        USER_ALREADY_SUSPENDED, USER_ALREADY_ACTIVE, LAST_PLATFORM_ADMIN,
        CHAT_ALREADY_DELETED.
        E12 (R-09, docs/TASKS-ADMIN-V2.md): USER_NOT_FOUND, MEMBER_NOT_FOUND,
        MEMBER_ALREADY_EXISTS, WORKSPACE_MEMBER_LIMIT_REACHED, ROLE_CHANGE_FORBIDDEN,
        LAST_OWNER. #99 workspace lifecycle reuses LAST_OWNER (409) and
        WORKSPACE_PERMISSION_DENIED (403); it adds no new error codes.
        D1 (docs/TASKS-DASHBOARD-V1.md §3.2, threads): THREAD_ROOT_NOT_FOUND,
        THREAD_ROOT_DELETED, THREAD_NESTING_UNSUPPORTED, THREADS_E2EE_UNSUPPORTED.
        D1-BE2 (media metadata): MEDIA_METADATA_INVALID (422); a MIME outside the audio
        allowlist is 415 UNSUPPORTED_TYPE.
        D1-BE3 (chat settings): CHAT_SETTINGS_E2EE_UNSUPPORTED (422) — description in an
        E2EE chat; invalid/empty name or description and an empty patch are
        VALIDATION_FAILED (422).
        D1 message actions (#61–#63): E2EE_METADATA_FORBIDDEN (422) — edit/reaction in an
        E2EE chat; MESSAGE_NOT_EDITABLE (422) — non-TEXT edit; VERSION_CONFLICT (409) —
        stale optimistic version; MESSAGE_TOO_LONG (422) — edit text > 8000.
        D1.1 (#69, plugins): PLUGIN_NOT_FOUND (404) — unknown catalog id;
        PLUGIN_NOT_AVAILABLE (422) — the plugin's modes do not include the chat mode
        (server-side plugin in E2EE); PLUGIN_DISABLED (422) — catalog kill switch.
        D1.2 (#86, external plugin packages): PLUGIN_PACKAGE_INVALID (400) — unsafe or
        malformed ZIP/manifest (traversal, symlink, limits, missing entry);
        PLUGIN_PACKAGE_TOO_LARGE (413) — archive above 5 MiB; PLUGIN_ALREADY_INSTALLED
        (409) — the package id is already installed; PLUGIN_ID_RESERVED (409) — the id
        belongs to a built-in plugin; PLUGIN_STORAGE_UNAVAILABLE (503) — object storage
        is unavailable and the operation can be retried.
        D1.1 (#76, plugin actions): PLUGIN_NOT_ENABLED (422) — the per-chat toggle is off;
        POLL_CLOSED (422), POLL_OPTION_INVALID (422) — option does not belong to the poll;
        POLL_STATE_INVALID (422) — reopen is not supported; TASK_ASSIGNEE_INVALID (422) —
        assignee is not an ACTIVE chat member; MESSAGE_NOT_TRANSLATABLE (422) — not a
        managed TEXT message; TRANSLATION_UNAVAILABLE (503) — no provider configured or
        the bounded provider call failed (Retry-After is set).
        P0-2 (#80, channel settings): CHAT_READ_ONLY (403) — write in a read-only
        channel; CHAT_PERMISSION_DENIED (403) — the role lacks a matrix right;
        CHAT_COVER_INVALID (422) — the referenced attachment is not an image;
        CHAT_AVATAR_INVALID (422) — the referenced channel-avatar attachment is not an
        image; CHAT_JOIN_CLOSED (403) — invite accept on a CLOSED channel; CHAT_PIN_LIMIT
        (409) — more than 50 pins; CHAT_SETTINGS_E2EE_UNSUPPORTED (422) — description,
        cover or avatar in an E2EE chat; E2EE_METADATA_FORBIDDEN (422) — pins in an E2EE
        chat.
      properties:
        code: { type: string }
        message: { type: string }
        details:
          type: object
          additionalProperties: true
        request_id: { type: string }

    Session:
      type: object
      required: [access_token, expires_at, user, device, workspace, chat]
      properties:
        access_token: { type: string }
        expires_at: { type: string, format: date-time }
        user:
          type: object
          required: [id, display_name]
          properties:
            id: { type: string, format: uuid }
            display_name: { type: string }
        device:
          type: object
          required: [id, platform]
          properties:
            id: { type: string, format: uuid }
            platform: { type: string, enum: [WEB] }
        workspace:
          type: object
          required: [id, name, security_mode]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            security_mode: { type: string, enum: [MANAGED] }
        chat:
          type: object
          required: [id, name, type]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            type: { type: string, enum: [GROUP] }

    AuthUser:
      type: object
      required: [id, display_name, email, is_platform_admin]
      description: >
        Профиль пользователя для `GET/PATCH /me`. `bio`/`phone` всегда присутствуют в
        ответах сервера (возможно `null`); в схеме они необязательны для совместимости со
        старыми клиентами.
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string, minLength: 1, maxLength: 80 }
        email: { type: string, format: email }
        is_platform_admin:
          type: boolean
          description: Серверный флаг auth.users.is_platform_admin (R-03)
        bio:
          type: [string, "null"]
          maxLength: 280
          description: Plain-text bio; `null` — не заполнено
        phone:
          type: [string, "null"]
          maxLength: 32
          description: Plain-text контактный телефон; `null` — не заполнено
        avatar_url:
          type: [string, "null"]
          maxLength: 512
          description: >
            Стабильный относительный URL аватара (`/api/v1/me/avatar`, 302 на presigned
            object URL); `null` — аватар не установлен. Ключ хранения и attachment id не
            раскрываются.

    ProfileUpdate:
      type: object
      description: >
        Все поля опциональны. Отсутствие поля означает «не менять»; `null` для `bio`/
        `phone` очищает поле. `display_name=null`/пустой — `400 VALIDATION_FAILED`.
        Пустой объект — `422 VALIDATION_FAILED` (`reason=empty_patch`). Email и пароль
        здесь не принимаются.
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 80
        bio:
          type: [string, "null"]
          maxLength: 280
        phone:
          type: [string, "null"]
          maxLength: 32

    ProfileSession:
      type: object
      required: [id, name, created_at, last_access_at, current]
      description: >
        Сессия Keycloak без IP-адреса, username и токенов. `name` — метка клиента
        (например `krug-web`); `current` вычисляется по claim `sid`.
      properties:
        id: { type: string, description: Идентификатор сессии Keycloak }
        name: { type: string, maxLength: 120 }
        created_at: { type: string, format: date-time }
        last_access_at: { type: string, format: date-time }
        current: { type: boolean }

    ProfileSessions:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items: { $ref: "#/components/schemas/ProfileSession" }

    MeResponse:
      type: object
      required: [user, workspaces, default_workspace_id]
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
        workspaces:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceSummary"
        default_workspace_id: { type: [string, "null"], format: uuid }

    SetupStatus:
      type: object
      required: [setup_required, registration_open]
      properties:
        setup_required:
          type: boolean
          description: true, пока setup_completed_at пуст
        registration_open:
          type: boolean
          description: Сохранённый переключатель регистрации установки

    AdminSettings:
      type: object
      required:
        [
          setup_completed,
          setup_completed_at,
          smtp_host,
          smtp_port,
          smtp_username,
          smtp_from,
          smtp_starttls,
          smtp_configured,
          max_chats_per_user,
          max_chats_per_workspace,
          max_workspace_members,
          registration_open,
          require_2fa,
          updated_at,
          updated_by,
        ]
      description: >
        Настройки установки. SMTP-пароль никогда не возвращается; `smtp_configured`
        отражает, задан ли хост и отправитель. `updated_by` — platform_admin,
        сделавший последнее изменение. `allowed_file_extensions` — runtime-allowlist
        расширений (нижний регистр, без точек); изменения применяются к следующей
        загрузке без перезапуска.
      properties:
        setup_completed: { type: boolean }
        setup_completed_at: { type: [string, "null"], format: date-time }
        smtp_host: { type: [string, "null"], maxLength: 255 }
        smtp_port: { type: [integer, "null"], minimum: 1, maximum: 65535 }
        smtp_username: { type: [string, "null"], maxLength: 255 }
        smtp_from: { type: [string, "null"], maxLength: 254 }
        smtp_starttls: { type: boolean }
        smtp_configured: { type: boolean, readOnly: true }
        max_chats_per_user: { type: integer, minimum: 1, maximum: 1000000 }
        max_chats_per_workspace: { type: integer, minimum: 1, maximum: 1000000 }
        max_workspace_members: { type: integer, minimum: 1, maximum: 1000000 }
        registration_open: { type: boolean }
        require_2fa:
          type: boolean
          description: >
            Глобальная политика 2FA (#91): `false` — второй фактор требуется только
            аккаунтам с включённым аутентификатором; `true` — каждый вход обязан
            завершиться TOTP-challenge или enrollment. Значение применяется со
            следующей аутентификации; выданные ранее access-токены не отзываются, а
            refresh парольной сессии отклоняется (`TWO_FACTOR_REQUIRED`).
        allowed_file_extensions:
          type: array
          minItems: 1
          maxItems: 100
          description: >
            Разрешённые расширения файлов в нижнем регистре, без ведущей точки.
            Управляется platform_admin; применяется без перезапуска.
          items:
            type: string
            pattern: "^[a-z0-9]{1,10}$"
            maxLength: 10
            example: m4a
        updated_at: { type: string, format: date-time }
        updated_by: { type: [string, "null"], format: uuid }

    AdminSettingsPatch:
      type: object
      additionalProperties: false
      description: >
        Все поля опциональны; `null` означает «не менять». `smtp_password` — writeOnly,
        пустая строка также означает «не менять». `complete_setup=true` завершает
        первичную настройку.
      properties:
        smtp_host: { type: [string, "null"], maxLength: 255 }
        smtp_port: { type: [integer, "null"], minimum: 1, maximum: 65535 }
        smtp_username: { type: [string, "null"], maxLength: 255 }
        smtp_password:
          type: [string, "null"]
          maxLength: 512
          writeOnly: true
        smtp_from: { type: [string, "null"], maxLength: 254 }
        smtp_starttls: { type: [boolean, "null"] }
        allowed_file_extensions:
          type: [array, "null"]
          minItems: 1
          maxItems: 100
          description: >
            Полная замена allowlist. `null` (или отсутствие поля) — не менять; пустой
            массив отклоняется `400 VALIDATION_FAILED`. Значения нормализуются в нижний
            регистр; дубликаты, точки, опасные расширения и записи вне
            `[a-z0-9]{1,10}` отклоняются.
          items:
            type: string
            maxLength: 10
            example: m4a
        max_chats_per_user: { type: [integer, "null"], minimum: 1, maximum: 1000000 }
        max_chats_per_workspace: { type: [integer, "null"], minimum: 1, maximum: 1000000 }
        max_workspace_members: { type: [integer, "null"], minimum: 1, maximum: 1000000 }
        registration_open: { type: [boolean, "null"] }
        require_2fa:
          type: [boolean, "null"]
          description: >
            Глобальная политика 2FA (#91). `null`/отсутствие — не менять. Значение
            проверяется как boolean; строка/число отклоняются `400 VALIDATION_FAILED`.
        complete_setup: { type: [boolean, "null"] }
        setup_completed:
          type: [boolean, "null"]
          description: Алиас `complete_setup` (совместимость с именем поля ответа)

    AdminOverview:
      type: object
      required: [users, workspaces, chats]
      description: Только агрегаты; содержимое чатов и E2EE не раскрывается.
      properties:
        users: { type: integer, format: int64, minimum: 0 }
        workspaces: { type: integer, format: int64, minimum: 0 }
        chats: { type: integer, format: int64, minimum: 0 }

    AdminUser:
      type: object
      required:
        [
          id,
          email,
          display_name,
          is_platform_admin,
          status,
          workspaces_count,
          chats_count,
          storage_used_bytes,
          created_at,
        ]
      description: >
        Метаданные пользователя для админ-списка. `workspaces_count` — активные
        членства в неудалённых воркспейсах, `chats_count` — активные членства в
        неудалённых чатах, `storage_used_bytes` — сумма байт его неудалённых
        вложений, объекты которых ещё хранятся (READY/BOUND). Контента здесь нет.
      properties:
        id: { type: string, format: uuid }
        email: { type: [string, "null"], format: email, maxLength: 254 }
        display_name: { type: string, maxLength: 80 }
        is_platform_admin: { type: boolean }
        status: { type: string, enum: [ACTIVE, SUSPENDED, DELETED] }
        workspaces_count: { type: integer, format: int64, minimum: 0 }
        chats_count: { type: integer, format: int64, minimum: 0 }
        storage_used_bytes: { type: integer, format: int64, minimum: 0 }
        created_at: { type: string, format: date-time }

    AdminUserPage:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        next_cursor: { type: [string, "null"] }
        has_more: { type: boolean }

    AdminChat:
      type: object
      required:
        [
          id,
          name,
          type,
          security_mode,
          workspace_id,
          workspace_name,
          members_count,
          messages_count,
          created_at,
          last_activity_at,
        ]
      description: >
        Метаданные чата для админ-списка. `members_count` — активные участники,
        `messages_count` — число выделенных последовательностей `chat_counters`
        (включая удалённые сообщения), `last_activity_at` — `chats.last_message_at`.
        Текст сообщений, E2EE-конверты и вложения не раскрываются.
      properties:
        id: { type: string, format: uuid }
        name: { type: [string, "null"], maxLength: 120 }
        type: { type: string, enum: [DIRECT, GROUP] }
        security_mode: { type: string, enum: [MANAGED, E2EE] }
        workspace_id: { type: string, format: uuid }
        workspace_name: { type: string, maxLength: 120 }
        members_count: { type: integer, format: int64, minimum: 0 }
        messages_count: { type: integer, format: int64, minimum: 0 }
        created_at: { type: string, format: date-time }
        last_activity_at: { type: [string, "null"], format: date-time }

    AdminChatPage:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminChat"
        next_cursor: { type: [string, "null"] }
        has_more: { type: boolean }

    AdminStorageWorkspace:
      type: object
      required:
        [
          workspace_id,
          workspace_name,
          security_mode,
          used_bytes,
          reserved_bytes,
          storage_limit_bytes,
          objects,
          attachments,
        ]
      description: >
        Строка storage dashboard по воркспейсу. `objects` — вложения, объекты которых
        ещё хранятся (READY/BOUND); `attachments` — все неудалённые записи вложений
        (включая карантин). Имена файлов, object keys и содержимое не возвращаются.
      properties:
        workspace_id: { type: string, format: uuid }
        workspace_name: { type: string, maxLength: 120 }
        security_mode: { type: string, enum: [MANAGED, E2EE] }
        used_bytes: { type: integer, format: int64, minimum: 0 }
        reserved_bytes: { type: integer, format: int64, minimum: 0 }
        storage_limit_bytes: { type: integer, format: int64, minimum: 0 }
        objects: { type: integer, format: int64, minimum: 0 }
        attachments: { type: integer, format: int64, minimum: 0 }

    AdminStorageTotals:
      type: object
      required: [used_bytes, reserved_bytes, objects, attachments]
      description: Сумма по строкам выдачи (с учётом фильтра `workspace_id`).
      properties:
        used_bytes: { type: integer, format: int64, minimum: 0 }
        reserved_bytes: { type: integer, format: int64, minimum: 0 }
        objects: { type: integer, format: int64, minimum: 0 }
        attachments: { type: integer, format: int64, minimum: 0 }

    AdminStorage:
      type: object
      required: [totals, workspaces]
      properties:
        totals:
          $ref: "#/components/schemas/AdminStorageTotals"
        workspaces:
          type: array
          items:
            $ref: "#/components/schemas/AdminStorageWorkspace"

    AdminAuditEvent:
      type: object
      required:
        [id, action, actor_id, actor_email, target_type, target_id, created_at]
      description: >
        Строка audit-лога для platform_admin. Только действие, актор, цель и время:
        `metadata` (даже если там лишь счётчики), хэши hash-chain и `request_id` не
        возвращаются, поэтому тела сообщений/файлов и секреты не могут утечь через этот
        ответ. `actor_email` — единственное PII-поле, явно разрешённое контрактом
        администратора. `actor_id`/`target_id`/`actor_email`/`target_type` могут быть
        `null` для системных событий.
      properties:
        id: { type: string, format: uuid }
        action: { type: string, maxLength: 120 }
        actor_id: { type: [string, "null"], format: uuid }
        actor_email: { type: [string, "null"], format: email, maxLength: 254 }
        target_type: { type: [string, "null"], maxLength: 40 }
        target_id: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }

    AdminAuditPage:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminAuditEvent"
        next_cursor: { type: [string, "null"] }
        has_more: { type: boolean }

    AdminAuditExport:
      type: object
      required: [items, exported_rows, truncated]
      description: >
        JSON-представление ограниченного экспорта platform-audit. `exported_rows` ≤ 10 000;
        `truncated=true` означает, что совпадений больше и фильтр `action` нужно сузить.
        Колонки те же, что у `AdminAuditEvent`; metadata/hashes/request id отсутствуют.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminAuditEvent"
        exported_rows: { type: integer, minimum: 0, maximum: 10000 }
        truncated: { type: boolean }

    AdminSession:
      type: object
      required: [id, user_id, device, created_at, last_seen_at, current]
      description: >
        Сессия Keycloak выбранного пользователя без IP-адреса, username, email и токенов.
        `device` — метка клиента; `current` — сессия вызывающего по claim `sid`, если
        выбран он сам.
      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
        user_id: { type: string, format: uuid }
        device: { type: string, maxLength: 120 }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        current: { type: boolean }

    AdminSessionPage:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminSession" }
        next_cursor: { type: [string, "null"] }
        has_more: { type: boolean }

    AdminSessionRevokeAll:
      type: object
      required: [revoked_sessions, affected_users]
      properties:
        revoked_sessions: { type: integer, minimum: 0 }
        affected_users: { type: integer, minimum: 0 }

    TranslationProviderSettings:
      type: object
      required: [enabled, url]
      description: >
        Действующая конфигурация translation-провайдера. Секретов нет; `url` — абсолютный
        https URL или пустая строка.
      properties:
        enabled: { type: boolean }
        url: { type: string, maxLength: 2048 }

    TranslationProviderUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        enabled: { type: boolean }
        url:
          type: string
          maxLength: 2048
          description: >
            Пустая строка очищает URL. Непустое значение — только абсолютный https URL с
            опциональным path; userinfo/query/fragment запрещены.

    TranslationProviderTest:
      type: object
      required: [status, latency_ms]
      description: >
        Результат health-check без содержимого провайдера. `status` — OK, DISABLED или
        UNAVAILABLE; `latency_ms` — длительность probe (0 для DISABLED).
      properties:
        status: { type: string, enum: [OK, DISABLED, UNAVAILABLE] }
        latency_ms: { type: integer, format: int64, minimum: 0, maximum: 60000 }

    TestEmailRequest:
      type: object
      additionalProperties: false
      required: [to]
      properties:
        to: { type: string, format: email, maxLength: 254 }

    TestEmailResponse:
      type: object
      required: [sent, to]
      properties:
        sent: { type: boolean }
        to: { type: string, format: email }

    AuthRegisterRequest:
      type: object
      required: [email, display_name, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        display_name: { type: string, minLength: 1, maxLength: 80 }
        password:
          type: string
          minLength: 10
          maxLength: 128
          writeOnly: true
          description: Передаётся только в Keycloak; backend не хранит и не логирует.
        # #100: optional single-use workspace invite; only its SHA-256 digest is stored.
        invite_token:
          type: [string, "null"]
          maxLength: 128
          description: >
            Необязательный invite-токен. Backend сохраняет только SHA-256 hash рядом с
            pending-регистрацией; после подтверждения email приглашение принимается
            автоматически, если оно ещё действительно и привязано к этому адресу. Ошибка
            или истёкшее приглашение не меняют ответ регистрации (нет enumeration).

    AuthRegisterResponse:
      type: object
      required: [verification_id, expires_in, resend_after]
      properties:
        verification_id: { type: string, format: uuid }
        expires_in: { type: integer, minimum: 1, description: Секунды до истечения кода }
        resend_after: { type: integer, minimum: 0, description: Секунды до повторной отправки }

    AuthVerifyEmailRequest:
      type: object
      required: [verification_id, code]
      properties:
        verification_id: { type: string, format: uuid }
        code: { type: string, pattern: "^[0-9]{6}$" }

    AuthResendEmailCodeRequest:
      type: object
      required: [verification_id]
      properties:
        verification_id: { type: string, format: uuid }

    AuthResendEmailCodeResponse:
      type: object
      required: [expires_in, resend_after]
      properties:
        expires_in: { type: integer, minimum: 0, description: Остаток срока жизни подтверждения }
        resend_after: { type: integer, minimum: 0 }

    AuthLoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true

    AuthRefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 4096
          writeOnly: true

    AuthLogoutRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 4096
          writeOnly: true

    AuthSessionUser:
      type: object
      required: [id, display_name, email, is_platform_admin]
      properties:
        id: { type: string, format: uuid, description: Локальный id (JIT-провижининг) }
        display_name: { type: string }
        email: { type: string, format: email }
        is_platform_admin:
          type: boolean
          description: Серверный флаг платформенного администратора (R-03)

    AuthSession:
      type: object
      required: [access_token, refresh_token, expires_in, token_type, user]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer, minimum: 1 }
        token_type: { type: string, enum: [Bearer] }
        user:
          $ref: "#/components/schemas/AuthSessionUser"

    WorkspaceSummary:
      type: object
      required: [id, name, slug, role, security_mode]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        role: { type: string, enum: [OWNER, ADMIN, MEMBER, GUEST] }
        security_mode: { type: string, enum: [MANAGED, E2EE] }
        description:
          type: [string, "null"]
          maxLength: 500
          description: Plain-text описание; `null` — не заполнено (P0-4)
        logo_file_id:
          type: [string, "null"]
          format: uuid
          description: >
            Ссылка на CLEAN image attachment этого воркспейса; `null` — логотип не
            установлен. Сам файл скачивается обычным file flow.

    WorkspaceMember:
      type: object
      required: [user_id, display_name, role, joined_at]
      description: >
        Активный участник воркспейса для выбора peer в DIRECT-чате. Возвращаются только
        каталожные поля: email, пароли, устройства и ключи в ответ не попадают.
        Вызывающий сам может быть в списке, если он активен; self-peer отсекается
        сервером при создании DIRECT-чата.
      properties:
        user_id: { type: string, format: uuid }
        display_name: { type: string, minLength: 1, maxLength: 80 }
        role: { type: string, enum: [OWNER, ADMIN, MEMBER, GUEST] }
        joined_at: { type: string, format: date-time }

    WorkspaceMemberPage:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceMember"
        next_cursor: { type: [string, "null"] }
        has_more: { type: boolean }

    DlpPolicy:
      type: object
      required: [id, name, action, pattern_type, pattern, scope, max_file_size_bytes,
                 enabled, created_at, updated_at]
      description: >
        DLP-правило. `pattern` — литерал (KEYWORD) или литерал с wildcard `*`
        (PATTERN), максимум 200 символов и 20 wildcard-сегментов. Регулярным
        выражением значение не является и не компилируется. `scope` выбирает
        поверхность проверки; `ALL` (по умолчанию) применяет правило к тексту
        сообщений/редактирования, метаданным вложений и plugin payload. Для
        ATTACHMENT `pattern` проверяется по имени файла, базовому имени, расширению и
        MIME; `max_file_size_bytes` дополнительно срабатывает на файл больше порога.
        Байты файла и содержимое сообщения никогда не сохраняются в событии.
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        action: { type: string, enum: [WARN, BLOCK] }
        pattern_type: { type: string, enum: [KEYWORD, PATTERN] }
        pattern: { type: string, minLength: 1, maxLength: 200 }
        scope:
          type: string
          enum: [ALL, TEXT, ATTACHMENT, PLUGIN]
          default: ALL
          description: >
            `ALL` — все MANAGED-поверхности; `TEXT` — сообщения и редактирование;
            `ATTACHMENT` — имя/расширение/MIME/размер вложения на upload/bind/rename;
            `PLUGIN` — poll question/options, task title и перевод. E2EE не
            оценивается: сервер не имеет plaintext.
        max_file_size_bytes:
          type: [integer, "null"]
          minimum: 1
          maximum: 10737418240
          description: >
            Только для scope `ATTACHMENT`/`ALL`: файл больше порога матчится даже без
            совпадения `pattern`. `null` — порога нет. Значение — политика, не контент.
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DlpPolicyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DlpPolicy" }

    DlpPolicyCreateRequest:
      type: object
      additionalProperties: false
      required: [name, action, pattern_type, pattern]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        action: { type: string, enum: [WARN, BLOCK] }
        pattern_type: { type: string, enum: [KEYWORD, PATTERN] }
        pattern:
          type: string
          minLength: 1
          maxLength: 200
          description: >
            Literal без control characters. Для PATTERN допустим `*`, не более 20.
            Это не regex: ReDoS исключён по построению.
        scope:
          type: string
          enum: [ALL, TEXT, ATTACHMENT, PLUGIN]
          default: ALL
          description: >
            Поверхность правила (#101). Отсутствие = `ALL`: правило действует на
            MANAGED-текст, имена/расширения/MIME/размер вложений и plugin payload.
        max_file_size_bytes:
          type: integer
          minimum: 1
          maximum: 10737418240
          description: >
            Attachment-only порог размера (#101); допустим только для scope
            `ATTACHMENT`/`ALL`, иначе 400.
        enabled: { type: boolean, default: true }

    DlpPolicyUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        action: { type: string, enum: [WARN, BLOCK] }
        pattern_type: { type: string, enum: [KEYWORD, PATTERN] }
        pattern: { type: string, minLength: 1, maxLength: 200 }
        scope:
          type: string
          enum: [ALL, TEXT, ATTACHMENT, PLUGIN]
          description: >
            Смена поверхности правила (#101); отсутствие поля сохраняет значение.
        max_file_size_bytes:
          type: integer
          minimum: 1
          maximum: 10737418240
          description: >
            Attachment-only порог размера (#101). Отсутствие поля сохраняет значение;
            явный null в JSON трактуется как «не менять» на этом контракте.
        enabled: { type: boolean }

    DlpEvent:
      type: object
      required: [id, policy_id, policy_name, action, actor_id, chat_id, created_at]
      description: >
        Content-free DLP-событие: только ids, name snapshot, action и время. Текста
        сообщения, ciphertext, имени файла, email и IP-адреса нет ни в таблице, ни в
        ответе. `policy_id` становится `null`, если правило удалено (name snapshot
        сохраняется).
      properties:
        id: { type: string, format: uuid }
        policy_id: { type: [string, "null"], format: uuid }
        policy_name: { type: string, minLength: 1, maxLength: 120 }
        action: { type: string, enum: [WARN, BLOCK] }
        actor_id: { type: [string, "null"], format: uuid }
        chat_id: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }

    DlpEventPage:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DlpEvent" }
        next_cursor: { type: [string, "null"] }
        has_more: { type: boolean }

    WorkspaceAuditEvent:
      type: object
      required: [id, action, actor_id, target_type, target_id, created_at]
      description: >
        Строка audit-лога воркспейса: только действие, актор, цель и время. Metadata
        JSONB, хэши hash-chain, request id и actor email не возвращаются, поэтому тела
        сообщений/файлов и секреты не могут утечь через этот ответ.
      properties:
        id: { type: string, format: uuid }
        action: { type: string, maxLength: 120 }
        actor_id: { type: [string, "null"], format: uuid }
        target_type: { type: [string, "null"], maxLength: 40 }
        target_id: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }

    WorkspaceAuditPage:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/WorkspaceAuditEvent" }
        next_cursor: { type: [string, "null"] }
        has_more: { type: boolean }

    WorkspaceAuditExport:
      type: object
      required: [items, exported_rows, truncated]
      description: >
        JSON-представление экспорта. `exported_rows` ≤ 10 000; `truncated=true`
        означает, что совпадений больше и фильтры нужно сузить.
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/WorkspaceAuditEvent" }
        exported_rows: { type: integer, minimum: 0, maximum: 10000 }
        truncated: { type: boolean }

    WorkspaceSession:
      type: object
      required: [id, user_id, device, created_at, last_seen_at, current]
      description: >
        Сессия Keycloak участника воркспейса без IP-адреса, username и токенов.
        `device` — метка клиента из Keycloak; `current` — сессия вызывающего по claim
        `sid`.
      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
        user_id: { type: string, format: uuid }
        device: { type: string, maxLength: 120 }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        current: { type: boolean }

    WorkspaceSessionPage:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/WorkspaceSession" }
        next_cursor: { type: [string, "null"] }
        has_more: { type: boolean }

    WorkspaceSessionRevokeAll:
      type: object
      required: [revoked_sessions, affected_users]
      properties:
        revoked_sessions: { type: integer, minimum: 0 }
        affected_users: { type: integer, minimum: 0 }

    WorkspaceSecurity:
      type: object
      required:
        [require_2fa, session_timeout_minutes, dlp_enabled, retention_days, updated_at]
      description: >
        Политика безопасности воркспейса. `security_mode` отсутствует намеренно: режим
        immutable и не меняется этим API.
      properties:
        require_2fa: { type: boolean }
        session_timeout_minutes: { type: integer, minimum: 15, maximum: 10080 }
        dlp_enabled: { type: boolean }
        retention_days: { type: integer, minimum: 1, maximum: 3650 }
        updated_at: { type: string, format: date-time }

    WorkspaceSecurityUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        require_2fa: { type: boolean }
        session_timeout_minutes: { type: integer, minimum: 15, maximum: 10080 }
        dlp_enabled: { type: boolean }
        retention_days: { type: integer, minimum: 1, maximum: 3650 }
        security_mode:
          type: string
          enum: [MANAGED, E2EE]
          description: >
            Не изменяется: любое значение отклоняется `422 MODE_CHANGE_FORBIDDEN`.
            Поле документировано, чтобы клиент видел явный отказ, а не молчаливое
            игнорирование.

    AddWorkspaceMemberRequest:
      type: object
      required: [email, role]
      description: >
        Только существующий ACTIVE-пользователь. `role=OWNER` не назначается: сервер
        отвечает `403 ROLE_CHANGE_FORBIDDEN`; ADMIN может назначать только `MEMBER`/`GUEST`.
      properties:
        email: { type: string, format: email, maxLength: 254 }
        role: { type: string, enum: [OWNER, ADMIN, MEMBER, GUEST] }

    ChangeWorkspaceMemberRoleRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [OWNER, ADMIN, MEMBER, GUEST] }

    CreateWorkspaceRequest:
      type: object
      required: [name, security_mode]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        security_mode: { type: string, enum: [MANAGED, E2EE] }

    DeviceRegistration:
      type: object
      description: >
        All-or-none: либо все ключи (`identity_signing_key`, `identity_dh_key`,
        `identity_binding_signature`, `identity_key_alg`, `signed_prekey`) и опциональные
        `one_time_prekeys`, либо ни одного. Частичный набор → 422 INVALID_KEY_FORMAT.
        Без ключей → 201 legacy-устройство (`identity_key_alg=LEGACY`,
        `e2ee_capable=false`). Legacy не апгрейдится in-place (D-17/D-S4-03).
      required: [name, platform, app_version]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        platform: { type: string, enum: [WEB] }
        app_version: { type: string, maxLength: 40 }
        identity_signing_key: { $ref: "#/components/schemas/Base64Url32" }
        identity_dh_key: { $ref: "#/components/schemas/Base64Url32" }
        identity_binding_signature: { $ref: "#/components/schemas/Base64Url64" }
        identity_key_alg: { type: string, enum: [Ed25519+X25519, LEGACY] }
        signed_prekey: { $ref: "#/components/schemas/SignedPrekey" }
        one_time_prekeys:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/OneTimePrekey" }

    Notification:
      type: object
      required: [id, type, chat_id, title, created_at, read]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [MESSAGE, MENTION, SYSTEM] }
        chat_id: { type: [string, "null"], format: uuid }
        chat_name: { type: [string, "null"] }
        title: { type: string }
        body: { type: [string, "null"], description: "Для E2EE всегда null" }
        created_at: { type: string, format: date-time }
        read: { type: boolean }

    NotificationPage:
      type: object
      required: [items, page, unread_count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        page:
          type: object
          required: [has_more]
          properties:
            next_cursor: { type: [string, "null"] }
            has_more: { type: boolean }
        unread_count: { type: integer, minimum: 0 }

    ReadNotificationsRequest:
      type: object
      properties:
        ids:
          type: array
          maxItems: 100
          items: { type: string, format: uuid }
        all: { type: boolean, default: false }

    NotificationPreference:
      type: object
      required: [type, channel, mode]
      properties:
        chat_id: { type: [string, "null"], format: uuid }
        type: { type: string, enum: [MESSAGE, MENTION, SYSTEM] }
        channel: { type: string, enum: [IN_APP, EMAIL] }
        mode: { type: string, enum: [ALL, MENTIONS, MUTE] }

    NotificationPreferences:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NotificationPreference"

    NotificationPreferencePatch:
      allOf:
        - $ref: "#/components/schemas/NotificationPreference"
        - type: object
          required: [mode]

    StickerRef:
      type: object
      required: [id, pack_id, alt, url, favorite]
      properties:
        id: { type: string, format: uuid }
        pack_id: { type: string, format: uuid }
        alt: { type: string, maxLength: 120 }
        url: { type: string }
        favorite: { type: boolean }

    StickerPack:
      type: object
      required: [id, name, cover_url, stickers]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        cover_url: { type: string }
        stickers:
          type: array
          items:
            $ref: "#/components/schemas/StickerRef"

    StickerPackList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StickerPack"

    Plugin:
      type: object
      required: [id, name, description, permissions, modes]
      description: >
        Установленный плагин каталога. `kind=BUILTIN` — first-party метаданные;
        `kind=EXTERNAL` — admin-установленный статический пакет, для которого также
        отдаются `version`, `author` и `entry_url`. Серверный код плагина отсутствует
        и не исполняется; permissions описательные.
      properties:
        id:
          type: string
          pattern: "^[a-z][a-z0-9-]{0,63}$"
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, minLength: 1, maxLength: 500 }
        icon:
          type: [string, "null"]
          maxLength: 64
          description: Closed client-side icon token, never a URL or HTML.
        permissions:
          type: array
          uniqueItems: true
          description: >
            Built-in vocabulary (`MESSAGES`, `MEMBERS`, `FILES`, `WEBHOOKS`) or the
            closed manifest v1 tokens (`chat.messages.read`, …). Descriptive only.
          items:
            type: string
            enum:
              - MESSAGES
              - MEMBERS
              - FILES
              - WEBHOOKS
              - chat.messages.read
              - chat.messages.write
              - chat.members.read
              - chat.files.read
              - chat.files.write
              - webhooks.send
        modes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [MANAGED, E2EE]
        state:
          type: string
          enum: [ACTIVE, DISABLED]
          description: >
            Catalog lifecycle. Optional for additive compatibility; the server always
            emits it. DISABLED is a product kill switch.
        kind:
          type: string
          enum: [BUILTIN, EXTERNAL]
          default: BUILTIN
          description: >
            Optional for additive compatibility; the server always emits it.
            EXTERNAL marks an admin-installed static package.
        version:
          type: string
          description: Present only for EXTERNAL packages (semantic version).
        author:
          type: string
          maxLength: 120
          description: Present only for EXTERNAL packages.
        entry_url:
          type: string
          maxLength: 640
          description: >
            Present only for EXTERNAL packages. Authenticated API path of the entry
            document (for example `/api/v1/plugins/demo/assets/index.html`); it is not
            an object-storage URL. The caller must send its bearer JWT.

    AdminPluginPackage:
      type: object
      required: [id, name, version, description, author, entry, permissions, modes,
                 size_bytes, file_count, sha256, installed_at]
      description: >
        D1.2 (#86) metadata of one installed external package. Asset bytes and object
        keys are never exposed by the admin API.
      properties:
        id:
          type: string
          pattern: "^[a-z][a-z0-9-]{0,63}$"
        name: { type: string, minLength: 1, maxLength: 120 }
        version: { type: string, minLength: 1, maxLength: 32 }
        description: { type: string, minLength: 1, maxLength: 500 }
        author: { type: string, minLength: 1, maxLength: 120 }
        entry:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._/-]{0,511}$"
          description: Relative .html entry path inside the package.
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - chat.messages.read
              - chat.messages.write
              - chat.members.read
              - chat.files.read
              - chat.files.write
              - webhooks.send
        modes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [MANAGED, E2EE]
        size_bytes:
          type: integer
          minimum: 1
          maximum: 5242880
          description: Raw ZIP size.
        file_count:
          type: integer
          minimum: 1
          maximum: 200
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: SHA-256 of the uploaded ZIP.
        installed_at: { type: string, format: date-time }

    AdminPluginPackageList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminPluginPackage"

    PluginList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Plugin"

    ChatPluginState:
      type: object
      required: [plugin_id, enabled, available]
      properties:
        plugin_id:
          type: string
          pattern: "^[a-z][a-z0-9-]{0,63}$"
        enabled:
          type: boolean
          description: Stored per-chat toggle; missing row means false.
        available:
          type: boolean
          description: >
            Effective availability for this chat's immutable security mode and the
            catalog state.
        reason:
          type: string
          enum: [PLUGIN_NOT_AVAILABLE, PLUGIN_DISABLED]
          description: Present only when available is false.

    ChatPluginStateList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChatPluginState"

    ChatPluginUpdateRequest:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }

    MusicRoomPlugin:
      type: object
      required: [plugin_id, enabled, available, version]
      properties:
        plugin_id:
          type: string
          enum: [music-room]
        enabled:
          type: boolean
          description: Per-chat toggle; the open endpoint always enables the room.
        available:
          type: boolean
          description: Effective availability for the chat/workspace mode and catalog state.
        version:
          type: string
          enum: ["1.0.0"]
          description: >
            Версия встроенного плагина. Built-in строки `plugin.catalog` не хранят package
            version (V44), поэтому версия 1.0.0 отдаётся API и документируется в
            `backend/MUSIC-ROOM-REPORT.md`.
        reason:
          type: string
          enum: [PLUGIN_NOT_AVAILABLE, PLUGIN_DISABLED]
          description: Присутствует только при `available=false`.

    MusicRoomOpen:
      type: object
      required: [chat, plugin, created]
      properties:
        chat:
          $ref: "#/components/schemas/Chat"
        plugin:
          $ref: "#/components/schemas/MusicRoomPlugin"
        created:
          type: boolean
          description: >
            `true` только когда этот запрос создал канал (HTTP 201); повторное открытие
            существующей комнаты — `false` (HTTP 200).

    MusicRoomTrack:
      type: object
      required: [id, filename, size_bytes, created_at]
      description: >
        Метаданные AUDIO-вложения. Никогда не содержит object key, sha256, presigned URL
        или байты; скачивание идёт обычным путём `attachmentDownloadUrl`.
      properties:
        id: { type: string, format: uuid }
        message_id: { type: [string, "null"], format: uuid }
        filename: { type: string, minLength: 1, maxLength: 255 }
        mime_type: { type: [string, "null"], maxLength: 128 }
        duration_ms:
          type: [integer, "null"]
          format: int64
          minimum: 0
          maximum: 604800000
        artwork_url:
          type: [string, "null"]
          maxLength: 2048
          description: >
            artwork URL из метаданных (#97): клиентский абсолютный http(s) URL, который
            сервер не загружает и не проверяет, либо серверный URL аутентифицированного
            `GET /attachments/{attachmentId}/artwork` для извлечённой обложки. Байты
            обложки в JSON никогда не попадают.
        title: { type: [string, "null"], maxLength: 255 }
        artist: { type: [string, "null"], maxLength: 255 }
        size_bytes: { type: integer, format: int64, minimum: 1 }
        created_at: { type: string, format: date-time }

    MusicRoomTracks:
      type: object
      required: [chat_id, plugin, items, has_more]
      properties:
        chat_id: { type: string, format: uuid }
        plugin:
          $ref: "#/components/schemas/MusicRoomPlugin"
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/MusicRoomTrack"
        has_more:
          type: boolean
          description: >
            `true` когда в канале больше 100 AUDIO-вложений и более старые не вошли в
            срез (курсора в этом срезе нет).

    PollOption:
      type: object
      required: [id, text, position, votes]
      properties:
        id: { type: string, format: uuid }
        text:
          type: string
          minLength: 1
          maxLength: 200
          description: Plain text; HTML/control-символы запрещены.
        position:
          type: integer
          minimum: 0
          maximum: 9
          description: Порядок варианта в опросе (0-based).
        votes:
          type: integer
          minimum: 0
          description: Число уникальных пользователей, выбравших этот вариант.

    Poll:
      type: object
      required:
        [
          id,
          question,
          options,
          creator_id,
          closed,
          created_at,
          total_votes,
        ]
      description: >
        D1.1 (#76) server-side poll metadata for a managed chat. E2EE chats can never use
        this plugin; no encrypted content or keys are represented.
      properties:
        id: { type: string, format: uuid }
        question:
          type: string
          minLength: 1
          maxLength: 500
          description: Plain text; HTML/control-символы запрещены.
        options:
          type: array
          minItems: 2
          maxItems: 10
          items:
            $ref: "#/components/schemas/PollOption"
        creator_id: { type: string, format: uuid }
        closed: { type: boolean }
        closed_at:
          type: [string, "null"]
          format: date-time
        created_at: { type: string, format: date-time }
        my_option_id:
          type: [string, "null"]
          format: uuid
          description: Вариант, выбранный вызывающим; null если голоса нет.
        total_votes:
          type: integer
          minimum: 0
          description: Число уникальных проголосовавших (один голос на пользователя).
        message_id:
          type: [string, "null"]
          format: uuid
          description: >
            #95: id сообщения `POLL` в ленте чата. Присутствует в ответе `POST
            /chats/{chatId}/polls` (создано в той же транзакции); list/vote/close его не
            возвращают.

    PollList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Poll"

    PollCreate:
      type: object
      additionalProperties: false
      required: [question, options]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 500
          description: Plain text без HTML/control-символов; пробелы по краям срезаются.
        options:
          type: array
          minItems: 2
          maxItems: 10
          description: Уникальные варианты (2..10), каждый 1..200 символов.
          items:
            type: string
            minLength: 1
            maxLength: 200

    PollVoteRequest:
      type: object
      additionalProperties: false
      required: [option_id]
      properties:
        option_id:
          type: string
          format: uuid
          description: Вариант этого же опроса; чужой option_id — 422 POLL_OPTION_INVALID.

    PollCloseRequest:
      type: object
      additionalProperties: false
      required: [closed]
      properties:
        closed:
          type: boolean
          description: Поддерживается только true; false — 422 POLL_STATE_INVALID.

    Task:
      type: object
      required: [id, title, creator_id, done, created_at]
      description: >
        D1.1 (#76) chat-scoped task in a managed chat. There is no plugin code execution;
        assignee and due date are optional metadata.
      properties:
        id: { type: string, format: uuid }
        title:
          type: string
          minLength: 1
          maxLength: 500
          description: Plain text; HTML/control-символы запрещены.
        creator_id: { type: string, format: uuid }
        assignee_id:
          type: [string, "null"]
          format: uuid
          description: ACTIVE-участник этого чата или null.
        due_at:
          type: [string, "null"]
          format: date-time
        done: { type: boolean }
        completed_by:
          type: [string, "null"]
          format: uuid
        completed_at:
          type: [string, "null"]
          format: date-time
        created_at: { type: string, format: date-time }
        message_id:
          type: [string, "null"]
          format: uuid
          description: >
            #95: id сообщения `TASK` в ленте чата. Присутствует в ответе `POST
            /chats/{chatId}/tasks`; list/update его не возвращают.

    TaskList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Task"

    TaskCreate:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
          description: Plain text без HTML/control-символов; пробелы по краям срезаются.
        assignee_id:
          type: [string, "null"]
          format: uuid
          description: Необязательный ACTIVE-участник чата.
        due_at:
          type: [string, "null"]
          format: date-time

    TaskUpdate:
      type: object
      additionalProperties: false
      required: [done]
      properties:
        done:
          type: boolean
          description: >
            true — выполнить, false — переоткрыть. `completed_by`/`completed_at`
            выставляет сервер.

    TranslationRequest:
      type: object
      additionalProperties: false
      required: [target]
      properties:
        target:
          type: string
          minLength: 2
          maxLength: 16
          pattern: "^[a-z]{2,3}(-[A-Za-z]{2,4})?$"
          description: >
            Целевой язык (`ru`, `en`, `de`, `pt-BR`). Не влияет на права доступа.

    Translation:
      type: object
      required: [text]
      description: >
        Перевод managed TEXT-сообщения. Провайдер по умолчанию не настроен; при его
        отсутствии/недоступности ответ — 503 TRANSLATION_UNAVAILABLE.
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 8000
          description: Plain text без HTML/control-символов; сервер не логирует его.

    WorkspaceOverview:
      type: object
      required:
        [members, chats, messages, files, dlp, storage, audit_recent, generated_at]
      description: >
        Агрегаты дашборда воркспейса. Только счётчики/байты и до пяти последних
        audit-действий (для OWNER/ADMIN; остальные получают пустой `audit_recent`).
        Содержимое сообщений, E2EE-конверты, имена файлов, IP и токены отсутствуют.
      properties:
        members:
          type: object
          required: [total, online]
          properties:
            total: { type: integer, format: int64, minimum: 0 }
            online:
              type: integer
              format: int64
              minimum: 0
              description: >
                Live single-node realtime-сигнал: различные пользователи с открытым WS
                в этом воркспейсе; не персистентный, ограничен `members.total`.
        chats: { type: integer, format: int64, minimum: 0 }
        messages:
          type: object
          required: [total, last_24h]
          properties:
            total:
              type: integer
              format: int64
              minimum: 0
              description: >
                Сумма выделенных последовательностей `chat_counters` (включая удалённые
                сообщения), без сканирования партиционированной ленты.
            last_24h:
              type: integer
              format: int64
              minimum: 0
              description: Неудалённые строки `message.messages` за последние 24 часа.
        files:
          type: object
          required: [total, used_bytes, reserved_bytes]
          properties:
            total:
              type: integer
              format: int64
              minimum: 0
              description: Вложения со статусом READY/BOUND (объекты ещё хранятся).
            used_bytes: { type: integer, format: int64, minimum: 0 }
            reserved_bytes: { type: integer, format: int64, minimum: 0 }
        dlp:
          type: object
          required: [events_last_24h]
          properties:
            events_last_24h: { type: integer, format: int64, minimum: 0 }
        storage:
          type: object
          required: [used_bytes, quota_bytes]
          properties:
            used_bytes: { type: integer, format: int64, minimum: 0 }
            quota_bytes: { type: integer, format: int64, minimum: 0 }
        audit_recent:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/WorkspaceAuditEvent" }
        generated_at: { type: string, format: date-time }

    WorkspaceLimits:
      type: object
      required:
        [
          tariff,
          max_file_bytes,
          storage_bytes,
          max_attachments,
          guest_file_bytes,
          usage,
          max_chats_per_user,
          chats_used,
        ]
      properties:
        tariff: { type: string, enum: [COMMUNITY, FAMILY, TEAM, ENTERPRISE] }
        max_file_bytes: { type: integer, format: int64 }
        storage_bytes: { type: integer, format: int64 }
        max_attachments: { type: integer }
        guest_file_bytes: { type: integer, format: int64 }
        usage:
          type: object
          required: [used, reserved, limit]
          properties:
            used: { type: integer, format: int64 }
            reserved: { type: integer, format: int64 }
            limit: { type: integer, format: int64 }
        max_chats_per_user:
          type: integer
          minimum: 1
          description: Лимит активных чатов пользователя в воркспейсе (system_settings)
        chats_used:
          type: integer
          format: int64
          minimum: 0
          description: Текущее число активных чатов пользователя в воркспейсе

    PreflightFile:
      type: object
      required: [name, size]
      properties:
        name: { type: string, maxLength: 255 }
        size: { type: integer, format: int64, minimum: 1 }
        mime: { type: string }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }

    PreflightRequest:
      type: object
      required: [chat_id, files]
      properties:
        chat_id: { type: string, format: uuid }
        files:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/PreflightFile"

    PreflightDecision:
      type: object
      required: [name, allowed]
      properties:
        name: { type: string }
        allowed: { type: boolean }
        error: { type: [string, "null"] }
        details:
          type: object
          additionalProperties: true
        part_size: { type: [integer, "null"] }

    PreflightResponse:
      type: object
      required: [decision, max_file_bytes, max_attachments, quota, files]
      properties:
        decision: { type: string, enum: [ALLOW, DENY] }
        max_file_bytes: { type: integer, format: int64 }
        max_attachments: { type: integer }
        quota:
          type: object
          required: [used, reserved, limit]
          properties:
            used: { type: integer, format: int64 }
            reserved: { type: integer, format: int64 }
            limit: { type: integer, format: int64 }
        files:
          type: array
          items:
            $ref: "#/components/schemas/PreflightDecision"

    UploadInitRequest:
      type: object
      required: [chat_id, filename, size, encryption_mode]
      properties:
        chat_id: { type: string, format: uuid }
        filename: { type: string, maxLength: 255 }
        size: { type: integer, format: int64, minimum: 1 }
        mime: { type: string }
        encryption_mode: { type: string, enum: [MANAGED] }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        media:
          type: [object, "null"]
          description: >
            Optional sanitized media metadata for this upload (D1-BE2/#97). Accepted only for
            MANAGED uploads; the server rejects every non-MANAGED mode before parsing it.
            For MANAGED AUDIO the server also extracts ID3v2.2/2.3/2.4 or M4A atoms after
            complete and replaces an absent or empty payload with `metadata_source=SERVER`.
            A voice recording (audio/webm, audio/ogg) must be kind=AUDIO with a 1..600000
            ms duration. complete copies the values to AttachmentRef.media. Strings are
            trimmed, HTML/control-free and bounded; artwork_url is an absolute http(s) URL
            with a hostname that the server never fetches (no server-side SSRF).
          required: [kind, metadata_source]
          properties:
            kind: { type: string, enum: [AUDIO, VIDEO, IMAGE, FILE] }
            duration_ms:
              type: [integer, "null"]
              minimum: 0
              maximum: 604800000
            width: { type: [integer, "null"], minimum: 1, maximum: 16384 }
            height: { type: [integer, "null"], minimum: 1, maximum: 16384 }
            title: { type: [string, "null"], maxLength: 255 }
            artist: { type: [string, "null"], maxLength: 255 }
            album: { type: [string, "null"], maxLength: 255 }
            year: { type: [string, "null"], maxLength: 8, pattern: "^[0-9]{4}$" }
            genre: { type: [string, "null"], maxLength: 64 }
            artwork_url:
              type: [string, "null"]
              format: uri
              maxLength: 2048
            metadata_source: { type: string, enum: [ID3, SERVER, CLIENT, NONE] }

    UploadSession:
      type: object
      required: [upload_id, status, part_size, total_parts, expires_at]
      properties:
        upload_id: { type: string, format: uuid }
        status:
          type: string
          enum:
            [
              INIT,
              UPLOADING,
              PAUSED,
              COMPLETING,
              SCANNING,
              READY,
              QUARANTINED,
              BOUND,
              FAILED,
              ABORTED,
              EXPIRED,
            ]
        part_size: { type: integer }
        total_parts: { type: integer }
        received_parts:
          type: array
          items: { type: integer }
        expires_at: { type: string, format: date-time }
        attachment_id: { type: [string, "null"], format: uuid }

    UploadedImage:
      type: object
      description: >
        Метаданные прямого изображения (`POST /media/images`). Никогда не содержит
        object key, имя файла, EXIF или иные метаданные исходника; `size` — ровно
        размер сохранённого объекта.
      required: [file_id, width, height, mime, size]
      properties:
        file_id: { type: string, format: uuid }
        width: { type: integer, minimum: 1, maximum: 16384 }
        height: { type: integer, minimum: 1, maximum: 16384 }
        mime: { type: string, enum: [image/png, image/jpeg, image/webp] }
        size: { type: integer, format: int64, minimum: 1, maximum: 5242880 }

    UploadPart:
      type: object
      required: [part_no, received]
      properties:
        part_no: { type: integer }
        received: { type: boolean }
        etag: { type: [string, "null"] }
        size_bytes: { type: integer, format: int64 }

    UploadCompleteRequest:
      type: object
      required: [sha256, parts_count]
      properties:
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        parts_count: { type: integer, minimum: 1 }

    AttachmentRef:
      type: object
      required: [id, size_bytes, scan_status]
      properties:
        id: { type: string, format: uuid }
        filename: { type: [string, "null"] }
        size_bytes: { type: integer, format: int64 }
        mime_type: { type: [string, "null"] }
        scan_status:
          { type: string, enum: [PENDING, CLEAN, INFECTED, FAILED, SKIPPED] }
        media:
          type: [object, "null"]
          description: >
            Managed-only media metadata (D1-BE2/#97). The client may send parsed ID3/fallback
            values at upload init; on MANAGED AUDIO uploads the server also extracts
            ID3v2.2/2.3/2.4 and M4A/MP4 atoms itself and fills absent/incomplete client
            metadata with `metadata_source=SERVER`. Strings are trimmed, HTML/control-free
            and bounded; artwork_url is an absolute http(s) URL that the server never fetches
            (no server-side SSRF). A server-built artwork_url points at the authenticated
            `GET /attachments/{attachmentId}/artwork` endpoint; the cover bytes are never
            embedded in the JSON. Absent/null for plain files, legacy attachments and E2EE —
            an E2EE message cannot carry attachments in this slice.
          required: [kind, metadata_source]
          properties:
            kind: { type: string, enum: [AUDIO, VIDEO, IMAGE, FILE] }
            duration_ms:
              type: [integer, "null"]
              minimum: 0
              maximum: 604800000
            width: { type: [integer, "null"], minimum: 1, maximum: 16384 }
            height: { type: [integer, "null"], minimum: 1, maximum: 16384 }
            title: { type: [string, "null"], maxLength: 255 }
            artist: { type: [string, "null"], maxLength: 255 }
            album: { type: [string, "null"], maxLength: 255 }
            year: { type: [string, "null"], maxLength: 8, pattern: "^[0-9]{4}$" }
            genre: { type: [string, "null"], maxLength: 64 }
            artwork_url:
              type: [string, "null"]
              format: uri
              maxLength: 2048
              description: >
                Client-supplied absolute http(s) URL (never fetched by the server) or the
                server-built URL of `GET /attachments/{attachmentId}/artwork` for an
                extracted cover. The server never fetches either URL.
            metadata_source: { type: string, enum: [ID3, SERVER, CLIENT, NONE] }

    DownloadUrl:
      type: object
      required: [url, expires_at, size_bytes, sha256]
      properties:
        url: { type: string, format: uri }
        expires_at: { type: string, format: date-time }
        size_bytes: { type: integer, format: int64 }
        sha256: { type: string }

    FileItem:
      description: >
        File-center element (#73/#83): `AttachmentRef` metadata plus chat/message provenance.
        Never contains the object key, content, sha256 or a presigned URL; download goes
        through `attachmentDownloadUrl`. `chat_name` is null for DIRECT chats (the client
        derives the peer name, D-S4-02). `chat_id`/`message_id` are null for a global
        workspace file (#83) that has not been attached to a message yet; such a file is
        visible only to its uploader (and to workspace OWNER/ADMIN for moderation).
      allOf:
        - $ref: "#/components/schemas/AttachmentRef"
        - type: object
          required: [chat_id, message_id, created_at]
          properties:
            chat_id: { type: [string, "null"], format: uuid }
            chat_name: { type: [string, "null"] }
            message_id: { type: [string, "null"], format: uuid }
            created_at: { type: string, format: date-time }

    FileQuotaSummary:
      type: object
      description: >
        Workspace-level quota snapshot for the file-center header. `percent` is
        `used + reserved` against the storage limit, clamped to 100. Null when the
        workspace limits/usage rows cannot be read.
      required: [used_bytes, reserved_bytes, storage_bytes, percent]
      properties:
        used_bytes: { type: integer, format: int64, minimum: 0 }
        reserved_bytes: { type: integer, format: int64, minimum: 0 }
        storage_bytes: { type: integer, format: int64, minimum: 0 }
        percent: { type: integer, minimum: 0, maximum: 100 }

    FilePage:
      type: object
      required: [items, page, quota]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FileItem"
        page:
          type: object
          required: [has_more]
          properties:
            next_cursor: { type: [string, "null"] }
            has_more: { type: boolean }
        quota:
          oneOf:
            - $ref: "#/components/schemas/FileQuotaSummary"
            - type: "null"

    FileRename:
      type: object
      description: #83: новое отображаемое имя глобального файла (object key не меняется).
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }

    SearchHighlight:
      type: object
      description: >
        #83: диапазон подсветки внутри `snippet` (start включительно, end исключительно).
        Смещения — в символах строки, как в JSON/JavaScript (UTF-16 code units).
      required: [start, end]
      properties:
        start: { type: integer, minimum: 0 }
        end: { type: integer, minimum: 0 }

    MessageSearchHit:
      type: object
      description: >
        #83: одно попадание серверного поиска. `snippet` — plain text managed-сообщения
        (не HTML); клиент обязан рендерить его как текст и подсвечивать диапазоны
        `highlights`. E2EE-сообщения в выдачу не попадают.
      required: [message_id, chat_id, seq, snippet, highlights, created_at]
      properties:
        message_id: { type: string, format: uuid }
        chat_id: { type: string, format: uuid }
        chat_name: { type: [string, "null"] }
        seq: { type: integer, format: int64, minimum: 1 }
        sender_id: { type: [string, "null"], format: uuid }
        sender_display_name: { type: [string, "null"] }
        snippet: { type: string, maxLength: 240 }
        highlights:
          type: array
          items: { $ref: "#/components/schemas/SearchHighlight" }
        created_at: { type: string, format: date-time }

    MessageSearchPage:
      type: object
      description: >
        #83: страница серверного поиска. `next_cursor` непрозрачен, привязан к воркспейсу,
        фильтру `chat_id` и нормализованному запросу; `has_more` — в окне сканирования
        остались кандидаты.
      required: [items, page, query]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MessageSearchHit" }
        page:
          type: object
          required: [has_more]
          properties:
            next_cursor: { type: [string, "null"] }
            has_more: { type: boolean }
        query: { type: string, maxLength: 200 }

    Mention:
      type: object
      description: >
        #83: запись mention-инбокса. Содержит только метаданные (без текста сообщения):
        чат, сообщение, автор и состояние прочтения.
      required: [id, chat_id, message_id, mention_all, created_at]
      properties:
        id: { type: string, format: uuid }
        chat_id: { type: string, format: uuid }
        chat_name: { type: [string, "null"] }
        message_id: { type: string, format: uuid }
        sender_id: { type: [string, "null"], format: uuid }
        sender_display_name: { type: [string, "null"] }
        mention_all: { type: boolean }
        read_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    MentionPage:
      type: object
      description: >
        #83: страница mention-инбокса и счётчик непрочитанных в текущем воркспейсе.
        Сортировка `created_at DESC, id DESC`; `next_cursor` непрозрачен и привязан к
        воркспейсу и фильтру `unread`.
      required: [items, page, unread_count]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Mention" }
        page:
          type: object
          required: [has_more]
          properties:
            next_cursor: { type: [string, "null"] }
            has_more: { type: boolean }
        unread_count: { type: integer, format: int64, minimum: 0 }

    ReadMentionsRequest:
      type: object
      description: >
        #83: отметить упоминания прочитанными. Нужен `ids` (до 200) или `all=true`.
        Идемпотентно: уже прочитанные строки не меняются.
      properties:
        ids:
          type: array
          maxItems: 200
          items: { type: string, format: uuid }
        all: { type: boolean }

    RealtimeTicket:
      type: object
      required: [ticket, expires_at, ws_url]
      properties:
        ticket: { type: string }
        expires_at: { type: string, format: date-time }
        ws_url: { type: string, example: "ws://localhost:8081/ws" }

    Device:
      type: object
      required: [id, platform, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: [string, "null"] }
        platform: { type: string, enum: [WEB] }
        status: { type: string, enum: [PENDING, ACTIVE, REVOKED] }
        e2ee_capable: { type: boolean }
        key_generation: { type: integer, minimum: 1 }
        identity_signing_key:
          oneOf:
            - $ref: "#/components/schemas/Base64Url32"
            - type: "null"
        identity_dh_key:
          oneOf:
            - $ref: "#/components/schemas/Base64Url32"
            - type: "null"
        identity_binding_signature:
          oneOf:
            - $ref: "#/components/schemas/Base64Url64"
            - type: "null"
        identity_key_alg: { type: string, enum: [Ed25519+X25519, LEGACY] }
        fingerprint:
          oneOf:
            - $ref: "#/components/schemas/Base64Url32"
            - type: "null"
        signed_prekey:
          oneOf:
            - $ref: "#/components/schemas/SignedPrekey"
            - type: "null"
        one_time_prekeys_available: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: [string, "null"], format: date-time }

    DeviceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Device" }

    ChatSummary:
      type: object
      required: [id, name, type, security_mode, unread_count, last_seq]
      properties:
        id: { type: string, format: uuid }
        name: { type: [string, "null"] }
        description:
          type: [string, "null"]
          maxLength: 500
          description: >
            Plain-text chat description (D1-BE3, additive). Null when unset, cleared, or
            not readable; never contains HTML.
        type: { type: string, enum: [DIRECT, GROUP] }
        security_mode: { type: string, enum: [MANAGED, E2EE] }
        visibility:
          type: [string, "null"]
          enum: [PUBLIC, PRIVATE, null]
          description: >
            GROUP channel visibility (additive). `PUBLIC` — every ACTIVE workspace member and
            every future member; `PRIVATE` — only the creator and the selected members.
            `null` for DIRECT chats and for rows without channel settings.
        peer_id: { type: [string, "null"], format: uuid }
        peer_has_e2ee_capable_devices: { type: boolean }
        last_message_at: { type: [string, "null"], format: date-time }
        unread_count: { type: integer, minimum: 0 }
        last_seq: { type: integer, format: int64, minimum: 0 }
        cover_file_id:
          type: [string, "null"]
          format: uuid
          description: P0-2 GROUP cover attachment id; null for DIRECT and when unset.
        avatar_file_id:
          type: [string, "null"]
          format: uuid
          description: >
            GROUP channel icon/avatar attachment id; null for DIRECT and when unset.
        read_only:
          type: boolean
          description: P0-2 read-only flag (GROUP; false for DIRECT).
        join_policy:
          type: [string, "null"]
          enum: [OPEN, INVITE_ONLY, CLOSED, null]
          description: P0-2 GROUP join policy; null for DIRECT.
        archived:
          type: boolean
          description: >
            P0-2 caller-local archive flag. The main list excludes archived chats;
            `?archived=true` returns only them.
        member_count:
          type: integer
          minimum: 0
          description: >
            #99 exact number of ACTIVE chat members, never the workspace member count.
            GROUP: ACTIVE chat participants that also hold an ACTIVE workspace membership.
            DIRECT: 2 while both participants remain ACTIVE workspace members; it falls
            to 1 after the other participant leaves the workspace (their participant row
            becomes REMOVED). Additive field.

    ChatList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChatSummary"

    Message:
      type: object
      required: [id, chat_id, seq, type, created_at, version]
      properties:
        id: { type: string, format: uuid }
        chat_id: { type: string, format: uuid }
        seq: { type: integer, format: int64, minimum: 1 }
        type: { type: string, enum: [TEXT, STICKER, SYSTEM, POLL, TASK] }
        sender_id: { type: [string, "null"], format: uuid }
        sender_display_name: { type: [string, "null"] }
        sender_type:
          type: string
          enum: [USER, BOT]
          default: USER
          description: >
            #96: автор — пользователь (`USER`, по умолчанию) или бот (`BOT`). Для бота
            `sender_id` всегда null, `bot_id` заполнен, а `sender_display_name` — имя бота
            на момент отправки. Клиент рисует BOT-бейдж по этому полю, не по имени.
        bot_id:
          type: [string, "null"]
          format: uuid
          description: >
            #96: id автора-бота при `sender_type=BOT`; null для пользовательских сообщений.
            Никогда не подменяет `sender_id` (impersonation запрещён).
        text: { type: [string, "null"] }
        reply_to_id: { type: [string, "null"], format: uuid }
        thread_root_id:
          type: [string, "null"]
          format: uuid
          description: >
            Корень треда; null — обычное сообщение канала. У ответа — id корня,
            глубина всегда 1. В E2EE-чате всегда null.
        thread_summary:
          type: [object, "null"]
          description: >
            Только для корня треда; считается сервером одним запросом. У корня без
            ответов — объект с `reply_count = 0`. Managed-only: для E2EE `null`,
            plaintext-превью не раскрывается.
          properties:
            reply_count: { type: integer, minimum: 0 }
            last_reply_at: { type: [string, "null"], format: date-time }
            last_reply_author_id: { type: [string, "null"], format: uuid }
            last_reply_excerpt: { type: [string, "null"], maxLength: 160 }
        created_at: { type: string, format: date-time }
        edited_at: { type: [string, "null"], format: date-time }
        deleted_at: { type: [string, "null"], format: date-time }
        version: { type: integer, minimum: 1 }
        sticker_id: { type: [string, "null"], format: uuid }
        sticker:
          type: [object, "null"]
          allOf:
            - $ref: "#/components/schemas/StickerRef"
        poll_id:
          type: [string, "null"]
          format: uuid
          description: >
            #95: id опроса; не null только при `type=POLL`. Сервер создаёт такое сообщение
            вместе с опросом, клиентского POST сообщения с `type=POLL` нет.
        poll:
          oneOf:
            - $ref: "#/components/schemas/Poll"
            - type: "null"
          description: >
            #95: встроенный опрос с актуальными голосами и `my_option_id` вызывающего.
            `null` для не-POLL сообщений и tombstone (delete-for-all). Не E2EE: серверные
            плагины в E2EE-чате недоступны.
        task_id:
          type: [string, "null"]
          format: uuid
          description: >
            #95: id задачи; не null только при `type=TASK`. Сообщение создаётся сервером
            вместе с задачей.
        task:
          oneOf:
            - $ref: "#/components/schemas/Task"
            - type: "null"
          description: >
            #95: встроенная задача с актуальным `done`/`completed_by`/`completed_at`
            (изменение задачи отражается при следующем history/replay чтении). `null` для
            не-TASK сообщений и tombstone.
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/AttachmentRef"
        reactions:
          type: array
          description: >
            Агрегированные реакции страницы: один элемент на emoji, `me` — ставил ли
            реакцию вызывающий. Считается одним запросом на страницу, без N+1. Для
            E2EE и удалённых сообщений всегда пуст.
          items:
            $ref: "#/components/schemas/ReactionSummary"
        client_message_id: { type: [string, "null"], format: uuid }
        crypto:
          oneOf:
            - $ref: "#/components/schemas/CryptoEnvelope"
            - type: "null"
        mentions:
          type: array
          description: >
            #83: явно упомянутые пользователи (id), в порядке запроса. Для E2EE, tombstone
            и сообщений без упоминаний — пустой массив. Клиент рисует @-упоминания по id;
            текст сообщения сохраняется как есть и не переписывается сервером.
          items: { type: string, format: uuid }
        mention_all:
          type: boolean
          description: >
            #83: сообщение содержит `@all`. Для E2EE и tombstone всегда false. Рассылку
            получают активные участники чата на момент отправки, кроме автора.

    MessageCreate:
      type: object
      description: >
        Managed: text/sticker/attachments. E2EE: только `envelopes[]`; `text`,
        `sticker_id`, `attachment_ids`, `reply_to_id`, `thread_root_id` запрещены (422
        E2EE_PLAINTEXT_FORBIDDEN / THREADS_E2EE_UNSUPPORTED). Managed-запрос с
        `envelopes` → 422 ENVELOPES_NOT_ALLOWED; при выключенном флаге E2EE → 409
        E2EE_DISABLED.
      required: [client_message_id, type]
      properties:
        client_message_id: { type: string, format: uuid }
        type: { type: string, enum: [TEXT, STICKER] }
        text: { type: [string, "null"], maxLength: 8000 }
        reply_to_id: { type: [string, "null"], format: uuid }
        thread_root_id:
          type: [string, "null"]
          format: uuid
          description: >
            Ответ в тред: id корня в том же чате. Запрещён для E2EE (422
            THREADS_E2EE_UNSUPPORTED); ответ на ответ запрещён (422
            THREAD_NESTING_UNSUPPORTED).
        sticker_id: { type: [string, "null"], format: uuid }
        attachment_ids:
          type: array
          maxItems: 10
          items: { type: string, format: uuid }
        mentions:
          type: array
          maxItems: 50
          uniqueItems: true
          description: >
            #83: id активных участников чата. Не участник/неизвестный id → 422
            `MENTION_INVALID` (без раскрытия существования). Дубликаты схлопываются.
            Для E2EE запрещено (422 `E2EE_PLAINTEXT_FORBIDDEN`), для STICKER — 422.
          items: { type: string, format: uuid }
        mention_all:
          type: boolean
          default: false
          description: >
            #83: `@all`. Разрешён только OWNER/ADMIN чата (403 `MENTION_ALL_FORBIDDEN`),
            в E2EE запрещён. Рассылается активным участникам чата на момент отправки,
            автор уведомление не получает.
        envelopes:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: "#/components/schemas/CryptoEnvelope" }

    MessageEdit:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 8000
          description: Новый plaintext managed-сообщения (сервер шифрует при записи).
        version:
          type: [integer, "null"]
          minimum: 1
          description: >
            Необязательная оптимистичная блокировка: при несовпадении с текущей
            версией — `409 VERSION_CONFLICT`. Без поля сервер всё равно увеличивает
            `version` на единицу.

    ReactionCreate:
      type: object
      additionalProperties: false
      required: [emoji]
      properties:
        emoji:
          type: string
          minLength: 1
          maxLength: 32
          description: >
            Emoji-последовательность (ZWJ/VS16/skin-tone допустимы); plain text,
            без HTML/пробелов/control-символов.

    ReactionSummary:
      type: object
      required: [emoji, count, me]
      properties:
        emoji: { type: string, minLength: 1, maxLength: 32 }
        count:
          type: integer
          minimum: 1
          description: Число уникальных пользователей с этой реакцией.
        me:
          type: boolean
          description: Ставил ли реакцию вызывающий.

    MessagePage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        page:
          type: object
          required: [has_more]
          properties:
            next_cursor: { type: [string, "null"] }
            has_more: { type: boolean }

    Base64Url16:
      type: string
      contentEncoding: base64url
      pattern: "^[A-Za-z0-9_-]{22}$"
    Base64Url32:
      type: string
      contentEncoding: base64url
      pattern: "^[A-Za-z0-9_-]{43}$"
    Base64Url64:
      type: string
      contentEncoding: base64url
      pattern: "^[A-Za-z0-9_-]{86}$"

    SignedPrekey:
      type: object
      additionalProperties: false
      required: [key_id, public_key, signature]
      properties:
        key_id:
          {
            type: string,
            minLength: 1,
            maxLength: 64,
            pattern: "^[A-Za-z0-9._-]+$",
          }
        public_key: { $ref: "#/components/schemas/Base64Url32" }
        signature: { $ref: "#/components/schemas/Base64Url64" }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }

    OneTimePrekey:
      type: object
      additionalProperties: false
      required: [key_id, public_key]
      properties:
        key_id:
          {
            type: string,
            minLength: 1,
            maxLength: 64,
            pattern: "^[A-Za-z0-9._-]+$",
          }
        public_key: { $ref: "#/components/schemas/Base64Url32" }

    CryptoHeader:
      type: object
      additionalProperties: false
      required: [v, dh, pn, n]
      properties:
        v: { type: integer, enum: [1] }
        dh: { $ref: "#/components/schemas/Base64Url32" }
        pn: { type: integer, minimum: 0, maximum: 2147483647 }
        n: { type: integer, minimum: 0, maximum: 2147483647 }

    PrekeyBlock:
      type: object
      additionalProperties: false
      required:
        [
          sender_identity_signing_key,
          sender_identity_dh_key,
          sender_ephemeral_key,
          recipient_identity_dh_key,
          spk_id,
          spk_public,
          signature,
        ]
      properties:
        sender_identity_signing_key:
          { $ref: "#/components/schemas/Base64Url32" }
        sender_identity_dh_key: { $ref: "#/components/schemas/Base64Url32" }
        sender_ephemeral_key: { $ref: "#/components/schemas/Base64Url32" }
        recipient_identity_dh_key: { $ref: "#/components/schemas/Base64Url32" }
        spk_id:
          {
            type: string,
            minLength: 1,
            maxLength: 64,
            pattern: "^[A-Za-z0-9._-]+$",
          }
        spk_public: { $ref: "#/components/schemas/Base64Url32" }
        opk_id:
          {
            type: [string, "null"],
            maxLength: 64,
            pattern: "^[A-Za-z0-9._-]+$",
          }
        opk_public:
          oneOf:
            - $ref: "#/components/schemas/Base64Url32"
            - type: "null"
        signature: { $ref: "#/components/schemas/Base64Url64" }

    CryptoEnvelope:
      type: object
      additionalProperties: false
      required:
        [
          v,
          scheme,
          chat_id,
          sender_device_id,
          sender_key_generation,
          recipient_device_id,
          recipient_key_generation,
          session_id,
          header,
          ciphertext,
        ]
      properties:
        v: { type: integer, enum: [1] }
        scheme: { type: string, enum: [PAIRWISE_X3DH_DR] }
        chat_id: { type: string, format: uuid }
        sender_device_id: { type: string, format: uuid }
        sender_key_generation:
          { type: integer, minimum: 1, maximum: 2147483647 }
        recipient_device_id: { type: string, format: uuid }
        recipient_key_generation:
          { type: integer, minimum: 1, maximum: 2147483647 }
        session_id: { $ref: "#/components/schemas/Base64Url16" }
        header: { $ref: "#/components/schemas/CryptoHeader" }
        ciphertext:
          type: string
          contentEncoding: base64url
          minLength: 363
          maxLength: 44054
        prekey:
          oneOf:
            - $ref: "#/components/schemas/PrekeyBlock"
            - type: "null"

    SignedPrekeyUpload:
      type: object
      additionalProperties: false
      properties:
        signed_prekey: { $ref: "#/components/schemas/SignedPrekey" }
        one_time_prekeys:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/OneTimePrekey" }

    PrekeyUploadResult:
      type: object
      required: [device_id, key_generation, one_time_prekeys_available]
      properties:
        device_id: { type: string, format: uuid }
        key_generation: { type: integer, minimum: 1 }
        signed_prekey_id: { type: [string, "null"] }
        signed_prekey_expires_at: { type: [string, "null"], format: date-time }
        one_time_prekeys_stored: { type: integer, minimum: 0 }
        one_time_prekeys_available: { type: integer, minimum: 0 }
        one_time_prekeys_limit: { type: integer, enum: [200] }

    KeyClaimRequest:
      type: object
      required: [chat_id, devices]
      properties:
        chat_id: { type: string, format: uuid }
        devices:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [device_id, user_id]
            properties:
              device_id: { type: string, format: uuid }
              user_id: { type: string, format: uuid }

    PrekeyBundle:
      type: object
      required:
        [
          user_id,
          device_id,
          key_generation,
          identity_signing_key,
          identity_dh_key,
          identity_binding_signature,
          identity_key_alg,
          signed_prekey,
          otp_exhausted,
        ]
      properties:
        user_id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        key_generation: { type: integer, minimum: 1 }
        identity_signing_key: { $ref: "#/components/schemas/Base64Url32" }
        identity_dh_key: { $ref: "#/components/schemas/Base64Url32" }
        identity_binding_signature: { $ref: "#/components/schemas/Base64Url64" }
        identity_key_alg: { type: string, enum: [Ed25519+X25519] }
        signed_prekey: { $ref: "#/components/schemas/SignedPrekey" }
        one_time_prekey:
          oneOf:
            - $ref: "#/components/schemas/OneTimePrekey"
            - type: "null"
        otp_exhausted: { type: boolean }

    UnavailableDevice:
      type: object
      required: [device_id, reason]
      properties:
        device_id: { type: string, format: uuid }
        reason: { type: string, enum: [NO_SPK, NO_KEYS] }

    KeyClaimResponse:
      type: object
      required: [bundles, unavailable]
      properties:
        bundles:
          type: array
          items: { $ref: "#/components/schemas/PrekeyBundle" }
        unavailable:
          type: array
          items: { $ref: "#/components/schemas/UnavailableDevice" }

    DeviceKeyInfo:
      type: object
      required:
        [
          device_id,
          user_id,
          status,
          key_generation,
          identity_signing_key,
          identity_dh_key,
          identity_binding_signature,
          identity_key_alg,
          fingerprint,
          is_self,
        ]
      properties:
        device_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        platform: { type: string, enum: [WEB] }
        status: { type: string, enum: [PENDING, ACTIVE, REVOKED] }
        identity_signing_key: { $ref: "#/components/schemas/Base64Url32" }
        identity_dh_key: { $ref: "#/components/schemas/Base64Url32" }
        identity_binding_signature: { $ref: "#/components/schemas/Base64Url64" }
        identity_key_alg: { type: string, enum: [Ed25519+X25519] }
        fingerprint: { $ref: "#/components/schemas/Base64Url32" }
        key_generation: { type: integer, minimum: 1 }
        signed_prekey_id: { type: [string, "null"] }
        is_self: { type: boolean }
        verified: { type: [boolean, "null"] }
        verified_at: { type: [string, "null"], format: date-time }
        verification_method:
          { type: [string, "null"], enum: [QR, MANUAL, null] }
        last_seen_at: { type: [string, "null"], format: date-time }

    ChatKeysResponse:
      type: object
      required:
        [chat_id, security_mode, my_device_id, verifier_device_id, devices]
      properties:
        chat_id: { type: string, format: uuid }
        security_mode: { type: string, enum: [E2EE], readOnly: true }
        key_epoch: { type: [integer, "null"], minimum: 0 }
        my_device_id: { type: string, format: uuid }
        verifier_device_id: { type: string, format: uuid }
        verified_count: { type: integer, minimum: 0 }
        verified_by_other_devices_count: { type: integer, minimum: 0 }
        devices_total: { type: integer, minimum: 0 }
        devices:
          type: array
          items: { $ref: "#/components/schemas/DeviceKeyInfo" }

    VerificationRequest:
      type: object
      additionalProperties: false
      required: [device_id, method, vh_version, safety_number_hash]
      properties:
        device_id: { type: string, format: uuid }
        method: { type: string, enum: [QR, MANUAL] }
        vh_version: { type: integer, enum: [2] }
        safety_number_hash: { $ref: "#/components/schemas/Base64Url32" }
        # Optional TOFU guard: the target key_generation the verifier saw. A mismatch is
        # 409 KEY_CHANGED and no row is written (E2EE-SPEC §6.2.7/§7.5).
        expected_key_generation: { type: integer, minimum: 1 }

    VerificationResponse:
      type: object
      required:
        [
          chat_id,
          verifier_device_id,
          device_id,
          key_generation,
          verified,
          verified_at,
          method,
        ]
      properties:
        chat_id: { type: string, format: uuid }
        verifier_device_id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        key_generation: { type: integer, minimum: 1 }
        verified: { type: boolean }
        verified_at: { type: string, format: date-time }
        method: { type: string, enum: [QR, MANUAL] }

    EnvelopeCoverage:
      type: object
      required:
        [
          devices,
          covered,
          peer_devices,
          peer_covered,
          self_devices,
          self_covered,
          uncovered_device_ids,
        ]
      properties:
        devices: { type: integer, minimum: 0 }
        covered: { type: integer, minimum: 0 }
        peer_devices:
          type: integer
          minimum: 0
          description: >
            ACTIVE e2ee_capable devices of the peer at the time the coverage is
            computed. A new E2EE send always has at least 1 (otherwise
            E2EE_NO_ACTIVE_DEVICES); an idempotent replay of an already stored
            message may honestly report 0 after the peer revoked its device
            (E2EE-REVIEW-06 P2-01). Never clamp this value to 1.
        peer_covered: { type: integer, minimum: 0 }
        self_devices: { type: integer, minimum: 0 }
        self_covered: { type: integer, minimum: 0 }
        warning:
          type: [string, "null"]
          enum: [SELF_DEVICE_UNCOVERED, PEER_DEVICE_UNCOVERED, null]
        uncovered_device_ids:
          type: array
          items: { type: string, format: uuid }

    MessageCreateResult:
      allOf:
        - $ref: "#/components/schemas/Message"
        - type: object
          properties:
            envelope_coverage: { $ref: "#/components/schemas/EnvelopeCoverage" }

    ChatCreateRequest:
      type: object
      additionalProperties: false
      required: [type]
      description: >
        `POST /workspaces/{workspaceId}/chats` (additive channel visibility).
        GROUP channels are PUBLIC by default: every ACTIVE workspace member joins
        immediately and every future member joins automatically. PRIVATE GROUP channels
        require `member_ids` (1..100); the creator is added as OWNER and the selected ACTIVE
        workspace members as MEMBER. `member_ids` is rejected for DIRECT and for PUBLIC.
        DIRECT chats always have no visibility. Any ACTIVE workspace member may create a
        GROUP channel, subject to the installation chat limits.
      properties:
        type: { type: string, enum: [DIRECT, GROUP] }
        peer_id: { type: [string, "null"], format: uuid }
        name: { type: [string, "null"], maxLength: 120 }
        visibility:
          type: [string, "null"]
          enum: [PUBLIC, PRIVATE, null]
          description: >
            GROUP only; optional, defaults to `PUBLIC` when absent or null. `PUBLIC` adds all
            ACTIVE workspace members and future joins; `PRIVATE` requires `member_ids`.
            Must be absent or null for DIRECT.
        member_ids:
          type: [array, "null"]
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
          description: >
            PRIVATE GROUP only: 1..100 distinct ACTIVE workspace member ids. The creator may
            not be listed and is added automatically. Must be absent, null or empty for
            PUBLIC and DIRECT. No private-channel invite links exist yet.

    ChatCoverRequest:
      type: object
      required: [file_id]
      additionalProperties: false
      description: >
        `POST /chats/{chatId}/cover`. There is no new upload endpoint: the id refers to an
        existing managed attachment of the same chat.
      properties:
        file_id: { type: string, format: uuid }

    ChatAvatarRequest:
      type: object
      required: [file_id]
      additionalProperties: false
      description: >
        `POST /chats/{chatId}/avatar`. There is no new upload endpoint: the id refers to an
        existing CLEAN/SKIPPED image attachment of the same chat (the cover rules).
      properties:
        file_id: { type: string, format: uuid }

    ChatRolePermissions:
      type: object
      additionalProperties: false
      description: Effective rights of one channel role (P0-2). Always complete.
      properties:
        post_messages: { type: boolean }
        invite_members: { type: boolean }
        create_polls: { type: boolean }
        start_calls: { type: boolean }
        pin_messages: { type: boolean }
        change_info: { type: boolean }

    ChatPermissions:
      type: object
      additionalProperties: false
      description: >
        Effective channel rights matrix by role (P0-2). `owner` is always all-true and
        cannot be changed; the other roles are configurable per chat.
      properties:
        owner: { $ref: '#/components/schemas/ChatRolePermissions' }
        admin: { $ref: '#/components/schemas/ChatRolePermissions' }
        moderator: { $ref: '#/components/schemas/ChatRolePermissions' }
        member: { $ref: '#/components/schemas/ChatRolePermissions' }
        guest: { $ref: '#/components/schemas/ChatRolePermissions' }

    ChatRolePermissionsUpdate:
      type: object
      additionalProperties: false
      description: >
        Partial rights of one role. An absent permission is left unchanged; `null` is
        treated as "not provided".
      properties:
        post_messages: { type: [boolean, "null"] }
        invite_members: { type: [boolean, "null"] }
        create_polls: { type: [boolean, "null"] }
        start_calls: { type: [boolean, "null"] }
        pin_messages: { type: [boolean, "null"] }
        change_info: { type: [boolean, "null"] }

    ChatPermissionsUpdate:
      type: object
      additionalProperties: false
      description: >
        `PATCH /chats/{chatId}/permissions` and the `rights` field of
        `PATCH /chats/{chatId}`. An explicit `owner` row is rejected with `422
        VALIDATION_FAILED` (`owner_permissions_fixed`): OWNER always has every right. An
        empty body or a role with no permission values is also `422 VALIDATION_FAILED`.
      properties:
        owner:
          oneOf:
            - $ref: '#/components/schemas/ChatRolePermissionsUpdate'
            - type: "null"
          description: >
            Documented only to be rejected: OWNER rights are fixed and this row returns
            `422 VALIDATION_FAILED` with `details.reason=owner_permissions_fixed`.
        admin: { $ref: '#/components/schemas/ChatRolePermissionsUpdate' }
        moderator: { $ref: '#/components/schemas/ChatRolePermissionsUpdate' }
        member: { $ref: '#/components/schemas/ChatRolePermissionsUpdate' }
        guest: { $ref: '#/components/schemas/ChatRolePermissionsUpdate' }

    ChatPinRequest:
      type: object
      required: [message_id]
      additionalProperties: false
      properties:
        message_id: { type: string, format: uuid }

    ChatPin:
      type: object
      required: [chat_id, message_id, pinned_by, pinned_at]
      additionalProperties: false
      description: Pinned-message metadata only; never contains message content.
      properties:
        chat_id: { type: string, format: uuid }
        message_id: { type: string, format: uuid }
        pinned_by: { type: string, format: uuid }
        pinned_at: { type: string, format: date-time }

    ChatPinList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChatPin'

    ChatUpdateRequest:
      type: object
      additionalProperties: false
      description: >
        `PATCH /chats/{chatId}` (D1-BE3 + P0-2). Every field is optional, but at least one
        must be present and non-null. `name` is trimmed and internal whitespace is
        collapsed; it must be 1..120 characters. `description` is trimmed, must be at most
        500 characters, and `""` clears it to `null`. Names/descriptions are plain text:
        `<`, `>` and control characters (except `\n`/`\t` in description) are rejected.
        `name`/`description` require an ACTIVE workspace OWNER/ADMIN (D1-BE3) or a GROUP
        participant whose role has `change_info`. `cover_file_id`, `read_only`,
        `visibility`, `join_policy` and `rights` are structural channel settings: ACTIVE
        chat OWNER/ADMIN only and GROUP only (DIRECT —
        `422 CHAT_MEMBERSHIP_UNSUPPORTED`). `visibility=PUBLIC` requires/forces
        `join_policy=OPEN`, otherwise `422 VALIDATION_FAILED`. In an E2EE chat
        `description` and a cover are rejected with
        `422 CHAT_SETTINGS_E2EE_UNSUPPORTED`; name, read-only, visibility, join policy and
        the rights matrix are policy metadata and stay allowed. `security_mode` is
        immutable and is never accepted in the body. A successful request writes
        `chat.updated` with changed field names only (no values, no rights values).
      properties:
        name:
          type: [string, "null"]
          minLength: 1
          maxLength: 120
          description: New chat name; optional. Null is treated as "not provided".
        description:
          type: [string, "null"]
          maxLength: 500
          description: >
            New description; optional. Null is treated as "not provided"; an empty string
            after trim clears the description.
        cover_file_id:
          type: [string, "null"]
          format: uuid
          description: >
            P0-2 GROUP cover: an existing CLEAN image attachment of this chat. Same
            validation as `POST /chats/{chatId}/cover`; a cover cannot be cleared through
            this field (use `DELETE /cover`).
        read_only:
          type: [boolean, "null"]
          description: >
            P0-2 read-only channel: `post_messages`/`create_polls` are denied to every
            role except chat OWNER/ADMIN (`403 CHAT_READ_ONLY`). GROUP only.
        visibility:
          type: [string, "null"]
          enum: [PUBLIC, PRIVATE, null]
          description: >
            GROUP visibility. Switching to PUBLIC adds every ACTIVE workspace member and
            requires/forces `join_policy=OPEN`; switching to PRIVATE keeps current members.
        join_policy:
          type: [string, "null"]
          enum: [OPEN, INVITE_ONLY, CLOSED, null]
          description: >
            GROUP join policy. `OPEN` — workspace-wide auto-join (only with PUBLIC);
            `INVITE_ONLY` — invite link or OWNER/ADMIN add; `CLOSED` — OWNER/ADMIN add
            only, an invite accept answers `403 CHAT_JOIN_CLOSED`.
        rights:
          oneOf:
            - $ref: '#/components/schemas/ChatPermissionsUpdate'
            - type: "null"
          description: >
            Same partial per-role rights patch as `PATCH /chats/{chatId}/permissions`;
            OWNER is rejected. Rights are applied atomically with the other fields and
            audited as `chat.updated` + permission names.

    Chat:
      type: object
      required: [id, type, security_mode, last_seq, unread_count, created_at]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [DIRECT, GROUP] }
        security_mode: { type: string, enum: [MANAGED, E2EE], readOnly: true }
        visibility:
          type: [string, "null"]
          enum: [PUBLIC, PRIVATE, null]
          description: >
            GROUP channel visibility (additive). `PUBLIC` — every ACTIVE workspace member and
            every future member; `PRIVATE` — only the creator and the selected members.
            `null` for DIRECT chats. Membership visibility is unchanged: a chat appears in a
            user's list only through an ACTIVE chat_members row.
        peer_id: { type: [string, "null"], format: uuid }
        peer_has_e2ee_capable_devices: { type: boolean }
        name: { type: [string, "null"] }
        description:
          type: [string, "null"]
          maxLength: 500
          description: Plain-text description (D1-BE3); null when empty or not a managed setting.
        key_epoch: { type: [integer, "null"], minimum: 0 }
        last_seq: { type: integer, format: int64, minimum: 0 }
        unread_count: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        cover_file_id:
          type: [string, "null"]
          format: uuid
          description: P0-2 GROUP cover attachment id; null for DIRECT and when unset.
        avatar_file_id:
          type: [string, "null"]
          format: uuid
          description: >
            GROUP channel icon/avatar attachment id (same validation as the cover);
            null for DIRECT and when unset. Read-only here: set/clear through
            `POST`/`DELETE /chats/{chatId}/avatar`.
        read_only:
          type: boolean
          description: P0-2 read-only flag (GROUP; false for DIRECT).
        join_policy:
          type: [string, "null"]
          enum: [OPEN, INVITE_ONLY, CLOSED, null]
          description: P0-2 GROUP join policy; null for DIRECT.
        archived:
          type: boolean
          description: >
            P0-2 caller-local archive state (never another participant's). The legacy
            D1-BE3 `created_at` and all previous fields are unchanged.
        member_count:
          type: integer
          minimum: 0
          description: >
            #99 exact ACTIVE chat member count (GROUP: ACTIVE chat participants with an
            ACTIVE workspace membership; DIRECT: 2 while both participants remain in the
            workspace). Never the workspace member count. Additive field.

    ReadRequest:
      type: object
      required: [last_seq]
      properties:
        last_seq: { type: integer, format: int64, minimum: 0 }

    SyncResponse:
      type: object
      required: [server_time, chats]
      properties:
        server_time: { type: string, format: date-time }
        chats:
          type: array
          items:
            type: object
            required: [chat_id, last_seq, unread_count]
            properties:
              chat_id: { type: string, format: uuid }
              last_seq: { type: integer, format: int64, minimum: 0 }
              unread_count: { type: integer, minimum: 0 }

    AvatarUpdate:
      type: object
      required: [file_id]
      properties:
        file_id:
          type: string
          format: uuid
          description: Существующее CLEAN-изображение, загруженное вызывающим.

    ProfileAvatar:
      type: object
      required: [url, expires_at]
      properties:
        url: { type: string, format: uri }
        expires_at: { type: string, format: date-time }

    TwoFactorSetupRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 1, maxLength: 128 }

    TwoFactorSetup:
      type: object
      required: [secret, otpauth_uri, qr_payload]
      description: >
        Секрет и URI показываются один раз при setup. `qr_payload` — тот же otpauth URI,
        который клиент кодирует в QR. Ни одно из значений не логируется и не возвращается
        повторно.
      properties:
        secret: { type: string, description: Base64url TOTP secret (показывается один раз) }
        otpauth_uri: { type: string, description: "otpauth://totp/..." }
        qr_payload: { type: string, description: Данные для QR (тот же otpauth URI) }

    TwoFactorVerifyRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }

    TwoFactorDisableRequest:
      type: object
      required: [password, code]
      properties:
        password: { type: string, minLength: 1, maxLength: 128 }
        code:
          type: string
          minLength: 1
          maxLength: 20
          description: TOTP (6 цифр) или одноразовый recovery-код.

    TwoFactorRecoveryCodesRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 1, maxLength: 128 }

    TwoFactorStatus:
      type: object
      required: [enabled, recovery_codes_remaining]
      properties:
        enabled: { type: boolean }
        enabled_at: { type: [string, "null"], format: date-time }
        recovery_codes_remaining: { type: integer, minimum: 0 }

    TwoFactorRecoveryCodes:
      type: object
      required: [codes, remaining]
      properties:
        codes:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string, pattern: '^[A-Z2-7]{4}-[A-Z2-7]{4}-[A-Z2-7]{4}$' }
        remaining: { type: integer, minimum: 0 }

    AuthTwoFactorChallenge:
      type: object
      required: [challenge_id, expires_in, methods, mode]
      description: >
        Одноразовый login challenge. `mode=TOTP` завершается через
        `POST /auth/2fa/verify` (TOTP или recovery-код), `mode=ENROLL` — через
        `POST /auth/2fa/enroll/start` + `POST /auth/2fa/enroll/verify`. В ответе нет
        access/refresh токенов.
      properties:
        challenge_id: { type: string, format: uuid }
        expires_in: { type: integer, minimum: 1 }
        mode:
          type: string
          enum: [TOTP, ENROLL]
          description: TOTP — аутентификатор уже включён; ENROLL — его нужно создать.
        methods:
          type: array
          items: { type: string, enum: [TOTP, RECOVERY_CODE] }

    AuthTwoFactorEnrollStartRequest:
      type: object
      required: [challenge_id]
      properties:
        challenge_id: { type: string, format: uuid }

    AuthTwoFactorEnrollVerifyRequest:
      type: object
      required: [challenge_id, code]
      properties:
        challenge_id: { type: string, format: uuid }
        code: { type: string, pattern: '^[0-9]{6}$' }

    AuthTwoFactorVerifyRequest:
      type: object
      required: [challenge_id, code]
      properties:
        challenge_id: { type: string, format: uuid }
        code:
          type: string
          minLength: 1
          maxLength: 20
          description: TOTP (6 цифр) или одноразовый recovery-код.

    WorkspaceUpdate:
      type: object
      description: >
        Все поля опциональны. Отсутствие — «не менять»; `description: null`/пустая строка и
        `logo_file_id: null` очищают поле. Пустой объект — `400 VALIDATION_FAILED`.
        `security_mode` здесь не принимается.
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, "null"], maxLength: 500 }
        logo_file_id: { type: [string, "null"], format: uuid }

    WorkspaceAvatarRequest:
      type: object
      required: [file_id]
      properties:
        file_id: { type: string, format: uuid }

    WorkspaceInviteCreateRequest:
      type: object
      properties:
        role: { type: string, enum: [ADMIN, MEMBER, GUEST], default: MEMBER }
        max_uses: { type: [integer, "null"], minimum: 1, maximum: 1000 }
        expires_in_seconds:
          type: integer
          minimum: 300
          maximum: 2592000
          default: 604800
        # #100: non-null marks a single-use email-bound invite; max_uses must be 1.
        email: { type: [string, "null"], format: email, maxLength: 254 }

    WorkspaceInvite:
      type: object
      required: [id, role, status, used_count, expires_at, created_at, created_by]
      description: Метаданные ссылки; токен и hash отсутствуют.
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [ADMIN, MEMBER, GUEST] }
        status: { type: string, enum: [ACTIVE, EXPIRED, EXHAUSTED, REVOKED] }
        used_count: { type: integer, minimum: 0 }
        max_uses: { type: [integer, "null"], minimum: 1, maximum: 1000 }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid }
        # #100: normalized recipient for a single-use email invite; null for a link invite.
        email: { type: [string, "null"], format: email, maxLength: 254 }

    WorkspaceInvitePreview:
      type: object
      required: [workspace_name, workspace_slug, role, email_bound, expires_at]
      description: >
        #100 анонимный предпросмотр: только отображаемые данные. Токен, hash и адрес
        приглашённого не возвращаются.
      properties:
        workspace_name: { type: string }
        workspace_slug: { type: string }
        role: { type: string, enum: [ADMIN, MEMBER, GUEST] }
        email_bound: { type: boolean }
        expires_at: { type: string, format: date-time }

    WorkspaceInviteCreated:
      type: object
      required: [invite, token, accept_url]
      properties:
        invite: { $ref: "#/components/schemas/WorkspaceInvite" }
        token: { type: string, description: Одноразовый показ; в БД только hash }
        accept_url: { type: string, description: Относительный accept URL }

    WorkspaceInviteList:
      type: object
      required: [invites]
      properties:
        invites:
          type: array
          items: { $ref: "#/components/schemas/WorkspaceInvite" }

    WorkspaceInviteAcceptance:
      type: object
      required: [workspace_id, name, slug, role, already_member]
      properties:
        workspace_id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        role: { type: string, enum: [OWNER, ADMIN, MEMBER, GUEST] }
        already_member: { type: boolean }

    WorkspacePermissionEntry:
      type: object
      required: [role, permission, allowed]
      properties:
        role: { type: string, enum: [OWNER, ADMIN, MEMBER] }
        permission:
          type: string
          enum:
            [
              manage_workspace,
              manage_members,
              manage_invites,
              manage_permissions,
              view_audit,
              manage_security,
            ]
        allowed: { type: boolean }

    WorkspacePermissionUpdate:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          minItems: 1
          maxItems: 18
          items: { $ref: "#/components/schemas/WorkspacePermissionEntry" }

    WorkspaceRolePermissions:
      type: object
      required:
        [
          role,
          manage_workspace,
          manage_members,
          manage_invites,
          manage_permissions,
          view_audit,
          manage_security,
        ]
      properties:
        role: { type: string, enum: [OWNER, ADMIN, MEMBER] }
        manage_workspace: { type: boolean }
        manage_members: { type: boolean }
        manage_invites: { type: boolean }
        manage_permissions: { type: boolean }
        view_audit: { type: boolean }
        manage_security: { type: boolean }

    WorkspacePermissionMatrix:
      type: object
      required: [workspace_id, roles]
      properties:
        workspace_id: { type: string, format: uuid }
        roles:
          type: array
          items: { $ref: "#/components/schemas/WorkspaceRolePermissions" }

    # ---------------------------------------------------------------------
    # #96 bots
    # ---------------------------------------------------------------------
    Bot:
      type: object
      description: >
        Метаданные бота. Никогда не содержит bearer-токен или его hash; токен возвращается
        только один раз в `BotToken` при создании/ротации.
      required: [id, workspace_id, name, scopes, status, created_by, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 80 }
        avatar_file_id:
          type: [string, "null"]
          format: uuid
          description: >
            Готовое CLEAN-изображение того же воркспейса либо null. Отдельного upload/serve
            API у ботов в MVP нет.
        scopes:
          type: array
          minItems: 1
          description: >
            MVP: только `chat.write`; чтение сообщений/звонки/файлы недоступны.
          items: { type: string, enum: [chat.write] }
        status:
          type: string
          enum: [ACTIVE, DISABLED]
          description: >
            `DISABLED` — мягкое удаление; токен сразу перестаёт аутентифицироваться.
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        token_rotated_at: { type: [string, "null"], format: date-time }
        events_url:
          type: [string, "null"]
          format: uri
          maxLength: 2048
          description: >
            #98 https-only event endpoint. Пользовательские данные/query/fragment
            запрещены; при каждой доставке хост резолвится заново и приватные/loopback/
            link-local адреса отклоняются (SSRF). Пустая строка в PATCH очищает URL и
            выключает доставку.
        events:
          type: array
          maxItems: 2
          description: Явная подписка; только `message.created` и/или `app_mention`.
          items:
            type: string
            enum: [message.created, app_mention]
        events_enabled:
          type: boolean
          description: >
            Эффективный переключатель webhook-доставки. `false`/отсутствие URL — webhook не
            отправляется; пустой `events` допустим для slash-command-only бота. В PATCH поле
            называется `events_enabled` (алиас `enabled`).
        has_signing_secret:
          type: boolean
          description: >
            Секрет уже сгенерирован (сам секрет и его ciphertext никогда не читаются
            повторно). Ротация — `POST .../secret`.
        signing_secret_created_at:
          type: [string, "null"]
          format: date-time
        commands:
          type: array
          maxItems: 50
          description: >
            #98 зарегистрированные slash-команды. Имя lowercase 1..32, уникально внутри
            бота; вызов — `POST /chats/{chatId}/commands`.
          items:
            $ref: "#/components/schemas/BotCommand"
        signing_secret:
          type: [string, "null"]
          description: >
            Одноразовый показ signing secret. Присутствует ТОЛЬКО в ответе PATCH, который
            сгенерировал секрет, либо в `POST .../secret`. В списках/чтении поля нет.
          writeOnly: false

    BotCreateRequest:
      type: object
      required: [name, scopes]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        scopes:
          type: array
          minItems: 1
          maxItems: 1
          items: { type: string, enum: [chat.write] }

    BotUpdateRequest:
      type: object
      description: >
        Все поля опциональны: отсутствие — «не менять». `avatar_file_id` и
        `clear_avatar=true` взаимоисключающие (`400`). Пустой объект — допустимый no-op.
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        scopes:
          type: array
          minItems: 1
          maxItems: 1
          items: { type: string, enum: [chat.write] }
        avatar_file_id: { type: [string, "null"], format: uuid }
        clear_avatar: { type: boolean, default: false }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        events_url:
          type: [string, "null"]
          format: uri
          maxLength: 2048
          description: >
            #98 https URL события. `null`/отсутствие — не менять; пустая строка — очистить
            и выключить доставку. При первой активации подписки сервер генерирует signing
            secret и возвращает его один раз в `Bot.signing_secret`.
        events:
          type: array
          maxItems: 2
          description: >
            `null` — не менять; `[]` — отписаться от всех. Допустимы только
            `message.created` и `app_mention`.
          items:
            type: string
            enum: [message.created, app_mention]
        events_enabled:
          type: boolean
          description: >
            Включить/выключить webhook-доставку без удаления URL/подписок. Эффективно при
            заданном `events_url`; пустой `events` допустим для slash-command-only бота —
            события сообщений просто не отправляются.
        enabled:
          type: boolean
          description: >
            Алиас `events_enabled` (#98). Если заданы оба, приоритет у `events_enabled`.
            Не меняет `status` бота.
        commands:
          type: array
          maxItems: 50
          description: >
            Полная замена списка slash-команд. `null` — не менять. Имена lowercase 1..32,
            уникальны; описание 1..256.
          items:
            $ref: "#/components/schemas/BotCommand"

    BotToken:
      type: object
      description: >
        Единственный ответ с токеном. `token` показывается один раз и не сохраняется в
        открытом виде; сервер хранит только его SHA-256 hash.
      required: [bot, token]
      properties:
        bot: { $ref: "#/components/schemas/Bot" }
        token:
          type: string
          minLength: 90
          maxLength: 160
          description: >
            `sova_bot_<workspace_id>_<bot_id>_<32 random bytes base64url>`. Не логируется и
            не возвращается повторно.
          format: password

    BotList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Bot" }

    ChatBotInstallRequest:
      type: object
      required: [bot_id]
      properties:
        bot_id: { type: string, format: uuid }

    ChatBot:
      type: object
      required: [chat_id, bot, enabled, installed_at]
      properties:
        chat_id: { type: string, format: uuid }
        bot: { $ref: "#/components/schemas/Bot" }
        enabled:
          type: boolean
          description: Эффективный флаг; отправка разрешена только при `true`.
        installed_at: { type: string, format: date-time }

    ChatBotList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ChatBot" }

    BotMessageCreate:
      type: object
      required: [chat_id, text]
      properties:
        chat_id: { type: string, format: uuid }
        text: { type: string, minLength: 1, maxLength: 8000 }

    # ---------------------------------------------------------------------
    # #98 bot events and slash commands
    # ---------------------------------------------------------------------
    BotCommand:
      type: object
      description: >
        Зарегистрированная slash-команда. Хранится без ведущего `/`; имя lowercase 1..32 и
        уникально внутри одного бота.
      required: [command, description]
      properties:
        command:
          type: string
          minLength: 1
          maxLength: 32
          pattern: "^[a-z0-9][a-z0-9_-]{0,31}$"
        description: { type: string, minLength: 1, maxLength: 256 }

    BotSigningSecret:
      type: object
      description: >
        Одноразовый ответ ротации. `signing_secret` — HMAC-SHA256 ключ; в БД хранится только
        его AES-256-GCM ciphertext, повторно получить значение нельзя.
      required: [bot, signing_secret]
      properties:
        bot: { $ref: "#/components/schemas/Bot" }
        signing_secret:
          type: string
          minLength: 40
          maxLength: 80
          format: password
          description: "`sova_whsec_<32 random bytes base64url>`; показывается один раз."

    BotDelivery:
      type: object
      description: >
        Content-free статус доставки. Payload/URL/секрет не возвращаются; `last_error` —
        безопасная причина (`timeout`, `http_500`, `private_address`, ...).
      required: [id, event_type, event_id, status, attempt_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        event_type:
          type: string
          enum: [message.created, app_mention, slash_command, test]
        event_id: { type: string, format: uuid }
        chat_id: { type: [string, "null"], format: uuid }
        status: { type: string, enum: [PENDING, DELIVERED, FAILED] }
        attempt_count: { type: integer, minimum: 0 }
        next_attempt_at: { type: string, format: date-time }
        last_status_code: { type: [integer, "null"], minimum: 0, maximum: 599 }
        last_error: { type: [string, "null"], maxLength: 120 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        delivered_at: { type: [string, "null"], format: date-time }

    BotDeliveryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/BotDelivery" }

    BotDeliveryAccepted:
      type: object
      required: [delivery_id]
      properties:
        delivery_id: { type: string, format: uuid }

    BotCommandInvoke:
      type: object
      required: [command]
      properties:
        command:
          type: string
          description: Имя без ведущего `/`; сравнивается lowercase.
          minLength: 1
          maxLength: 32
          pattern: "^/?[a-zA-Z0-9][a-zA-Z0-9_-]{0,31}$"
        args:
          type: string
          maxLength: 2000
          default: ""
          description: Свободный текст после команды; передаётся как есть (trim).

    BotCommandAccepted:
      type: object
      required: [delivery_id]
      properties:
        delivery_id: { type: string, format: uuid }
        bot_id: { type: string, format: uuid }

    BotResponseCreate:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 8000 }

  responses:
    BadRequest:
      description: Неверный запрос
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Нет/просрочен токен
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Нет прав
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Объект не найден или недоступен
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Конфликт состояния или идемпотентности
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unprocessable:
      description: Семантическая ошибка
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Gone:
      description: Объект истёк или удалён
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooLarge:
      description: Превышен лимит размера
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnsupportedMediaType:
      description: Формат не поддерживается
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Rate limit
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServiceUnavailable:
      description: >
        Внешняя зависимость BFF недоступна (Keycloak/SMTP) — `AUTH_UNAVAILABLE`.
        Повтор допустим после `Retry-After`.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TranslationUnavailable:
      description: >
        Перевод недоступен: `krug.plugins.translate.url` не настроен (по умолчанию
        внешних вызовов нет), провайдер вернул ошибку/таймаут или невалидный ответ.
        Код — `TRANSLATION_UNAVAILABLE`; `Retry-After` задаёт безопасную паузу.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
