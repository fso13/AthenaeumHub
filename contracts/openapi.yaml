        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: Состояние upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"

  /uploads/{uploadId}/parts/{partNo}:
    put:
      tags: [files]
      operationId: putUploadPart
      summary: Идемпотентная загрузка одной части
      parameters:
        - $ref: "#/components/parameters/UploadId"
        - $ref: "#/components/parameters/PartNo"
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/ContentSha256"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Часть принята
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadPart"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /uploads/{uploadId}/complete:
    post:
      tags: [files]
      operationId: completeUpload
      summary: Завершить загрузку, проверить хеш и запустить скан
      parameters:
        - $ref: "#/components/parameters/UploadId"
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadCompleteRequest"
      responses:
        "200":
          description: Объект готов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSession"
        "202":
          description: Объект на сканировании
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /uploads/{uploadId}/abort:
    post:
      tags: [files]
      operationId: abortUpload
      summary: Отменить upload и освободить резерв квоты
      parameters:
        - $ref: "#/components/parameters/UploadId"
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Upload отменён
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"

  /media/images:
    post:
      tags: [files]
      operationId: uploadImage
      summary: Прямая загрузка изображения для аватара/обложки/логотипа
      description: >
        `multipart/form-data`: обязательная часть `file` и необязательный `chat_id`.
        Принимаются только статические PNG/JPEG/WebP не больше 5 MiB. Формат
        определяется по magic bytes, а не по `Content-Type`; расширение имени файла
        должно совпадать с содержимым. SVG/GIF и анимированные PNG/WebP отклоняются.
        Исходные метаданные (например, EXIF) не вырезаются и не возвращаются: ответ
        содержит только `file_id`, `width`, `height`, `mime`, `size`. Объект хранится
        в приватном бакете; создаётся attachment вызывающего со статусом `READY` и
        `scan_status=SKIPPED` (доверенный image-пайплайн, `source=DIRECT_IMAGE`),
        поэтому он сразу проходит проверки `POST /me/avatar`,
        `POST /chats/{chatId}/cover`, `POST /chats/{chatId}/avatar` и
        `POST /workspaces/{workspaceId}/avatar`. Без `chat_id` изображение
        привязывается к текущему (первому активному) воркспейсу вызывающего и
        доступно для его аватара/логотипа; с `chat_id` требуется активное участие в
        чате, и изображение можно использовать как обложку/аватар этого чата.
        E2EE-чат — `422 E2EE_PLAINTEXT_FORBIDDEN`. Превышение размера — `413
        FILE_TOO_LARGE`, неподдерживаемый формат — `415 UNSUPPORTED_TYPE`,
        повреждённое изображение или несовпадение расширения — `422 IMAGE_INVALID`.
        Имя файла с путём/`..` отклоняется (`400`).
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                chat_id:
                  type: string
                  format: uuid
                  description: >
                    Необязательная привязка к чату. Требуется активное участие
                    вызывающего в этом чате.
      responses:
        "201":
          description: Изображение сохранено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadedImage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /attachments/{attachmentId}/download-url:
    get:
      tags: [files]
      operationId: attachmentDownloadUrl
      summary: Presigned URL на скачивание (TTL 5 минут)
      parameters:
        - $ref: "#/components/parameters/AttachmentId"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: URL для скачивания
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadUrl"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "423":
          description: Объект в карантине
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /attachments/{attachmentId}/artwork:
    get:
      tags: [files]
      operationId: attachmentArtwork
      summary: Обложка аудио, извлечённая сервером (#97)
      description: >
        Приватные байты обложки, извлечённой сервером из ID3v2.2/2.3/2.4 `APIC`/`PIC` или
        MP4 `covr`. Ответ — только растровое изображение (`image/jpeg`, `image/png`,
        `image/webp`, `image/gif`, `image/bmp`, `image/avif`), тип определяется по magic
        bytes, а не по клиентскому заголовку; `X-Content-Type-Options: nosniff`. Видимость
        совпадает со скачиванием вложения: ACTIVE-участник чата для привязанного файла,
        участник воркспейса для workspace-ассета, владелец — для ещё не привязанного
        глобального файла. AV fail-closed: пока объект SCANNING — `409`, карантин — `423`.
        Никакого redirect, presigned URL или внешнего запроса сервер не делает; object key
        строится только из серверных UUID. `404`, если у вложения нет извлечённой обложки.
      parameters:
        - $ref: "#/components/parameters/AttachmentId"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: Байты обложки
          headers:
            Cache-Control:
              schema: { type: string }
            X-Content-Type-Options:
              schema: { type: string, enum: [nosniff] }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
            image/gif:
              schema: { type: string, format: binary }
            image/bmp:
              schema: { type: string, format: binary }
            image/avif:
              schema: { type: string, format: binary }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "423":
          description: Объект в карантине
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /files:
    get:
      tags: [files]
      operationId: listFiles
      summary: File-center — список файлов воркспейса
      description: >
        Независимый от загруженной истории список вложений (file-center, #73). Возвращает
        только метаданные: без содержимого, object key, sha256 и presigned URL; скачивание
        остаётся за `GET /attachments/{attachmentId}/download-url`. Вызывающий должен быть
        ACTIVE-участником воркспейса, а для каждого элемента — ACTIVE-участником его чата.
        Файлы E2EE-чатов и сообщений с E2EE-схемой никогда не возвращаются. Удалённые
        (delete-for-all), скрытые для вызывающего (delete-for-me) и ещё не привязанные к
        сообщению вложения не возвращаются. `workspace_id` необязателен, если токен несёт
        workspace claim (dev) или задан `chat_id`; иначе — `400 VALIDATION_FAILED`.
        `query` — literal-подстрока без учёта регистра по имени файла и MIME; `%` и `_`
        не являются wildcard. `mime` — точное совпадение без учёта регистра, `extension` —
        расширение без точки. Сортировка стабильная: `created_at DESC, id DESC`; `cursor`
        непрозрачен, привязан к воркспейсу и к этому эндпоинту.
      parameters:
        - name: workspace_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: chat_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: kind
          in: query
          required: false
          schema: { type: string, enum: [IMAGE, VIDEO, AUDIO, FILE] }
        - name: scan_status
          in: query
          required: false
          schema:
            { type: string, enum: [PENDING, CLEAN, INFECTED, FAILED, SKIPPED] }
        - name: query
          in: query
          required: false
          schema: { type: string, maxLength: 200 }
        - name: mime
          in: query
          required: false
          schema: { type: string, maxLength: 128 }
        - name: extension
          in: query
          required: false
          schema: { type: string, maxLength: 10, pattern: "^[A-Za-z0-9]{1,10}$" }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: Страница файлов и сводка квоты воркспейса
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /files/{fileId}:
    patch:
      tags: [files]
      operationId: renameFile
      summary: Переименовать глобальный файл (владелец)
      description: >
        #83: меняет только отображаемое имя вложения (`PATCH /files/{fileId}`); object key,
        sha256, scan_status и привязка к чату/сообщению не меняются. Доступно только
        загрузившему файл. Имя валидируется как безопасное display-имя (1..255, без
        `/`, `\`, control/bidi символов) → 400 `VALIDATION_FAILED`. Привязанный к сообщению
        файл переименовать можно (имя — presentation-слой).
      parameters:
        - name: fileId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FileRename" }
      responses:
        "200":
          description: Файл переименован
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileItem" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      tags: [files]
      operationId: deleteFile
      summary: Мягко удалить глобальный файл (владелец или админ воркспейса)
      description: >
        #83: soft delete (`status=DELETED`), объект удаляется из приватного бакета, а
        зарезервированная квота освобождается. Разрешено владельцу файла или OWNER/ADMIN
        воркспейса. Файл, привязанный к сообщению, отдельно не удаляется (409 `CONFLICT`):
        его жизненным циклом владеет сообщение. Trusted direct-image (аватар/обложка/лого)
        удаляется своим endpoint'ом (422 `IMAGE_INVALID`). Повторный DELETE идемпотентен.
      parameters:
        - name: fileId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Удалено (или уже удалено)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /workspaces/{workspaceId}/files:
    post:
      tags: [files]
      operationId: uploadWorkspaceFile
      summary: Глобальный файл воркспейса (multipart, managed-пайплайн)
      description: >
        #83: загрузка файла любого разрешённого типа из устройства. Используется тот же
        managed-пайплайн, что и для чата: active workspace membership, tariff/guest лимит
        размера, установленный `FileTypePolicy` (dangerous block + allowlist расширений и
        MIME), атомарный reserve квоты и AV-скан. Файл создаётся без чата
        (`source=WORKSPACE`, `scan_status=PENDING`); после чистого вердикта — `CLEAN` и
        доступен для скачивания, при INFECTED/FAILED — `QUARANTINED` (объект и квота
        освобождаются). Обходного «доверенного» пути нет: SKIPPED для этого endpoint'а
        невозможен. Файл виден владельцу в `GET /files`; привязать его к сообщению можно
        через `attachment_ids` при отправке. Object key строится только из серверных UUID,
        имя файла — валидируемое display-имя; содержимое/ключ/hash/URL не возвращаются.
        Транспортный лимит multipart — 512 MiB; большие файлы — через resumable `/uploads`.
        #101: имя/расширение/MIME/размер проверяются DLP-правилами (`scope=ATTACHMENT`
        или `ALL`); BLOCK → `422 DLP_BLOCKED` до записи объекта, событие без имени файла.
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Файл сохранён и поставлен в AV-скан
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileItem" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /workspaces/{workspaceId}/search/messages:
    get:
      tags: [messages]
      operationId: searchMessages
      summary: Серверный поиск managed-сообщений воркспейса
      description: >
        #83: literal-поиск без учёта регистра по plaintext managed-сообщений. Вызывающий
        должен быть ACTIVE-участником воркспейса; для каждого результата SQL дополнительно
        требует ACTIVE-участие в чате, поэтому поиск никогда не раскрывает содержимое
        чужого/приватного чата. Исключены: E2EE-чаты и сообщения (`crypto_scheme=E2EE_*`),
        удалённые чаты/сообщения (delete-for-all) и сообщения, скрытые вызывающим
        (delete-for-me). `q` — обычная подстрока (без regex/wildcard), 1..200 символов.
        Тело сообщения хранится в AES-GCM, поэтому сервер сканирует ограниченное окно
        кандидатов и фильтрует совпадения в памяти; `cursor` (непрозрачный, привязан к
        воркспейсу, `chat_id` и запросу) двигается по последнему просканированному
        кандидату, так что пустая страница не зацикливает пагинацию. `snippet` — plain
        text с диапазонами `highlights`; HTML не возвращается.
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: chat_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: Страница результатов поиска
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageSearchPage" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /me/mentions:
    get:
      tags: [mentions]
      operationId: listMentions
      summary: Mention-инбокс вызывающего
      description: >
        #83: упоминания пользователя в текущем воркспейсе (workspace claim, иначе первый
        ACTIVE воркспейс; `workspace_id` переопределяет оба). Только ACTIVE-участник.
        Возвращаются только метаданные и состояние прочтения, без текста сообщения,
        отсортированные `created_at DESC, id DESC`. `unread=true` — только непрочитанные;
        `unread_count` — счётчик непрочитанных во всём воркспейсе (не только на странице).
        Инбокс не зависит от notification preferences: MUTE гасит уведомление, но не
        запись упоминания.
      parameters:
        - name: workspace_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: unread
          in: query
          required: false
          schema: { type: boolean, default: false }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: Страница упоминаний и unread_count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MentionPage" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /me/mentions/read:
    post:
      tags: [mentions]
      operationId: markMentionsRead
      summary: Отметить упоминания прочитанными
      description: >
        #83: `ids` (до 200, только свои строки) или `all=true` (весь инбокс текущего
        воркспейса). Идемпотентно: `read_at` выставляется один раз. `Idempotency-Key`
        обязателен, как у остальных мутаций.
      parameters:
        - name: workspace_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReadMentionsRequest" }
      responses:
        "204":
          description: Отмечено
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /chats/{chatId}:
    patch:
      tags: [chats]
      operationId: updateChat
      summary: Обновить название и/или описание чата (workspace OWNER/ADMIN)
      description: >
        Merged-патч настроек чата: `name` и/или `description`. Вызывающий должен быть
        ACTIVE-участником воркспейса чата с ролью `OWNER` или `ADMIN` (роли чата не
        используются). `MEMBER`/`GUEST` получают `403 FORBIDDEN`; неизвестный, удалённый
        или чужой чат — `404` без раскрытия существования. Тело без `name` и
        `description` — `422 VALIDATION_FAILED`. `name` после trim/collapse пробелов —
        1..120 символов, `description` — до 500 символов, `description: ""` очищает
        описание в `null`. Строки — plain text: управляющие символы (кроме `\n`/`\t` в
        описании) и `<`/`>` отклоняются `422 VALIDATION_FAILED`; сервер ничего не
        экранирует и не интерпретирует как HTML. В E2EE-чате разрешён только `name`:
        `description` (включая очистку) отклоняется `422 CHAT_SETTINGS_E2EE_UNSUPPORTED`
        без частичного применения. `security_mode` неизменяем. Идемпотентность и
        оптимистическая блокировка не требуются; успешный запрос пишет audit
        `chat.updated` (metadata — только имена изменённых полей, без значений).
      parameters:
        - $ref: "#/components/parameters/ChatId"
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatUpdateRequest"
      responses:
        "200":
          description: Настройки обновлены; возвращается полный Chat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chat"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

    delete:
      tags: [chat]
      operationId: deleteChat
      summary: Мягко удалить GROUP-канал (OWNER)
      description: >
        Только ACTIVE OWNER канала. Мягкое удаление: `deleted_at = now()`, строка,
        участники, сообщения и файлы сохраняются; канал исчезает из всех списков и
        access-путей, повторный DELETE — `404` (существование уже скрыто). Ссылка на
        обложку очищается в том же запросе; сам attachment остаётся на обычном
        retention/GC файлового flow. DIRECT — `422 CHAT_MEMBERSHIP_UNSUPPORTED`; выход
        из канала — отдельный `POST /chats/{chatId}/leave`. Аудит `chat.deleted` без
        контента.
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '204':
          description: Канал мягко удалён
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /chats/{chatId}/cover:
    parameters:
      - $ref: '#/components/parameters/ChatId'
    post:
      tags: [chat]
      operationId: setChatCover
      summary: Обложка канала из существующего вложения
      description: >
        OWNER/ADMIN канала. `file_id` — существующее managed-вложение этого же чата:
        изображение (`image/*` или `media.kind=IMAGE`) в состоянии READY/BOUND и
        CLEAN/SKIPPED. Файл загружается с устройства через `POST /media/images` с
        `chat_id` этого чата (создаётся `source=DIRECT_IMAGE`, `scan_status=SKIPPED`)
        или обычным файловым flow и передаётся ссылкой. Неизвестное/чужое/из другого
        чата вложение — `404` без
        раскрытия существования; не изображение — `422 CHAT_COVER_INVALID`;
        не просканировано — `409 ATTACHMENT_NOT_READY`; карантин — `423
        ATTACHMENT_QUARANTINED`. E2EE-чат — `422 CHAT_SETTINGS_E2EE_UNSUPPORTED`,
        DIRECT — `422 CHAT_MEMBERSHIP_UNSUPPORTED`. Повтор той же обложки идемпотентен
        (`200`) и не пишет новый аудит. Аудит `chat.cover.updated` без file id.
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCoverRequest'
      responses:
        '200':
          description: Обложка установлена; возвращается полный Chat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '423':
          description: Вложение в карантине (ATTACHMENT_QUARANTINED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [chat]
      operationId: deleteChatCover
      summary: Удалить обложку канала
      description: >
        OWNER/ADMIN канала; идемпотентно (`204`, в том числе если обложки не было).
        Сам attachment не удаляется: он остаётся обычным вложением файлового flow.
        Аудит `chat.cover.updated` пишется только при фактическом удалении.
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '204':
          description: Обложка удалена (или уже отсутствовала)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /chats/{chatId}/avatar:
    parameters:
      - $ref: '#/components/parameters/ChatId'
      - $ref: '#/components/parameters/DeviceId'
    post:
      tags: [chat]
      operationId: setChatAvatar
      summary: Иконка/аватар канала из существующего вложения
      description: >
        OWNER/ADMIN канала. `file_id` — существующее managed-вложение этого же чата:
        изображение (`image/*` или `media.kind=IMAGE`) в состоянии READY/BOUND и
        CLEAN/SKIPPED — ровно те же правила, что у обложки. Файл загружается с
        устройства через `POST /media/images` с `chat_id` этого чата или обычным
        файловым flow и передаётся ссылкой. Неизвестное/чужое/из другого
        чата вложение — `404` без раскрытия существования; не изображение — `422
        CHAT_AVATAR_INVALID`; не просканировано — `409 ATTACHMENT_NOT_READY`; карантин —
        `423 ATTACHMENT_QUARANTINED`. E2EE-чат — `422 CHAT_SETTINGS_E2EE_UNSUPPORTED`,
        DIRECT — `422 CHAT_MEMBERSHIP_UNSUPPORTED`. Повтор того же аватара идемпотентен
        (`200`) и не пишет новый аудит. Аудит `chat.avatar.updated` без file id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatAvatarRequest'
      responses:
        '200':
          description: Аватар установлен; возвращается полный Chat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '423':
          description: Вложение в карантине (ATTACHMENT_QUARANTINED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [chat]
      operationId: deleteChatAvatar
      summary: Удалить аватар канала
      description: >
        OWNER/ADMIN канала; идемпотентно (`204`, в том числе если аватара не было).
        DIRECT — `422 CHAT_MEMBERSHIP_UNSUPPORTED`. Сам attachment не удаляется: он
        остаётся обычным вложением файлового flow. Аудит `chat.avatar.updated` пишется
        только при фактическом удалении.
      responses:
        '204':
          description: Аватар удалён (или уже отсутствовал)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
    get:
      tags: [chat]
      operationId: getChatAvatar
      summary: Получить аватар канала (302 на короткоживущий presigned URL)
      description: >
        Любой ACTIVE-участник канала. Ответ — `302` с `Location` на presigned object URL
        (TTL 5 минут); в теле дополнительно возвращаются URL и срок жизни. Ключ хранения
        никогда не раскрывается. Аватар не установлен (в том числе для DIRECT) — `404`;
        не-участник/неизвестный чат — `404` без раскрытия существования.
      responses:
        '302':
          description: Временный redirect на presigned URL
          headers:
            Location:
              schema: { type: string, format: uri }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileAvatar'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /chats/{chatId}/permissions:
    parameters:
      - $ref: '#/components/parameters/ChatId'
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [chat]
      operationId: getChatPermissions
      summary: Матрица прав канала по ролям
      description: >
        Любой ACTIVE-участник GROUP-канала видит эффективную матрицу: `post_messages`,
        `invite_members`, `create_polls`, `start_calls`, `pin_messages`, `change_info`
        для ролей OWNER/ADMIN/MODERATOR/MEMBER/GUEST. OWNER всегда `true`. Отсутствующая
        строка заменяется встроенным дефолтом, поэтому ответ всегда полный. DIRECT —
        `422 CHAT_MEMBERSHIP_UNSUPPORTED`, не-участник — `404`.
      responses:
        '200':
          description: Эффективная матрица прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatPermissions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
    patch:
      tags: [chat]
      operationId: updateChatPermissions
      summary: Изменить матрицу прав канала
      description: >
        OWNER/ADMIN канала. Partial-патч по ролям: отсутствующая роль/право не меняется.
        `owner` не принимается (`422 VALIDATION_FAILED`, OWNER всегда имеет все права).
        Пустой объект/роль без прав — `422 VALIDATION_FAILED`. Изменения применяются
        атомарно с последующими проверками (сообщения, инвайты, опросы, звонки, пины,
        change_info). Аудит `chat.permissions.updated` содержит только имена ролей и прав.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatPermissionsUpdate'
      responses:
        '200':
          description: Обновлённая эффективная матрица
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatPermissions'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /chats/{chatId}/archive:
    parameters:
      - $ref: '#/components/parameters/ChatId'
      - $ref: '#/components/parameters/DeviceId'
    post:
      tags: [chat]
      operationId: archiveChat
      summary: Архивировать чат для себя (user-local)
      description: >
        Любой ACTIVE-участник, включая DIRECT. Личный архив: чат скрывается только из
        основного списка вызывающего (`GET /workspaces/{id}/chats`), другие участники
        не затронуты. Идемпотентно (`204`). Аудит не пишется: это личное UI-состояние,
        а не действие над каналом. Не-участник — `404`.
      responses:
        '204':
          description: Чат в личном архиве (или уже там)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /chats/{chatId}/unarchive:
    parameters:
      - $ref: '#/components/parameters/ChatId'
      - $ref: '#/components/parameters/DeviceId'
    post:
      tags: [chat]
      operationId: unarchiveChat
      summary: Убрать чат из личного архива
      description: >
        Любой ACTIVE-участник. Идемпотентно (`204`, в том числе если чат не был в
        архиве). Не-участник — `404`.
      responses:
        '204':
          description: Чат возвращён в основной список (или уже был там)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /chats/{chatId}/pins:
    parameters:
      - $ref: '#/components/parameters/ChatId'
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [chat]
      operationId: listChatPins
      summary: Закреплённые сообщения канала
      description: >
        ACTIVE-участник GROUP-канала. Только метаданные (`chat_id`, `message_id`,
        `pinned_by`, `pinned_at`), без текста и без E2EE-контента; порядок — новые пины
        первыми. Пины удалённых сообщений не возвращаются. DIRECT — `422
        CHAT_MEMBERSHIP_UNSUPPORTED`.
      responses:
        '200':
          description: Список закреплений
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatPinList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
    post:
      tags: [chat]
      operationId: pinChatMessage
      summary: Закрепить сообщение канала
      description: >
        Право `pin_messages` (по умолчанию OWNER/ADMIN/MODERATOR). Сообщение должно
        существовать в этом чате и не быть удалённым, иначе `404`. Уникальность
        `(chat_id, message_id)`: повтор — `200` с текущим пином и без нового аудита,
        первый успешный вызов — `201`. Лимит 50 пинов — `409 CHAT_PIN_LIMIT`.
        E2EE-чат — `422 E2EE_METADATA_FORBIDDEN` (метаданные таймлайна не хранятся).
        DIRECT — `422 CHAT_MEMBERSHIP_UNSUPPORTED`. Аудит: только `message_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatPinRequest'
      responses:
        '201':
          description: Сообщение закреплено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatPin'
        '200':
          description: Сообщение уже закреплено (идемпотентный повтор)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatPin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /chats/{chatId}/pins/{messageId}:
    parameters:
      - $ref: '#/components/parameters/ChatId'
      - name: messageId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: '#/components/parameters/DeviceId'
    delete:
      tags: [chat]
      operationId: unpinChatMessage
      summary: Открепить сообщение канала
      description: >
        Право `pin_messages`. Идемпотентно: `204`, в том числе если пин уже снят
        (включая случай удалённого сообщения — метаданные можно очистить). Аудит
        `chat.pin.removed` только при фактическом удалении; только `message_id`.
        DIRECT — `422 CHAT_MEMBERSHIP_UNSUPPORTED`.
      responses:
        '204':
          description: Пин снят (или уже отсутствовал)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /chats/{chatId}/plugins:
    get:
      tags: [plugins]
      operationId: listChatPlugins
      summary: Состояние встроенных плагинов в чате
      description: >
        По одной записи на каждый встроенный плагин. Вызывающий должен быть ACTIVE-
        участником чата; неизвестный, удалённый или чужой чат — `404` без раскрытия
        существования, не-участник воркспейса — `403`. `enabled` — сохранённый
        переключатель (нет строки — `false`), `available` — эффективная доступность с
        учётом неизменяемого `security_mode` чата и `state` каталога. `reason`
        присутствует только при `available=false`: `PLUGIN_NOT_AVAILABLE` (серверный
        плагин в E2EE-чате) или `PLUGIN_DISABLED` (kill switch каталога). Контент
        сообщений, ключи и E2EE-plaintext не возвращаются.
      parameters:
        - $ref: "#/components/parameters/ChatId"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: Состояние плагинов в чате
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatPluginStateList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /chats/{chatId}/plugins/{pluginId}:
    patch:
      tags: [plugins]
      operationId: updateChatPlugin
      summary: Включить/выключить встроенный плагин в чате (chat OWNER/ADMIN)
      description: >
        Меняет только per-chat переключатель. Вызывающий должен быть ACTIVE-участником
        чата с ролью `OWNER` или `ADMIN`; `MODERATOR`/`MEMBER`/`GUEST` получают `403
        FORBIDDEN`, неизвестный/удалённый/чужой чат — `404` без раскрытия существования,
        не-участник воркспейса — `403`. Плагин обязан существовать во встроенном
        каталоге: неизвестный `pluginId` — `404 PLUGIN_NOT_FOUND`. Плагин должен быть
        доступен в режиме чата: серверный (`MANAGED`-only) плагин в E2EE-чате —
        `422 PLUGIN_NOT_AVAILABLE`, `state=DISABLED` — `422 PLUGIN_DISABLED`; частичного
        применения нет. Операция идемпотентна: повтор с тем же `enabled` возвращает
        `200`, не меняет `updated_by`/`updated_at` и не пишет второй audit. Успешное
        изменение пишет audit `chat.plugin.changed` с metadata только `plugin_id` и
        `enabled`; имена, описания, права, сообщения и секреты не пишутся. Плагин не
        исполняется и внешних вызовов не делает.
      parameters:
        - $ref: "#/components/parameters/ChatId"
        - $ref: "#/components/parameters/PluginId"
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatPluginUpdateRequest"
      responses:
        "200":
          description: Состояние плагина после операции
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatPluginState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /chats/{chatId}/music-room:
    get:
      tags: [plugins]
      operationId: getMusicRoom
      summary: AUDIO-вложения музыкальной комнаты (плагин `music-room` включён)
      description: >
        Список AUDIO-вложений канала, доступный любому ACTIVE-участнику чата при
        включённом плагине `music-room`. Неизвестный/удалённый/чужой чат — `404` без
        раскрытия существования, не-участник воркспейса — `403`, выключенный плагин —
        `422 PLUGIN_NOT_ENABLED`, kill switch каталога — `422 PLUGIN_DISABLED`,
        серверный плагин в E2EE-чате — `422 PLUGIN_NOT_AVAILABLE`. Данные берутся из
        file center: только `CLEAN`-вложения и только метаданные (`id`, `filename`,
        `mime_type`, `duration_ms`, `artwork_url`, `title`/`artist`, `size_bytes`,
        `message_id`, `created_at`); object key, `sha256`, presigned URL и байты не
        возвращаются. Список отсортирован по `created_at DESC` и ограничен 100
        элементами: `has_more=true` означает, что более старые треки не вошли в срез
        (курсора в этом срезе нет). Сервер не воспроизводит аудио и не открывает SFU:
        фронтенд микширует звук в звонок локально.
      parameters:
        - $ref: "#/components/parameters/ChatId"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: AUDIO-вложения комнаты
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MusicRoomTracks"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /chats/{chatId}/polls:
    parameters:
      - $ref: "#/components/parameters/ChatId"
      - $ref: "#/components/parameters/DeviceId"
    get:
      tags: [plugins]
      operationId: listPolls
      summary: Опросы чата (плагин `polls` должен быть включён)
      description: >
        Доступно только ACTIVE-участнику чата при включённом плагине `polls`; иначе
        `422 PLUGIN_NOT_ENABLED`. Неизвестный/удалённый/чужой чат — `404` без раскрытия
        существования, не-участник воркспейса — `403`. В E2EE-чате серверный плагин
        недоступен (`422 PLUGIN_NOT_AVAILABLE`). Вопрос, варианты и голоса — только
        метаданные опроса; содержимое E2EE-сообщений не читается и не возвращается.
        `my_option_id` — вариант, выбранный вызывающим, либо `null`.
      responses:
        "200":
          description: Опросы чата в порядке создания (новые первыми)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PollList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
    post:
      tags: [plugins]
      operationId: createPoll
      summary: Создать опрос (плагин `polls`)
      parameters:
        - $ref: "#/components/parameters/OptionalIdempotencyKey"
      description: >
        Создавать опрос может ACTIVE-участник чата при включённом плагине `polls` и
        праве `create_polls` (по умолчанию OWNER/ADMIN/MODERATOR/MEMBER; GUEST — нет).
        Вопрос — plain text 1..500 символов без HTML/control-символов; 2..10 уникальных
        вариантов по 1..200 символов. Создатель фиксируется сервером и только он может
        закрыть опрос. В read-only канале создание опроса — `403 CHAT_READ_ONLY`; без
        права — `403 CHAT_PERMISSION_DENIED`. В E2EE-чате плагин недоступен. Audit пишет
        только id опроса и действие — без вопроса и текста вариантов. #101: вопрос и
        каждый вариант проверяются workspace DLP (`scope=PLUGIN` или `ALL`); BLOCK →
        `422 DLP_BLOCKED` до резерва `Idempotency-Key`, содержимое не сохраняется.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PollCreate"
      responses:
        "201":
          description: >
            Опрос создан; в той же транзакции создано сообщение `POLL` в ленте чата.
            `message_id` — id этого сообщения (его `type=POLL`, `poll_id` указывает на
            опрос). Повтор с тем же `Idempotency-Key` возвращает `Idempotent-Replay: true`
            и исходные `id`/`message_id`, не создавая второе сообщение.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Poll"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

