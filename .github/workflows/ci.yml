# CI — blocking gates for the whole repository (issue #35).
#
# What runs:
#   backend   JDK 21 + `mvn test` (unit + Testcontainers integration, 498 tests).
#             GitHub-hosted ubuntu runners provide the Docker daemon Testcontainers
#             needs; no external database or SMTP server is used.
#   frontend  Node 22 + `npm ci` + `npm run check` (eslint, prettier, contract
#             drift, stickers, client security, session writers, 867 vitest tests,
#             tsc + vite build).
#   contract  `npm run contract:check` in its own fast-failing job.
#   guardrails YAML parse, shellcheck, E2EE base flags stay `false`, no secret
#             files tracked.
#
# Deliberately NOT here: deploy, image push, E2EE flag-on. Live E2EE runs are
# manual/label-gated in `.github/workflows/e2ee-gated.yml`.
#
# No repository secrets are required.

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'design/**'
      - 'docs/**'
      - 'wiki/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'design/**'
      - 'docs/**'
      - 'wiki/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '22'

jobs:
  backend:
    name: Backend (JDK 21, Maven test)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Maven test (unit + Testcontainers integration)
        working-directory: backend
        run: mvn -B -ntp -Dstyle.color=never test

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire
          path: backend/target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore

  frontend:
    name: Frontend (Node 22, npm run check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Check (lint, format, contract, security, tests, build)
        working-directory: frontend
        run: npm run check

  contract:
    name: Contract drift (OpenAPI)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Contract drift check
        working-directory: frontend
        run: npm run contract:check

  guardrails:
    name: Repo guardrails (YAML, shell, E2EE defaults)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PyYAML
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pyyaml \
            || python3 -m pip install --quiet --break-system-packages pyyaml

      - name: Validate YAML
        run: python3 scripts/validate-yaml.py

      - name: ShellCheck
        run: shellcheck --severity=warning scripts/*.sh deploy/scripts/*.sh

      - name: E2EE base flags stay off
        run: bash scripts/check-e2ee-base-flags.sh

      - name: No secret files tracked
        run: |
          tracked="$(git ls-files -- '.env' 'deploy/.env' '*.pem' '*.p12' '*.key')"
          if [[ -n "$tracked" ]]; then
            echo "::error::Secret-bearing files must not be tracked:"
            echo "$tracked"
            exit 1
          fi
          echo "ok: no .env / key material tracked"
