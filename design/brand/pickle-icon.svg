<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Pickle app icon">
  <defs>
    <linearGradient id="pickle" x1="0.1" y1="0.05" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#8CDD5E"/>
      <stop offset="0.45" stop-color="#65BD45"/>
      <stop offset="1" stop-color="#357E35"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4B8F3D"/>
      <stop offset="1" stop-color="#24572A"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="#141A1B"/>
  <rect x="1" y="1" width="1022" height="1022" rx="223" fill="none" stroke="#FFFFFF" stroke-opacity="0.06"/>

  <!-- short stem: a pickle cue without fine detail -->
  <path d="M 650 170 C 692 112 760 104 804 148" fill="none" stroke="url(#stem)" stroke-width="36" stroke-linecap="round"/>

  <!-- elongated cucumber + speech-bubble tail -->
  <path d="M 520 128
           C 660 128 752 236 760 392
           C 768 512 736 640 664 742
           C 612 816 532 852 458 832
           L 300 916
           L 334 776
           C 276 706 248 596 250 478
           C 252 274 374 128 520 128 Z"
        fill="url(#pickle)" filter="url(#soft)"/>

  <!-- pickle bumps, no seeds, no face -->
  <circle cx="376" cy="326" r="20" fill="#D9FCA8" fill-opacity="0.28"/>
  <circle cx="706" cy="424" r="15" fill="#D9FCA8" fill-opacity="0.22"/>
  <circle cx="402" cy="536" r="13" fill="#D9FCA8" fill-opacity="0.20"/>
  <circle cx="684" cy="620" r="17" fill="#D9FCA8" fill-opacity="0.20"/>
  <circle cx="512" cy="730" r="11" fill="#D9FCA8" fill-opacity="0.18"/>
  <circle cx="330" cy="690" r="10" fill="#D9FCA8" fill-opacity="0.16"/>
</svg>
