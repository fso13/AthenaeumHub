<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F3F1EC" />
  <title>Круг — прототип мессенджера</title>
  <link rel="stylesheet" href="styles.css" />

</head>
<body>

  <symbol id="i-translate" viewBox="0 0 24 24"><path d="M4 5.5h8M8 3.5v2c0 4-2 7-5 8.5"/><path d="M5 10.5c1.2 2.5 3.2 4 6 4.5"/><path d="m12 20 4-10 4 10M13.5 16.5h5"/></symbol>
  <symbol id="i-bot" viewBox="0 0 24 24"><rect x="4" y="7.5" width="16" height="12" rx="4"/><path d="M12 3.5V7M8.5 12.5v.2M15.5 12.5v.2M9.5 16h5"/></symbol>
  <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="12" r="4"/><path d="M12 12h9M18 12v3M15.5 12v2"/></symbol>

  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="3"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3.5v11M7.5 10l4.5 4.5 4.5-4.5"/><path d="M4.5 19.5h15"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5 19 12 8 18.5v-13Z"/></symbol>
  <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>

  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l2.6-2.6a4.5 4.5 0 0 0-6.4-6.4L11 6.6"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0L5 12.6a4.5 4.5 0 0 0 6.4 6.4l1.6-1.6"/></symbol>
  <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M6 4.5h12v16L12 16l-6 4.5v-16Z"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></symbol>

<div class="app" id="app">

  <!-- ═══════════ SIDEBAR ═══════════ -->
  <aside class="sidebar" id="sidebar" aria-label="Список чатов">
    <div class="sidebar-head">
      <button class="brand" id="brand" data-action="toggle-ws-menu" aria-haspopup="true" aria-expanded="false" title="Переключить пространство">
        <span class="brand-mark">
          <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4.5a11.5 11.5 0 1 0 11.5 11.5" stroke="currentColor" stroke-width="2.8" fill="none" stroke-linecap="round"/><circle cx="16" cy="16" r="3.4" fill="currentColor"/><circle cx="27.5" cy="16" r="2.1" fill="currentColor"/></svg>
        </span>
        <span class="brand-text">
          <span class="brand-name">круг<span class="brand-dot">.</span></span>
          <span class="brand-ws" id="brand-ws">Студия «Восход»</span>
        </span>
        <span class="brand-chevron" id="brand-chevron">
          <svg class="icon"><use href="#i-chevron-down"/></svg>
        </span>
      </button>
      <button class="icon-btn icon-btn--accent" data-action="new-chat" aria-label="Новый чат" title="Новый чат">
        <svg class="icon"><use href="#i-plus"/></svg>
      </button>

      <div class="ws-pop" id="ws-pop" hidden>
        <div class="ws-pop-label">Пространства</div>
        <div id="ws-list"></div>
        <button class="ws-create" data-action="toast" data-text="Создание воркспейса появится в полной версии">
          <svg class="icon"><use href="#i-plus"/></svg> Создать пространство
        </button>
      </div>
    </div>

    <div class="search-wrap">
      <svg class="icon search-icon"><use href="#i-search"/></svg>
      <input id="chat-search" type="search" placeholder="Поиск по чатам и людям" autocomplete="off" aria-label="Поиск по чатам" />
      <kbd>⌘K</kbd>
    </div>

    <div class="filters" id="filters" role="tablist" aria-label="Фильтр чатов">
      <button class="filter is-active" data-action="filter" data-filter="all" role="tab" aria-selected="true">Все</button>
      <button class="filter" data-action="filter" data-filter="unread" role="tab" aria-selected="false">Непрочитанные</button>
      <button class="filter" data-action="filter" data-filter="groups" role="tab" aria-selected="false">Группы</button>
      <span class="filter-spacer"></span>
      <span class="online-count" id="online-count" title="Участники онлайн">0 онлайн</span>
    </div>

    <div class="chat-list" id="chat-list"></div>

    <div class="sidebar-foot">
      <div class="tools">
        <button class="tool" data-action="open-plugins">
          <span class="tool-icon"><svg class="icon"><use href="#i-plug"/></svg></span>
          <span>Плагины</span>
        </button>
        <button class="tool" data-action="open-files">
          <span class="tool-icon"><svg class="icon"><use href="#i-folder"/></svg></span>
          <span>Файлы</span>
        </button>
        <button class="tool" data-action="open-security">
          <span class="tool-icon"><svg class="icon"><use href="#i-shield"/></svg></span>
          <span>Защита</span>
        </button>
      </div>
      <div class="me">
        <button class="me-profile" data-action="toast" data-text="Профиль и настройки — в полной версии">
          <span class="avatar avatar--sm av-me">ДК<span class="presence is-online"></span></span>
          <span class="me-text">
            <span class="me-name">Дмитрий Крылов</span>
            <span class="me-status">В сети</span>
          </span>
        </button>
        <button class="me-btn" data-action="toggle-theme" aria-label="Переключить тему" title="Светлая / тёмная тема">
          <svg class="icon icon-sun"><use href="#i-sun"/></svg>
          <svg class="icon icon-moon"><use href="#i-moon"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- ═══════════ CHAT ═══════════ -->
  <main class="chat" id="chat">
    <header class="chat-head">
      <button class="icon-btn only-mobile" data-action="toggle-sidebar" aria-label="Открыть список чатов">
        <svg class="icon"><use href="#i-menu"/></svg>
      </button>
      <div class="chat-id" id="chat-id"></div>
      <div class="chat-actions">
        <button class="icon-btn" data-action="search-in-chat" aria-label="Поиск в чате" title="Поиск в чате">
          <svg class="icon"><use href="#i-search"/></svg>
        </button>
        <button class="icon-btn hide-sm" data-action="toast" data-text="Звонки появятся в v1.5 — уже в дорожной карте" aria-label="Аудиозвонок" title="Аудиозвонок">
          <svg class="icon"><use href="#i-phone"/></svg>
        </button>
        <button class="icon-btn hide-sm" data-action="toast" data-text="Видеозвонки появятся в v1.5 — уже в дорожной карте" aria-label="Видеозвонок" title="Видеозвонок">
          <svg class="icon"><use href="#i-video"/></svg>
        </button>
        <button class="icon-btn" id="details-toggle" data-action="toggle-details" aria-label="Панель чата" title="Участники, плагины, защита">
          <svg class="icon"><use href="#i-info"/></svg>
        </button>
      </div>
    </header>

    <div class="pinned" id="pinned" hidden>
      <svg class="icon"><use href="#i-pin"/></svg>
      <span class="pinned-label">Закреплено</span>
      <span class="pinned-text" id="pinned-text"></span>
      <button class="icon-btn icon-btn--tiny" data-action="close-pinned" aria-label="Скрыть закреплённое">
        <svg class="icon"><use href="#i-x"/></svg>
      </button>
    </div>

    <div class="messages" id="messages" tabindex="0" aria-live="polite"></div>

    <div class="composer-wrap">
      <div class="reply-bar" id="reply-bar" hidden>
        <span class="reply-accent"></span>
        <div class="reply-body">
          <span class="reply-label" id="reply-label"></span>
          <span class="reply-text" id="reply-text"></span>
        </div>
        <button class="icon-btn icon-btn--tiny" data-action="cancel-reply" aria-label="Отменить ответ">
          <svg class="icon"><use href="#i-x"/></svg>
        </button>
      </div>

      <div class="composer" id="composer">
        <textarea id="message-input" rows="1" maxlength="8000" placeholder="Написать сообщение…" aria-label="Текст сообщения"></textarea>
        <div class="composer-bar">
          <div class="composer-left">
            <button class="icon-btn" data-action="attach" aria-label="Прикрепить файл, до 200 МБ" title="Прикрепить файл · демо-лимит 200 МБ">
              <svg class="icon"><use href="#i-paperclip"/></svg>
            </button>
            <button class="icon-btn" data-action="toggle-emoji" aria-label="Эмодзи" title="Эмодзи">
              <svg class="icon"><use href="#i-smile"/></svg>
            </button>
            <button class="icon-btn" data-action="toggle-stickers" aria-label="Стикеры" title="Стикеры">
              <svg class="icon"><use href="#i-sticker"/></svg>
            </button>
            <button class="icon-btn" data-action="toggle-plugin-menu" aria-label="Плагины в композере" title="Плагины">
              <svg class="icon"><use href="#i-plug"/></svg>
            </button>
            <span class="composer-sep"></span>
            <span class="composer-hint hide-sm">Enter — отправить · Shift+Enter — строка · файлы до 200 МБ</span>
          </div>
          <div class="composer-right">
            <span class="char-count" id="char-count"></span>
            <button class="send-btn" id="send-btn" data-action="send" aria-label="Отправить сообщение">
              <svg class="icon"><use href="#i-arrow-up"/></svg>
            </button>
          </div>
        </div>

        <div class="emoji-pop" id="emoji-pop" hidden>
          <button data-action="insert-emoji" data-emoji="🙂">🙂</button>
          <button data-action="insert-emoji" data-emoji="👍">👍</button>
          <button data-action="insert-emoji" data-emoji="🔥">🔥</button>
          <button data-action="insert-emoji" data-emoji="❤️">❤️</button>
          <button data-action="insert-emoji" data-emoji="🎉">🎉</button>
          <button data-action="insert-emoji" data-emoji="😄">😄</button>
          <button data-action="insert-emoji" data-emoji="🤔">🤔</button>
          <button data-action="insert-emoji" data-emoji="✅">✅</button>
          <button data-action="insert-emoji" data-emoji="👀">👀</button>
          <button data-action="insert-emoji" data-emoji="🙏">🙏</button>
          <button data-action="insert-emoji" data-emoji="💚">💚</button>
          <button data-action="insert-emoji" data-emoji="😢">😢</button>
        </div>

        <div class="sticker-pop" id="sticker-pop" hidden>
          <div class="sticker-pop-head">
            <div class="sticker-tabs" id="sticker-tabs" role="tablist" aria-label="Наборы стикеров"></div>
            <button class="icon-btn icon-btn--tiny" data-action="toast" data-text="Загрузка своих наборов — в полной версии" aria-label="Добавить набор" title="Добавить свой набор"><svg class="icon"><use href="#i-plus"/></svg></button>
          </div>
          <div class="sticker-grid" id="sticker-grid"></div>
          <div class="sticker-pop-foot">
            <span id="sticker-pack-caption">Стикеры</span>
            <span>≤ 512 КБ · WebP/PNG</span>
          </div>
        </div>

        <div class="plugin-pop" id="plugin-pop" hidden>
          <div class="pop-label">Плагины в этом чате</div>
          <div id="plugin-pop-list"></div>
          <button class="pop-more" data-action="open-plugins">Все плагины <svg class="icon"><use href="#i-chevron-right"/></svg></button>
        </div>
      </div>

      <div class="composer-note" id="composer-note">
        <svg class="icon"><use href="#i-lock"/></svg>
        <span>Сообщения защищены сквозным шифрованием</span>
      </div>
    </div>
  </main>

  <!-- ═══════════ DETAILS ═══════════ -->
  <aside class="details" id="details" aria-label="О чате">
    <div class="details-head">
      <div class="dtabs" id="details-tabs" role="tablist">
        <button class="dtab" data-action="details-tab" data-tab="people" role="tab">Люди</button>
        <button class="dtab" data-action="details-tab" data-tab="plugins" role="tab">Плагины</button>
        <button class="dtab" data-action="details-tab" data-tab="security" role="tab">Защита</button>
      </div>
      <button class="icon-btn icon-btn--tiny" data-action="close-details" aria-label="Закрыть панель">
        <svg class="icon"><use href="#i-x"/></svg>
      </button>
    </div>
    <div class="details-body" id="details-body"></div>

  <div class="scrim" id="scrim" data-action="close-overlays"></div>
</div>

<div class="modal-root" id="modal-root" hidden></div>
<div class="toast-stack" id="toasts" aria-live="polite"></div>
