<div class="backdrop"></div>

<div class="app" id="app">

  <!-- ══════════ RAIL ══════════ -->
  <aside class="rail" aria-label="Пространства">
    <a class="rail-logo" href="#" aria-label="Сова">
      <img src="assets/app-icon.svg" alt="" width="40" height="40" />
    </a>
    <div class="rail-spaces" id="rail-spaces"></div>
    <button class="rail-add" id="rail-add" aria-label="Создать пространство" title="Создать пространство">
      <svg class="i"><use href="#i-plus"/></svg>
    </button>
  </aside>

  <!-- ══════════ SIDEBAR ══════════ -->
  <aside class="sidebar" id="sidebar" aria-label="Навигация и чаты">
    <header class="ws-head">
      <button class="ws-btn" id="ws-btn" aria-haspopup="menu" aria-expanded="false">
        <span id="ws-name">Студия «Восход»</span>
        <svg class="i chev"><use href="#i-chevron-down"/></svg>
      </button>
      <button class="icon-btn" id="new-chat" aria-label="Новый чат" title="Новый чат">
        <svg class="i"><use href="#i-plus"/></svg>
      </button>

      <div class="ws-menu" id="ws-menu" role="menu" hidden>
        <div class="menu-label">Пространства</div>
        <div id="ws-menu-list"></div>
        <button class="ws-create" id="ws-create" role="menuitem">
          <svg class="i"><use href="#i-plus"/></svg>
          Создать пространство
        </button>
      </div>
    </header>

    <nav class="nav" id="nav" aria-label="Разделы"></nav>

    <div class="side-scroll" id="side-scroll"></div>

    <footer class="me">
      <button class="me-btn" id="me-btn" title="Профиль и настройки">
        <span class="av av-36 av-me">ДК<span class="presence is-online"></span></span>
        <span class="me-text">
          <b>Дмитрий Крылов</b>
          <span class="me-status"><i class="dot is-online"></i>В сети</span>
        </span>
      </button>
      <div class="me-actions">
        <button class="icon-btn" id="theme-toggle" aria-label="Переключить тему" title="Светлая / тёмная тема">
          <svg class="i i-sun"><use href="#i-sun"/></svg>
          <svg class="i i-moon"><use href="#i-moon"/></svg>
        </button>
        <button class="icon-btn" id="logout" aria-label="Выйти" title="Выйти">
          <svg class="i"><use href="#i-logout"/></svg>
        </button>
      </div>
    </footer>
  </aside>

  <!-- ══════════ CHAT ══════════ -->
  <main class="chat" id="chat">
    <header class="chat-head">
      <button class="mobile-back" id="mobile-back" aria-label="К списку чатов">
        <svg class="i"><use href="#i-chevron-left"/></svg>
      </button>
      <button class="chat-id" id="chat-id" aria-label="Открыть информацию о чате"></button>
      <div class="chat-actions">
        <button class="icon-btn" id="search-toggle" aria-label="Поиск в переписке" title="Поиск в переписке">
          <svg class="i"><use href="#i-search"/></svg>
        </button>
        <button class="icon-btn hide-sm" id="call-btn" aria-label="Аудиозвонок" title="Аудиозвонок">
          <svg class="i"><use href="#i-phone"/></svg>
        </button>
        <button class="icon-btn hide-sm" id="video-btn" aria-label="Видеозвонок" title="Видеозвонок">
          <svg class="i"><use href="#i-video"/></svg>
        </button>
        <button class="icon-btn" id="details-toggle" aria-label="Панель чата" title="О чате">
          <svg class="i"><use href="#i-info"/></svg>
        </button>
      </div>
    </header>

    <div class="chat-search" id="chat-search" hidden>
      <svg class="i"><use href="#i-search"/></svg>
      <input id="search-input" type="search" placeholder="Поиск в переписке" aria-label="Поиск в переписке" autocomplete="off" />
      <span class="search-count" id="search-count"></span>
      <button class="icon-btn icon-btn--sm" id="search-close" aria-label="Закрыть поиск">
        <svg class="i"><use href="#i-x"/></svg>
      </button>
    </div>

    <div class="messages" id="messages" tabindex="0" aria-live="polite"></div>

    <div class="composer-wrap">
      <div class="typing" id="typing" hidden>
        <span class="typing-dots"><i></i><i></i><i></i></span>
        <span id="typing-name">Анна печатает…</span>
      </div>

      <div class="recording" id="recording" hidden aria-live="polite">
        <span class="rec-dot"></span>
        <span class="rec-time" id="rec-time">0:00</span>
        <div class="rec-wave" id="rec-wave" aria-hidden="true"></div>
        <span class="rec-hint">Запись голосового</span>
        <button type="button" class="rec-btn" id="rec-cancel" aria-label="Отменить запись" title="Отменить">
          <svg class="i"><use href="#i-trash"/></svg>
        </button>
        <button type="button" class="rec-send" id="rec-send" aria-label="Отправить голосовое" title="Отправить">
          <svg class="i"><use href="#i-send"/></svg>
        </button>
      </div>

      <form class="composer" id="composer" autocomplete="off">
        <button type="button" class="round-btn" id="attach" aria-label="Прикрепить" title="Прикрепить">
          <svg class="i"><use href="#i-plus"/></svg>
        </button>
        <button type="button" class="round-btn" id="sticker-btn" aria-label="Стикеры" title="Стикеры">
          <svg class="i"><use href="#i-sticker"/></svg>
        </button>

        <div class="field" id="field">
          <textarea id="input" rows="1" placeholder="Написать сообщение…" aria-label="Текст сообщения"></textarea>
          <button type="button" class="field-emoji" id="emoji-btn" aria-label="Эмодзи" title="Эмодзи">
            <svg class="i"><use href="#i-smile"/></svg>
          </button>
        </div>

        <button type="button" class="round-btn" id="mic-btn" aria-label="Голосовое сообщение" title="Голосовое сообщение">
          <svg class="i"><use href="#i-mic"/></svg>
        </button>

        <button type="submit" class="send-btn" id="send-btn" aria-label="Отправить" title="Отправить">
          <svg class="i"><use href="#i-send"/></svg>
        </button>

        <div class="pop attach-pop" id="attach-pop" hidden>
          <button type="button" class="pop-item" data-attach="file">
            <span class="pop-ic"><svg class="i"><use href="#i-file"/></svg></span>
            <span><b>Файл</b><small>до 200 МБ в демо-тарифе</small></span>
          </button>
          <button type="button" class="pop-item" data-attach="image">
            <span class="pop-ic"><svg class="i"><use href="#i-image"/></svg></span>
            <span><b>Изображение</b><small>PNG, JPG, WebP</small></span>
          </button>
          <button type="button" class="pop-item" data-attach="audio">
            <span class="pop-ic"><svg class="i"><use href="#i-music"/></svg></span>
            <span><b>Аудио или песня</b><small>MP3 · обложка и ID3-теги</small></span>
          </button>
          <button type="button" class="pop-item" data-attach="poll">
            <span class="pop-ic"><svg class="i"><use href="#i-poll"/></svg></span>
            <span><b>Опрос</b><small>плагин «Опросы» включён</small></span>
          </button>
          <button type="button" class="pop-item" data-attach="task">
            <span class="pop-ic"><svg class="i"><use href="#i-task"/></svg></span>
            <span><b>Задача</b><small>плагин «Задачи» включён</small></span>
          </button>
        </div>

        <div class="pop sticker-pop" id="sticker-pop" hidden>
          <div class="pop-head">
            <span>Стикеры</span>
            <small>набор «Сова»</small>
          </div>
          <div class="sticker-grid" id="sticker-grid"></div>
        </div>

        <div class="pop emoji-pop" id="emoji-pop" hidden>
          <div class="emoji-grid" id="emoji-grid"></div>
        </div>
      </form>

      <div class="composer-note" id="composer-note"></div>
    </div>

  </main>

  <!-- ══════════ DETAILS ══════════ -->
  <aside class="details" id="details" aria-label="О чате">
    <button class="details-close" id="details-close" aria-label="Закрыть панель">
      <svg class="i"><use href="#i-x"/></svg>
    </button>
    <div class="details-inner" id="details-inner"></div>
  </aside>

  <aside class="thread" id="thread" hidden aria-label="Тред">
    <header class="thread-head">
      <div class="thread-heading">
        <span class="thread-eyebrow">Тред</span>
        <h2 class="thread-title" id="thread-title">Обсуждение</h2>
      </div>
      <button class="icon-btn" id="thread-close" aria-label="Закрыть тред" title="Закрыть тред">
        <svg class="i"><use href="#i-x"/></svg>
      </button>
    </header>
    <div class="thread-body" id="thread-body"></div>
    <form class="thread-composer" id="thread-composer" autocomplete="off">
      <textarea id="thread-input" rows="1" placeholder="Ответить в треде…" aria-label="Ответ в треде"></textarea>
      <button type="submit" class="send-btn" id="thread-send" aria-label="Отправить в тред">
        <svg class="i"><use href="#i-send"/></svg>
      </button>
    </form>
  </aside>

  <section class="page" id="page" hidden aria-label="Раздел пространства">
    <header class="page-head">
      <button class="page-back" id="page-back" aria-label="Назад в чат" title="Назад в чат">
        <svg class="i"><use href="#i-arrow-left"/></svg>
      </button>
      <div class="page-heading">
        <span class="page-eyebrow" id="page-eyebrow"></span>
        <h1 class="page-title" id="page-title"></h1>
      </div>
      <div class="page-actions" id="page-actions"></div>
    </header>
    <div class="page-body" id="page-body"></div>
  </section>

  <div class="modal-layer" id="modal-layer" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"></div>
  </div>

  <div class="scrim" id="scrim" hidden></div>

</div>

<div class="toast" id="toast" role="status" hidden></div>

<input type="file" id="audio-input" accept="audio/*,.mp3,.m4a" hidden />
<script src="app.js"></script>
</body>
</html>
