<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" role="img" aria-label="Макет экрана онбординга приложения Круг с крупной кнопкой «Начать»">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EDE6D8"/>
      <stop offset="1" stop-color="#DFD5C3"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2C6E5A"/>
      <stop offset="1" stop-color="#1A4E3F"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F6B57"/>
      <stop offset="1" stop-color="#2E846D"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#3C3A32" flood-opacity=".22"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.045"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="720" height="520" fill="url(#bg)"/>

  <!-- декоративные круги -->
  <circle cx="96" cy="92" r="58" fill="#F3ECDF" opacity=".55"/>
  <circle cx="648" cy="440" r="84" fill="#C9B99E" opacity=".25"/>
  <path d="M60 430c40-30 78-28 118 0" fill="none" stroke="#9B8C74" stroke-opacity=".3" stroke-width="1.4"/>

  <!-- карточка -->
  <g filter="url(#shadow)">
    <rect x="180" y="40" width="360" height="440" rx="28" fill="#FBF9F4"/>
  </g>

  <!-- шапка карточки -->
  <path d="M208 68h304a20 20 0 0 1 20 20v186H188V88a20 20 0 0 1 20-20Z" fill="url(#hero)"/>

  <!-- логотип -->
  <g transform="translate(220 92)">
    <rect width="30" height="30" rx="9" fill="#F5FBF8" opacity=".14"/>
    <path d="M15 5.5a9.5 9.5 0 1 0 9.5 9.5" stroke="#EAF6F0" stroke-width="2.3" fill="none" stroke-linecap="round"/>
    <circle cx="15" cy="15" r="2.7" fill="#EAF6F0"/>
    <circle cx="24.5" cy="15" r="1.8" fill="#EAF6F0"/>
  </g>
  <text x="260" y="114" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="650" fill="#F1FAF6" letter-spacing="-.3">круг<tspan fill="#8FE3C7">.</tspan></text>

  <!-- иллюстрация: люди в круге -->
  <g transform="translate(360 188)">
    <circle r="66" fill="none" stroke="#F0FAF5" stroke-opacity=".18" stroke-width="1.2"/>
    <circle r="46" fill="none" stroke="#F0FAF5" stroke-opacity=".26" stroke-width="1.2" stroke-dasharray="2 5"/>
    <circle cx="-34" cy="-18" r="14" fill="#C97C5C"/>
    <circle cx="0" cy="-34" r="15" fill="#E8CFA6"/>
    <circle cx="36" cy="-12" r="13" fill="#8FB8A2"/>
    <circle cx="22" cy="30" r="16" fill="#B7A0C4"/>
    <circle cx="-26" cy="26" r="12" fill="#D9B17E"/>
    <circle r="7" fill="#F5FBF8"/>
    <path d="M-7 0 0 7 7 0" fill="none" stroke="#1F6B57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- заголовок -->
  <text x="360" y="292" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="23" font-weight="700" fill="#18201C" letter-spacing="-.7">Добро пожаловать</text>
  <text x="360" y="317" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#6C756F">Ваш круг. Только свои.</text>

  <!-- описание -->
  <rect x="224" y="338" width="272" height="6" rx="3" fill="#DAD5C9"/>
  <rect x="248" y="352" width="224" height="6" rx="3" fill="#E3DED3"/>
  <rect x="270" y="366" width="180" height="6" rx="3" fill="#E3DED3"/>

  <!-- кнопка -->
  <g filter="url(#shadow)">
    <rect x="220" y="394" width="280" height="44" rx="12" fill="url(#btn)"/>
  </g>
  <text x="360" y="421" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="650" fill="#F7FCFA">Начать</text>

  <!-- индикаторы -->
  <g transform="translate(336 460)">
    <rect x="0" y="0" width="18" height="5" rx="2.5" fill="#1F6B57"/>
    <circle cx="26" cy="2.5" r="2.5" fill="#CDC7BA"/>
    <circle cx="36" cy="2.5" r="2.5" fill="#CDC7BA"/>
  </g>

  <!-- плавающие карточки -->
  <g filter="url(#shadow)" opacity=".95">
    <rect x="84" y="236" width="116" height="58" rx="14" fill="#FFFFFF"/>
    <circle cx="106" cy="257" r="11" fill="#1F6B57"/>
    <path d="m101 257 3.4 3.4 6-6" stroke="#F4FBF8" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="124" y="250" width="54" height="5" rx="2.5" fill="#DAD5C9"/>
    <rect x="124" y="261" width="38" height="5" rx="2.5" fill="#E7E2D7"/>
    <rect x="100" y="278" width="76" height="4" rx="2" fill="#EFEBE2"/>
  </g>

  <g filter="url(#shadow)" opacity=".95">
    <rect x="540" y="300" width="104" height="70" rx="14" fill="#FFFFFF"/>
    <rect x="554" y="316" width="42" height="5" rx="2.5" fill="#DAD5C9"/>
    <rect x="554" y="328" width="76" height="4" rx="2" fill="#EFEBE2"/>
    <rect x="554" y="340" width="30" height="16" rx="8" fill="#E3EFE9"/>
    <text x="569" y="351" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" font-weight="700" fill="#1F6B57">E2EE</text>
    <circle cx="614" cy="348" r="8" fill="#F6ECDB"/>
    <path d="M610 348h8M614 344v8" stroke="#A4681F" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <rect width="720" height="520" filter="url(#grain)" opacity=".85"/>
</svg>
